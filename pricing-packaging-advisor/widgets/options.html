<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare pricing options</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #888;border-radius:12px;padding:14px}button{font:inherit;padding:9px 14px;font-weight:700}</style></head><body><h1>Compare pricing options</h1><div id="options" class="grid"></div><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Pricing and Packaging Advisor",version:"1.0.0"},{},{autoResize:true}),root=document.querySelector("#options"),status=document.querySelector("#status");const text=r=>r.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Selection failed.";function render(data){root.replaceChildren();const options=data.options||[];options.forEach((option,index)=>{const report=(data.reports||[])[index],card=document.createElement("article"),title=document.createElement("h2"),tiers=document.createElement("ul"),issues=document.createElement("p"),button=document.createElement("button");card.className="card";title.textContent=option.name;option.tiers.forEach(t=>{const li=document.createElement("li");li.textContent=`${t.name}: ${t.price} ${t.currency}/${t.billingPeriod} - ${t.valueMetric}`;tiers.append(li)});issues.textContent=report?.valid?"Ready to select.":`Issues: ${(report?.issues||["Not validated"]).join(" ")}`;button.textContent=`Select option ${index+1}`;button.disabled=!report?.valid;button.onclick=async()=>{button.disabled=true;try{const r=await app.callServerTool({name:"select_pricing_option",arguments:{brief:data.brief,approvalReceipt:data.approvalReceipt,options,selected:index+1}});if(r.isError)throw Error(text(r));const selected=r.structuredContent;if(!selected?.selectionReceipt)throw Error("No receipt returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Selected pricing option ${index+1}. Receipt: ${JSON.stringify(selected.selectionReceipt)}`}]});status.textContent=`Option ${index+1} selected.`;render(selected)}catch(e){status.textContent=e.message||"Selection failed.";button.disabled=false}};card.append(title,tiers,issues,button);root.append(card)})}app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The pricing options could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
