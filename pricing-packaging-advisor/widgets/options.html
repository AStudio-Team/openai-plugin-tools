<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare pricing options</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #888;border-radius:12px;padding:14px}button{font:inherit;padding:9px 14px;margin:4px;font-weight:700}textarea{box-sizing:border-box;width:100%}</style></head><body><h1>Compare pricing options</h1><div id="variants" class="grid"></div><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Pricing Option Comparison",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#variants"),status=document.querySelector("#status"),plain=o=>({name:o.name,tiers:o.tiers,competitorReferences:o.competitorReferences||[]});const section=(title,items)=>{const box=document.createElement("section"),h=document.createElement("h3"),list=document.createElement("ul");h.textContent=title;for(const item of items||[]){const li=document.createElement("li");li.textContent=typeof item==="string"?item:item.message||JSON.stringify(item);list.append(li)}box.append(h,list);return box};function showExport(file){const box=document.createElement("section"),title=document.createElement("h2"),copy=document.createElement("button"),area=document.createElement("textarea");box.className="card exported-content";title.textContent=file.fileName;copy.textContent="Copy";area.readOnly=true;area.rows=18;area.value=file.content;copy.onclick=async()=>{if(globalThis.navigator?.clipboard)await globalThis.navigator.clipboard.writeText(area.value);else{area.select();document.execCommand?.("copy")}};box.append(title,copy,area);root.append(box)}async function exportSelected(data,format){status.textContent=`Preparing ${format} export...`;let response;try{response=await app.callServerTool({name:"export_pricing_plan",arguments:{brief:data.brief,option:plain(data.selected),selectionReceipt:data.selectionReceipt,format}})}catch{status.textContent="Export failed. Select the option again.";return}if(response.isError){status.textContent=response.content?.filter(item=>item.type==="text").map(item=>item.text).join("\n")||"Export failed.";return}const file=response.structuredContent;if(!file?.content){status.textContent="Export failed. Select the option again.";return}showExport(file);status.textContent=`${file.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName} (${file.mimeType}); the content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});if(downloaded?.isError)throw new Error("download denied")}catch{status.textContent+=" Download is not available in this host."}}function selectedActions(data){const box=document.createElement("section"),title=document.createElement("h2");box.className="card";title.textContent=`Option ${data.selectedIndex} selected: ${data.selected.name}`;box.append(title,section("Tier preview",data.selected.tiers.map(t=>`${t.name}: ${t.price} ${t.currency}/${t.billingPeriod} - ${t.valueMetric}`)));const revise=document.createElement("button");revise.textContent="Request revision";revise.onclick=async()=>{try{await app.sendMessage({role:"user",content:[{type:"text",text:`Please revise the selected pricing option: ${JSON.stringify(data.selected)}`}]});status.textContent="Revision requested in chat."}catch{status.textContent="Revision request was not delivered."}};box.append(revise);for(const format of ["markdown","csv"]){const button=document.createElement("button");button.textContent=`Export ${format === "markdown" ? "Markdown" : "CSV"}`;button.onclick=()=>exportSelected(data,format);box.append(button)}root.append(box)}function render(data){if(data.selected&&data.selectionReceipt){root.replaceChildren();selectedActions(data);return}const options=(data.options||[]).map(plain);root.replaceChildren();options.forEach((option,index)=>{const report=(data.reports||[])[index],card=document.createElement("article"),h=document.createElement("h2");card.className="card";h.textContent=option.name;card.append(h,section("Tiers",option.tiers.map(t=>`${t.name}: ${t.price} ${t.currency}/${t.billingPeriod} - ${t.valueMetric}`)),section("Issues",report?.issues));const button=document.createElement("button");button.textContent=`Select option ${index+1}`;button.disabled=!report?.valid;button.onclick=async()=>{button.disabled=true;try{const result=await app.callServerTool({name:"select_pricing_option",arguments:{brief:data.brief,approvalReceipt:data.approvalReceipt,options,selected:index+1}});const selected=result.structuredContent;if(!selected?.selectionReceipt)throw new Error("No receipt returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Selected pricing option ${index+1}. Selection receipt: ${JSON.stringify(selected.selectionReceipt)}`}]});status.textContent=`Option ${index+1} selected.`;render(selected)}catch{status.textContent="Selection failed.";button.disabled=false}};card.append(button);root.append(card)})}app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The pricing options could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
