<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:700;margin-top:12px}input,textarea,select,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:70px}button{margin-top:16px;font-weight:700}</style></head><body><h1>Build your pricing brief</h1><p>Paste planning inputs only. This app does not fetch competitor data or connect to accounts.</p><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Pricing Brief",version:"1.0.0"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let prefill={};const labels={product:"Product",customerSegments:"Customer segments, one per line",currentPlans:"Current plans as JSON array",currency:"Currency",billingPeriods:"Billing periods, one per line",candidateValueMetrics:"Candidate value metrics, one per line",competitorPricePoints:"Competitor price points as JSON array",goal:"Goal",constraints:"Constraints, one per line",proofPoints:"Supplied facts or proof points, one per line"},lists=new Set(["customerSegments","billingPeriods","candidateValueMetrics","constraints","proofPoints"]),json=new Set(["currentPlans","competitorPricePoints"]);function render(data={}){prefill=data.prefill||prefill;form.replaceChildren();for(const name of Object.keys(labels)){const label=document.createElement("label");label.textContent=labels[name];label.htmlFor=name;let field;if(name==="goal"){field=document.createElement("select");for(const value of ["new pricing","repackaging","price increase","upgrade conversion"]){const option=document.createElement("option");option.value=option.textContent=value;field.append(option)}}else field=document.createElement(lists.has(name)||json.has(name)?"textarea":"input");field.id=field.name=name;const value=prefill[name];field.value=Array.isArray(value)?(json.has(name)?JSON.stringify(value):value.join("\n")):value||"";if(!["currentPlans","competitorPricePoints","constraints","proofPoints"].includes(name))field.required=true;form.append(label,field)}const button=document.createElement("button");button.textContent="Review brief";button.type="submit";form.append(button)}form.onsubmit=async event=>{event.preventDefault();try{const data=Object.fromEntries(new FormData(form));for(const name of lists)data[name]=String(data[name]).split(/\n+/).map(x=>x.trim()).filter(Boolean);for(const name of json)data[name]=data[name]?JSON.parse(data[name]):[];status.textContent="Opening review";const result=await app.callServerTool({name:"review_pricing_brief",arguments:data});const reviewed=result.structuredContent;if(!reviewed?.normalizedBrief)throw new Error("No reviewed brief returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Show me the reviewed pricing brief for explicit approval: ${JSON.stringify(reviewed.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed. Check required fields and JSON arrays."}};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Fields are ready; host connection is unavailable."}
</script></body></html>
