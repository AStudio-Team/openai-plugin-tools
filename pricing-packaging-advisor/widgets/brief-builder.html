<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing page brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:700;margin-top:12px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:70px}button{margin-top:16px;font-weight:700}</style></head><body><h1>Build your page brief</h1><p>Paste text only. This app does not fetch or change websites.</p><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Landing Page Brief",version:"1.0.1"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let prefill={};const labels={pageType:"Page type",product:"Product",audience:"Audience",offer:"Offer",goal:"Goal",tone:"Tone",currentCopy:"Current copy (optional)",mustKeepFacts:"Must-keep facts, one per line"};function render(data={}){prefill=data.prefill||prefill;form.replaceChildren();for(const name of Object.keys(labels)){const label=document.createElement("label");label.textContent=labels[name];label.htmlFor=name;const field=document.createElement(name==="currentCopy"||name==="mustKeepFacts"?"textarea":"input");field.id=field.name=name;field.value=Array.isArray(prefill[name])?prefill[name].join("\n"):prefill[name]||"";if(!["currentCopy"].includes(name))field.required=true;form.append(label,field)}const button=document.createElement("button");button.textContent="Review brief";button.type="submit";form.append(button)}form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.mustKeepFacts=String(data.mustKeepFacts).split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!data.currentCopy)delete data.currentCopy;status.textContent="Opening review";try{const result=await app.callServerTool({name:"review_page_brief",arguments:data});const reviewed=result.structuredContent;if(!reviewed?.normalizedBrief)throw new Error("No reviewed brief returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Show me the reviewed landing page brief for explicit approval: ${JSON.stringify(reviewed.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed. Check every required field."}};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Fields are ready; host connection is unavailable."}
</script></body></html>
