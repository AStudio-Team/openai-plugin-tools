<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export pricing plan</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px 16px;margin:5px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px;max-height:420px;overflow:auto}</style></head><body><h1>Export selected pricing plan</h1><p>Download the selected plan as Markdown or CSV.</p><button data-format="markdown">Download Markdown</button><button data-format="csv">Download CSV</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Pricing Plan Export",version:"1.0.0"},{},{autoResize:true});let input={},data={};const status=document.querySelector("#status"),preview=document.querySelector("#file"),toolText=r=>r.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";function show(file){if(!file?.content)return;preview.textContent=file.content;preview.hidden=false}async function download(format){try{const r=await app.callServerTool({name:"export_pricing_plan",arguments:{brief:input.brief||data.brief,option:input.option||data.selected,selectionReceipt:input.selectionReceipt||data.selectionReceipt,format}});if(r.isError)throw Error(toolText(r));const file=r.structuredContent;if(!file?.content)throw Error("Export failed.");show(file);status.textContent=`${file.fileName} is ready.`;await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName}.`}]})}catch(e){status.textContent=e.message||"Export failed."}}document.querySelectorAll("button").forEach(b=>b.onclick=()=>download(b.dataset.format));app.ontoolinput=e=>{input=e.arguments||e||{}};app.ontoolresult=e=>{data=e.structuredContent||{};show(data)};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
