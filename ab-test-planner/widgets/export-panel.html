<!doctype html><html><body><h1>Export test plan</h1><h2 id="name"></h2><button id="copy" hidden>Copy</button><p id="status"></p><pre id="file"></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"A/B Test Export",version:"1.0.0"},{},{autoResize:true}),name=document.querySelector("#name"),copy=document.querySelector("#copy"),status=document.querySelector("#status"),file=document.querySelector("#file");function render(out){if(!out?.content)return;name.textContent=out.fileName;file.textContent=out.content;copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(out.content);status.textContent="Copied."}catch{status.textContent="Copy failed."}};status.textContent=`${out.fileName} is ready.`}app.ontoolresult=async e=>{try{const out=e.structuredContent||{};render(out);if(!out.content)return;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${out.fileName}; it is visible in the export panel.`}]})}catch{status.textContent+=" Chat announcement failed."}try{await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${out.fileName}`,mimeType:out.mimeType,text:out.content}}]})}catch{status.textContent+=" Download unavailable."}}catch{status.textContent="Export could not be shown."}};try{await app.connect()}catch{status.textContent="Host unavailable."}
</script></body></html>
