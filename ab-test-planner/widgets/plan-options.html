<!doctype html><html><body><h1>Plan preview</h1><p id="sample"></p><h2>Issues</h2><ul id="issues"></ul><textarea id="instruction"></textarea><button id="revise">Request revision</button><button id="export">Export</button><button id="copy" hidden>Copy</button><p id="status" aria-live="polite"></p><pre id="file"></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"A/B Test Plan Preview",version:"1.0.0"},{},{autoResize:true}),status=document.querySelector("#status"),file=document.querySelector("#file"),copy=document.querySelector("#copy");let state={};function render(data){state={...state,...Object.fromEntries(Object.entries(data||{}).filter(([,v])=>v!==undefined))};const s=state.sampleSize||{};document.querySelector("#sample").textContent=`${s.perVariant??"?"} per variant, ${s.total??"?"} total, ${s.weeks??"?"} whole weeks. ${s.formula||""}`;const list=document.querySelector("#issues");list.replaceChildren();for(const issue of state.validation?.issues||[]){const li=document.createElement("li");li.textContent=`${issue.code} (${issue.field}): ${issue.message}`;list.append(li)}}copy.onclick=async()=>{if(globalThis.navigator?.clipboard)await globalThis.navigator.clipboard.writeText(file.textContent);else{const range=document.createRange?.();if(range){range.selectNodeContents(file);globalThis.getSelection?.().removeAllRanges();globalThis.getSelection?.().addRange(range)}document.execCommand?.("copy")}};document.querySelector("#revise").onclick=async e=>{e.target.disabled=true;try{const instruction=document.querySelector("#instruction").value.trim();if(!instruction)throw Error();const r=await app.callServerTool({name:"request_test_revision",arguments:{instruction}});if(r.isError)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Revise the A/B test plan: ${instruction}`}]});status.textContent="Revision requested."}catch{status.textContent="Revision failed.";e.target.disabled=false}};document.querySelector("#export").onclick=async e=>{e.target.disabled=true;let r;try{r=await app.callServerTool({name:"export_test_plan",arguments:{brief:state.brief,approvalReceipt:state.approvalReceipt,plan:state.validation.plan,format:"markdown"}})}catch{status.textContent="Export failed.";e.target.disabled=false;return}const out=r.structuredContent;if(r.isError||!out?.content){status.textContent="Export failed. Resolve validation issues first.";e.target.disabled=false;return}file.textContent=out.content;copy.hidden=false;status.textContent=`${out.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${out.fileName}; it is visible in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${out.fileName}`,mimeType:out.mimeType,text:out.content}}]})}catch{status.textContent+=" Download unavailable."}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="Plan could not be rendered."}};try{await app.connect()}catch{status.textContent="Host unavailable."}
</script></body></html>
