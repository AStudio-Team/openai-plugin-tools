<!doctype html><html><body><h1>Plan preview</h1><p id="sample"></p><h2>Issues</h2><ul id="issues"></ul><textarea id="instruction"></textarea><button id="revise">Request revision</button><button id="export">Export</button><p id="status"></p><pre id="file"></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"A/B Test Plan Preview",version:"1.0.0"},{},{autoResize:true}),status=document.querySelector("#status"),file=document.querySelector("#file");let state={};function render(data){state={...state,...Object.fromEntries(Object.entries(data||{}).filter(([,v])=>v!==undefined))};const s=state.sampleSize||{};document.querySelector("#sample").textContent=`${s.perVariant??"?"} per variant, ${s.total??"?"} total, ${s.weeks??"?"} whole weeks`;const list=document.querySelector("#issues");list.replaceChildren();for(const x of state.validation?.issues||[]){const li=document.createElement("li");li.textContent=x;list.append(li)}}document.querySelector("#revise").onclick=async e=>{e.target.disabled=true;try{const instruction=document.querySelector("#instruction").value.trim(),r=await app.callServerTool({name:"request_test_revision",arguments:{instruction}});if(r.isError)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Revise the A/B test plan: ${instruction}`}]});status.textContent="Revision requested."}catch{status.textContent="Revision failed.";e.target.disabled=false}};document.querySelector("#export").onclick=async e=>{e.target.disabled=true;try{const r=await app.callServerTool({name:"export_test_plan",arguments:{brief:state.brief,approvalReceipt:state.approvalReceipt,plan:state.validation.plan,format:"markdown"}}),out=r.structuredContent;if(r.isError||!out?.content)throw Error();file.textContent=out.content;status.textContent=`${out.fileName} is ready.`;await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${out.fileName}; it is visible in the card.`}]});try{await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${out.fileName}`,mimeType:out.mimeType,text:out.content}}]})}catch{status.textContent+=" Download unavailable."}}catch{status.textContent="Export failed.";e.target.disabled=false}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="Plan could not be rendered."}};try{await app.connect()}catch{status.textContent="Host unavailable."}
</script></body></html>
