<!doctype html><html><body><h1>Build your A/B test brief</h1><form id="form"></form><p id="status"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"A/B Test Brief",version:"1.0.0"},{},{autoResize:true}),form=document.querySelector("#form"),status=document.querySelector("#status");let stored={};const fields={pageOrFeature:"Page or feature",changeIdea:"Change idea",primaryMetric:"Primary metric",baselineConversionRate:"Baseline conversion rate (%)",weeklyVisitors:"Weekly visitors",minimumDetectableEffect:"Relative MDE (%)",variants:"Variants including control",confidence:"Confidence",power:"Power"};function render(data={}){stored={...stored,...Object.fromEntries(Object.entries(data.prefill||{}).filter(([,v])=>v!==undefined))};form.replaceChildren();for(const [key,labelText] of Object.entries(fields)){const label=document.createElement("label"),input=document.createElement("input");label.textContent=labelText;input.name=key;input.required=true;input.value=stored[key]??"";form.append(label,input)}const button=document.createElement("button");button.textContent="Review brief";form.append(button)}form.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(form)),args={pageOrFeature:v.pageOrFeature,changeIdea:v.changeIdea,primaryMetric:v.primaryMetric,baselineConversionRate:Number(v.baselineConversionRate),weeklyVisitors:Number(v.weeklyVisitors),minimumDetectableEffect:Number(v.minimumDetectableEffect),variants:Number(v.variants),confidence:Number(v.confidence),power:Number(v.power)};try{const r=await app.callServerTool({name:"review_test_brief",arguments:args});if(r.isError)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Show this reviewed A/B test brief for approval: ${JSON.stringify(r.structuredContent.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed."}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="Brief could not be rendered."}};render();try{await app.connect()}catch{status.textContent="Host unavailable."}
