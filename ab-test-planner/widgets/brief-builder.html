<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A/B test brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:700;margin-top:12px}input,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:70px}button{margin-top:16px;font-weight:700}</style></head><body><h1>Build your A/B test brief</h1><p>Describe one change and list any facts or proof points the plan may claim.</p><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"A/B Test Brief",version:"1.0.0"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let prefill={};const labels={pageOrFeature:"Page or feature",changeIdea:"Change idea",primaryMetric:"Primary metric",baselineConversionRate:"Baseline conversion rate (%)",weeklyVisitors:"Weekly visitors entering the test",minimumDetectableEffect:"Minimum detectable effect, relative (%)",variants:"Variants including control",confidence:"Confidence (%)",power:"Power (%)",suppliedFacts:"Supplied facts, one per line",proofPoints:"Proof points, one per line"};const numeric=new Set(["baselineConversionRate","weeklyVisitors","minimumDetectableEffect","variants","confidence","power"]);function render(data={}){prefill=data.prefill||prefill;form.replaceChildren();for(const name of Object.keys(labels)){const label=document.createElement("label");label.textContent=labels[name];label.htmlFor=name;const field=document.createElement(name==="suppliedFacts"||name==="proofPoints"?"textarea":"input");field.id=field.name=name;field.value=Array.isArray(prefill[name])?prefill[name].join("\n"):prefill[name]??"";if(numeric.has(name)){field.type="number";field.step=name==="weeklyVisitors"||name==="variants"?"1":"any"}if(!["suppliedFacts","proofPoints"].includes(name))field.required=true;form.append(label,field)}const button=document.createElement("button");button.textContent="Review brief";button.type="submit";form.append(button)}form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));for(const name of numeric)data[name]=Number(data[name]);for(const name of ["suppliedFacts","proofPoints"])data[name]=String(data[name]).split(/\n+/).map(x=>x.trim()).filter(Boolean);status.textContent="Opening review";try{const result=await app.callServerTool({name:"review_test_brief",arguments:data});const reviewed=result.structuredContent;if(!reviewed?.normalizedBrief)throw new Error("No reviewed brief returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Show me the reviewed A/B test brief for explicit approval: ${JSON.stringify(reviewed.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed. Check every required field."}};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Fields are ready; host connection is unavailable."}
</script></body></html>
