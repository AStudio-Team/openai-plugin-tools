<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review test brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}.card{border:1px solid #888;border-radius:10px;padding:12px;margin:8px 0}button{font:inherit;padding:10px 16px;font-weight:700}</style></head><body><h1>Review A/B test brief</h1><div id="brief"></div><button id="approve" disabled>Approve brief</button><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"A/B Test Brief Review",version:"1.0.0"},{},{autoResize:true});let state;const root=document.querySelector("#brief"),approve=document.querySelector("#approve"),status=document.querySelector("#status"),label=key=>key.replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/[_-]+/g," ").toLowerCase().replace(/^./,letter=>letter.toUpperCase());function valueNode(value){if(Array.isArray(value)){const list=document.createElement("ul");for(const entry of value){const item=document.createElement("li");item.textContent=entry&&typeof entry==="object"?Object.entries(entry).map(([key,itemValue])=>`${label(key)}: ${itemValue}`).join("; "):String(entry);list.append(item)}return list}const text=document.createElement("p");text.textContent=value??"None";return text}function render(data){state=data;root.replaceChildren();for(const [key,value] of Object.entries(data.normalizedBrief||{})){const card=document.createElement("section");card.className="card";const strong=document.createElement("strong");strong.textContent=label(key);card.append(strong,valueNode(value));root.append(card)}for(const issue of data.issues||[]){const card=document.createElement("section");card.className="card";card.textContent=`${issue.code} (${issue.field}): ${issue.message}`;root.append(card)}approve.disabled=!data.canApprove}approve.onclick=async()=>{approve.disabled=true;try{const result=await app.callServerTool({name:"approve_test_brief",arguments:{brief:state.normalizedBrief,approvalAction:"approve"}});const receipt=result.structuredContent?.approvalReceipt;if(!receipt)throw new Error("No receipt returned");await app.sendMessage({role:"user",content:[{type:"text",text:`I explicitly approved this A/B test brief. Create a test plan using this signed approval receipt: ${JSON.stringify(receipt)}`}]});status.textContent="Brief approved with a signed receipt."}catch{status.textContent="Approval failed. Try again.";approve.disabled=false}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The brief could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
