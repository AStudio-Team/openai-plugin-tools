<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export launch plan</title><style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui;margin:1rem;max-width:760px}button{min-height:44px;margin:.3rem;border:0;border-radius:999px;padding:10px 18px;background:#12694f;color:#fff;font-weight:800}#status{font-weight:700}</style></head><body><h1>Export launch plan</h1><p>The plan must pass server validation. Nothing is published.</p><button id="markdown">Download Markdown</button><button id="csv">Download CSV</button><p id="status" role="alert">Review the validated plan before exporting.</p><script type="module">/*__EXT_APPS_BUNDLE__*/
(async()=>{
const {App}=globalThis.ExtApps,app=new App({name:"LaunchPlanExport",version:"1.0.0"},{},{autoResize:true}),status=document.querySelector("#status");let input={};app.ontoolinput=e=>{try{input=e.arguments||e||{}}catch{status.textContent="Export input could not be read."}};app.ontoolresult=e=>{try{input={...input,...(e.structuredContent||{})}}catch{status.textContent="Export result could not be read."}};function show(name,text){let box=document.querySelector("#exported-content");if(!box){box=document.createElement("section");box.id="exported-content";const title=document.createElement("h2"),copy=document.createElement("button"),area=document.createElement("textarea");title.id="exported-name";copy.textContent="Copy";area.readOnly=true;area.rows=18;copy.onclick=async()=>{if(globalThis.navigator?.clipboard)await globalThis.navigator.clipboard.writeText(area.value);else{area.select();document.execCommand?.("copy")}};box.append(title,copy,area);document.body.append(box)}box.querySelector("h2").textContent=name;box.querySelector("textarea").value=text}const toolText=result=>result.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";async function download(format){if(!input.brief||!input.receipt||!input.plan){status.textContent="The approved brief, receipt, and plan are required.";return}try{const result=await app.callServerTool({name:"export_launch_plan",arguments:{brief:input.brief,receipt:input.receipt,plan:input.plan}});if(result.isError){status.textContent=toolText(result);return}const data=result.structuredContent,content=format==="markdown"?data?.markdown:data?.csv,name=format==="markdown"?"launch-plan.md":"launch-plan.csv",mimeType=format==="markdown"?"text/markdown":"text/csv";if(content==null)throw new Error("No export returned");show(name,content);status.textContent=`${name} is ready. Copy the text below.`;await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${name} (${mimeType}); the content is shown in the card.`}]});try{const outcome=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${name}`,mimeType,text:content}}]});if(outcome?.isError)throw new Error("download denied")}catch{status.textContent+=" Download is not available in this host."}}catch{status.textContent=`${format} export failed. Ask the host to show the export text.`}}document.querySelector("#markdown").onclick=()=>download("markdown");document.querySelector("#csv").onclick=()=>download("csv");try{await app.connect()}catch{status.textContent="The app could not connect."}
})().catch(error=>{const target=document.querySelector("#status");if(target)target.textContent="The app could not start.";console.error(error)});</script></body></html>
