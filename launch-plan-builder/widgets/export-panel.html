<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export launch plan</title><style>body{font:16px system-ui;margin:1rem}button{min-height:44px;margin:.3rem}</style></head><body><h1>Export launch plan</h1><p id="status">Review the validated plan before exporting.</p><button id="markdown">Export Markdown</button><button id="csv">Export CSV</button><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"LaunchPlanExport",version:"1.0.0"},{},{autoResize:true});let data;app.ontoolresult=e=>{data=e.structuredContent};function ask(format){if(!data)return;app.sendMessage({role:"user",content:[{type:"text",text:`Export this approved launch plan as ${format}. Use export_launch_plan with the approval receipt.`}]})}document.getElementById("markdown").onclick=()=>ask("Markdown");document.getElementById("csv").onclick=()=>ask("CSV");await app.connect();
</script></body></html>
