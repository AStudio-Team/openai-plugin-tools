<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export launch plan</title><style>:root{color-scheme:light dark}body{font:16px/1.5 system-ui;margin:1rem;max-width:760px}button{min-height:44px;margin:.3rem;border:0;border-radius:999px;padding:10px 18px;background:#12694f;color:#fff;font-weight:800}#status{font-weight:700}</style></head><body><h1>Export launch plan</h1><p>The plan must pass server validation. Nothing is published.</p><button id="markdown">Download Markdown</button><button id="csv">Download CSV</button><p id="status" role="alert">Review the validated plan before exporting.</p><script type="module">/*__EXT_APPS_BUNDLE__*/
(async()=>{
const {App}=globalThis.ExtApps,app=new App({name:"LaunchPlanExport",version:"1.0.0"},{},{autoResize:true}),status=document.querySelector("#status");let input={};app.ontoolinput=e=>{try{input=e.arguments||e||{}}catch{status.textContent="Export input could not be read."}};app.ontoolresult=e=>{try{input={...input,...(e.structuredContent||{})}}catch{status.textContent="Export result could not be read."}};async function download(format){if(!input.brief||!input.receipt||!input.plan){status.textContent="The approved brief, receipt, and plan are required.";return}try{const result=await app.callServerTool({name:"export_launch_plan",arguments:{brief:input.brief,receipt:input.receipt,plan:input.plan}}),data=result.structuredContent,content=format==="markdown"?data.markdown:data.csv,name=format==="markdown"?"launch-plan.md":"launch-plan.csv",mimeType=format==="markdown"?"text/markdown":"text/csv";try{const outcome=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${name}`,mimeType,text:content}}]});if(outcome?.isError)throw new Error("download denied")}catch{throw new Error("download failed")}status.textContent=`${name} is ready. Nothing was retained.`}catch{status.textContent=`${format} export failed. Ask the host to show the export text.`}}document.querySelector("#markdown").onclick=()=>download("markdown");document.querySelector("#csv").onclick=()=>download("csv");try{await app.connect()}catch{status.textContent="The app could not connect."}
})().catch(error=>{const target=document.querySelector("#status");if(target)target.textContent="The app could not start.";console.error(error)});</script></body></html>
