<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch plan preview</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--line:#c8cec8;--accent:#12694f;--bad:#a33030}html.dark{--bg:#151916;--card:#202722;--ink:#f4f4ed;--line:#47534b;--accent:#69d3aa;--bad:#ff9999}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:950px;margin:auto}.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.phase,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.task{margin:9px 0}.task time{color:var(--accent);font-weight:800}.actions{display:flex;gap:8px;margin-top:16px}input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}button{min-height:44px;border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:#fff;font-weight:800}#status{color:var(--bad);font-weight:700}@media(max-width:760px){.phases{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><main><p>Step 3 of 3</p><h1 id="title">Launch plan</h1><p id="validation"></p><div id="phases" class="phases"></div><div class="actions"><input id="instruction" maxlength="1000" placeholder="Describe the revision"><button id="revise">Request revision</button></div><p id="status" role="alert"></p></main><script type="module">(()=>{
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps,app=new App({name:"LaunchPlanPreview",version:"1.0.0"},{},{autoResize:true}),phases=document.querySelector("#phases"),status=document.querySelector("#status"),instruction=document.querySelector("#instruction");let state={};function render(data){state={...state,...data};const plan=data.plan||data;document.querySelector("#title").textContent=plan.title;document.querySelector("#validation").textContent=`Validation: ${data.validation?.status||"not supplied"}`;phases.replaceChildren();for(const phaseName of ["pre-launch","launch week","post-launch"]){const phase=document.createElement("section"),heading=document.createElement("h2");phase.className="phase";heading.textContent=phaseName;phase.append(heading);for(const item of plan.tasks.filter(x=>x.phase===phaseName)){const task=document.createElement("article"),date=document.createElement("time"),name=document.createElement("h3"),meta=document.createElement("p");task.className="task";date.textContent=item.date;name.textContent=item.task;meta.textContent=`${item.owner} | ${item.channel} | ${item.deliverable}`;task.append(date,name,meta);phase.append(task)}phases.append(phase)}state.plan=plan}app.ontoolinput=e=>{try{state={...state,...(e.arguments||e)}}catch{status.textContent="Plan input could not be read."}};app.ontoolresult=e=>{try{render(e.structuredContent)}catch{status.textContent="The launch plan could not be displayed."}};document.querySelector("#revise").onclick=async()=>{const text=instruction.value.trim();if(!text||!state.brief||!state.receipt){status.textContent="Enter a revision and keep the approved brief open.";return}try{const result=await app.callServerTool({name:"request_plan_revision",arguments:{brief:state.brief,receipt:state.receipt,target:"task",instruction:text}});try{await app.sendMessage({role:"user",content:[{type:"text",text:`Apply this visible launch-plan revision, then call draft_launch_plan again: ${result.structuredContent?.revision||text}`}]})}catch{throw new Error("message failed")}status.textContent="Revision requested."}catch{status.textContent="The revision request failed. Try again."}};try{await app.connect()}catch{status.textContent="The app could not connect."}try{document.documentElement.classList.toggle("dark",app.getHostContext?.()?.theme==="dark")}catch{status.textContent="Host settings could not be read."}
})();</script></body></html>
