<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth plan preview</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--muted:#59655d;--line:#c7cec8;--accent:#12694f;--focus:#1671ab;--danger:#a33030}html.dark{--bg:#151916;--card:#202722;--ink:#f5f5ee;--muted:#b8c1ba;--line:#465249;--accent:#69d3aa;--focus:#84d1ff;--danger:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;padding:var(--safe-top,12px) var(--safe-right,12px) var(--safe-bottom,16px) var(--safe-left,12px)}main{max-width:940px;margin:auto}.step{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(26px,5vw,44px);line-height:1;margin:6px 0}.progress{height:5px;background:var(--line);margin:16px 0 20px}.progress span{display:block;width:100%;height:100%;background:var(--accent)}.summary{background:var(--accent);color:#fff;border-radius:17px;padding:20px}.summary h2{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.wide{grid-column:1/-1}.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}.timeline{border-left:2px solid var(--accent);padding-left:14px;margin:12px 0}.timeline strong{display:block}.claim{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding:7px 0}.badge{font-size:11px;font-weight:800;color:var(--accent)}ul{padding-left:19px}.notice{font-size:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;position:sticky;bottom:0;padding-top:22px;background:linear-gradient(transparent,var(--bg) 30%)}button{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 13px system-ui;padding:10px 14px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}#status{color:var(--danger);font-weight:700;min-height:22px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions button{flex:1}}</style></head><body><main><div class="step">Step 4 of 4</div><h1 id="title">Final growth plan</h1><p>Review before exporting. This plan has not launched anything.</p><div class="progress" aria-label="100 percent complete"><span></span></div><section id="summary" class="summary"></section><div id="grid" class="grid" aria-live="polite"></div><p class="notice" id="notice"></p><div id="status" role="alert"></div><div class="actions"><button id="revise">Request revision</button><button id="markdown" class="primary">Download Markdown</button><button id="json">Download JSON</button><button id="finish">Finish without export</button></div></main><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"GrowthPlanPreview",version:"1.0.0"},{},{autoResize:true});let plan=null;const grid=document.getElementById("grid");function section(title,items,wide=false){const card=document.createElement("section");card.className=`card${wide?" wide":""}`;const h=document.createElement("h2");h.textContent=title;card.append(h);const list=Array.isArray(items)?items:[items];const ul=document.createElement("ul");for(const item of list||[]){const li=document.createElement("li");li.textContent=typeof item==="string"?item:JSON.stringify(item);ul.append(li)}card.append(ul);grid.append(card);return card}function render(data){plan=data;grid.replaceChildren();document.getElementById("title").textContent=data.title;const summary=document.getElementById("summary");summary.replaceChildren();const h=document.createElement("h2");h.textContent=data.strategy.name||"Selected strategy";const p=document.createElement("p");p.textContent=data.rationale;summary.append(h,p);section("Messaging hypothesis",data.messageHypothesis,true);const action=section("Action plan",[],true);action.querySelector("ul").remove();for(const item of data.actionPlan){const block=document.createElement("div");block.className="timeline";const strong=document.createElement("strong");strong.textContent=item.period;const copy=document.createElement("span");copy.textContent=item.priority;block.append(strong,copy);if(item.indicator){const indicator=document.createElement("p");indicator.textContent=`Indicator: ${item.indicator}`;block.append(indicator)}action.append(block)}section("Weekly priorities",data.weeklyPriorities||[]);section("Themes",data.themes||[]);section("Resource allocation",data.resourceAllocation||[]);section("Leading indicators",data.leadingIndicators);section("Assumptions",data.assumptions);section("Risks and mitigations",data.risks.map(item=>`${item.risk} Mitigation: ${item.mitigation}`),true);const claims=section("Claims requiring proof",[],true);claims.querySelector("ul").remove();for(const item of data.claimLedger){const row=document.createElement("div");row.className="claim";const copy=document.createElement("span");copy.textContent=item.claim;const badge=document.createElement("span");badge.className="badge";badge.textContent=item.status.replaceAll("_"," ");row.append(copy,badge);claims.append(row)}section("Do not do",data.doNotDo,true);section("Decision review",data.reviewPoint,true);document.getElementById("notice").textContent=data.completionNotice}function send(message){return app.sendMessage({role:"user",content:[{type:"text",text:message}]})}async function download(format){if(!plan)return;document.getElementById("status").textContent="Preparing download...";try{const response=await app.callServerTool({name:"export_growth_plan",arguments:{plan,format,fileBaseName:"growth-marketing-plan"}});const data=response.structuredContent||JSON.parse(response.content.find(item=>item.type==="text").text);const outcome=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${data.fileName}`,mimeType:data.mimeType,text:data.content}}]});if(outcome?.isError)throw new Error("Download denied");document.getElementById("status").textContent=`${data.fileName} is ready. The service retained nothing.`}catch{document.getElementById("status").textContent=`Download failed. Ask in chat: export this plan as ${format}, then copy the fenced content.`}}app.ontoolresult=event=>{try{render(event.structuredContent||JSON.parse(event.content.find(item=>item.type==="text").text))}catch{document.getElementById("status").textContent="The plan could not be displayed. Ask the host to print the full plan in chat."}};document.getElementById("revise").onclick=()=>send("Revise the selected growth plan. Ask me for the exact requested change, increment planVersion, and do not launch anything.");document.getElementById("markdown").onclick=()=>download("markdown");document.getElementById("json").onclick=()=>download("json");document.getElementById("finish").onclick=()=>send("Finish Launch Plan Builder without export. Confirm that no campaign was launched, assumptions still require validation, no private plan data was intentionally retained, and results depend on execution and market conditions.");await app.connect();function theme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const inset=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${inset[side]||12}px`)}theme(app.getHostContext?.());app.onhostcontextchanged=theme;
</script></body></html>
