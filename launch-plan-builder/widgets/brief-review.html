<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review growth brief</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--muted:#59655d;--line:#c7cec8;--accent:#12694f;--warn:#8a5b00;--danger:#a33030;--focus:#1671ab}html.dark{--bg:#151916;--card:#202722;--ink:#f5f5ee;--muted:#b8c1ba;--line:#465249;--accent:#69d3aa;--warn:#ffd77a;--danger:#ff9a9a;--focus:#84d1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;padding:var(--safe-top,12px) var(--safe-right,12px) var(--safe-bottom,16px) var(--safe-left,12px)}main{max-width:880px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px}.step{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(25px,5vw,40px);line-height:1;margin:6px 0 12px}.lock{border:1px solid var(--accent);border-radius:999px;padding:7px 11px;height:max-content;font-weight:700}.progress{height:5px;background:var(--line);margin:16px 0 20px}.progress span{display:block;width:50%;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.card p{margin:4px 0}.wide{grid-column:1/-1}.warning{border-left:4px solid var(--warn)}ul{margin:5px 0;padding-left:20px}.notice{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;padding-top:22px;background:linear-gradient(transparent,var(--bg) 30%)}button{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 14px system-ui;padding:10px 15px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.45}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}#status{min-height:22px;color:var(--danger);font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{display:block}.lock{display:inline-block}.actions{flex-wrap:wrap}.actions button{flex:1}}</style></head><body><main><div class="top"><div><div class="step">Step 2 of 4</div><h1>Check the facts first</h1><p>Strategies stay blocked until you confirm this normalized brief.</p></div><div class="lock">Human checkpoint required</div></div><div class="progress" aria-label="50 percent complete"><span></span></div><div id="cards" class="grid" aria-live="polite"></div><p class="notice" id="notice"></p><div id="status" role="alert"></div><div class="actions"><button id="cancel">Cancel</button><button id="edit">Edit brief</button><button id="confirm" class="primary" disabled>Confirm and create three strategies</button></div></main><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"GrowthBriefReview",version:"1.0.0"},{},{autoResize:true});let state=null;const cards=document.getElementById("cards");function add(title,values,wide=false,warning=false){const section=document.createElement("section");section.className=`card${wide?" wide":""}${warning?" warning":""}`;const h=document.createElement("h2");h.textContent=title;section.append(h);const list=Array.isArray(values)?values:[values];if(list.length){for(const value of list){const p=document.createElement("p");p.textContent=String(value);section.append(p)}}else{const p=document.createElement("p");p.textContent="None stated";section.append(p)}cards.append(section)}function render(data){state=data;cards.replaceChildren();const b=data.normalizedBrief;add("Business",[b.business.name||"Unnamed business",b.business.description,`Offer: ${b.business.offer}`,`Stage: ${b.business.stage.replaceAll("_"," ")}`]);add("Goal",[`${b.goal.objective.replaceAll("_"," ")} over ${b.goal.horizonDays} days`,b.goal.successDefinition,b.goal.userSuppliedTarget?`User-supplied target: ${b.goal.userSuppliedTarget}`:"No numeric target supplied"]);add("Audience",[b.audience.description,b.audience.primaryProblem,`Buying stage: ${b.audience.buyingStage}`,`Evidence: ${b.audience.evidenceStatus.replaceAll("_"," ")}`]);add("Channels and capacity",[b.channels.allowed.join(", "),`${b.resources.budgetBand.replaceAll("_"," ")} budget`,`${b.resources.teamSize} people, ${b.resources.weeklyHours} hours/week`]);add("Planning assumptions",data.assumptions,true,data.assumptions.length>0);add("Unsupported or user-supplied claims",data.claimWarnings,true,data.claimWarnings.length>0);add("Excluded activities",data.excludedActivities,true);document.getElementById("notice").textContent=data.privacyNotice;document.getElementById("confirm").disabled=!data.canConfirm}function send(message){return app.sendMessage({role:"user",content:[{type:"text",text:message}]})}app.ontoolresult=event=>{const data=event.structuredContent;try{render(data||JSON.parse(event.content.find(item=>item.type==="text").text))}catch{document.getElementById("status").textContent="The brief could not be displayed. Ask in chat to print the normalized brief, then confirm, edit, or cancel there."}};document.getElementById("edit").onclick=()=>send("Edit the growth brief. Reopen the brief builder with the current normalized brief and do not generate strategies.");document.getElementById("cancel").onclick=()=>send("Cancel Launch Plan Builder. Do not generate strategies.");document.getElementById("confirm").onclick=async()=>{if(!state?.canConfirm)return;document.getElementById("confirm").disabled=true;try{await send(`I explicitly confirm growth brief version 1. Generate exactly three materially distinct strategies from only this confirmed brief, then call compare_growth_strategies with briefConfirmed true. Confirmed brief:\n${JSON.stringify(state.normalizedBrief,null,2)}`);document.getElementById("status").textContent="Brief confirmed. Three strategies may now be created."}catch{document.getElementById("status").textContent="Confirmation could not be sent. Reply 'confirm' in chat to continue."}};await app.connect();function theme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const inset=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${inset[side]||12}px`)}theme(app.getHostContext?.());app.onhostcontextchanged=theme;
</script></body></html>
