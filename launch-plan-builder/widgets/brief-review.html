<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review launch brief</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--line:#c8cec8;--accent:#12694f;--bad:#a33030}html.dark{--bg:#151916;--card:#202722;--ink:#f4f4ed;--line:#47534b;--accent:#69d3aa;--bad:#ff9999}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:850px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.wide{grid-column:1/-1}.card h2{font-size:13px;text-transform:uppercase;margin:0 0 6px}.actions{display:flex;justify-content:flex-end;margin-top:16px}button{min-height:44px;border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:#fff;font-weight:800}button:disabled{opacity:.5}#status{color:var(--bad);font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><p>Step 2 of 3</p><h1>Review the normalized brief</h1><p>Approval is explicit and valid for 30 minutes.</p><div id="cards" class="grid"></div><p id="status" role="alert"></p><div class="actions"><button id="approve" disabled>Approve brief</button></div></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(async()=>{
const {App}=globalThis.ExtApps,app=new App({name:"LaunchBriefReview",version:"1.0.0"},{},{autoResize:true}),cards=document.querySelector("#cards"),status=document.querySelector("#status"),approve=document.querySelector("#approve");let brief;function card(title,text,wide=false){const s=document.createElement("section"),h=document.createElement("h2"),p=document.createElement("p");s.className=`card${wide?" wide":""}`;h.textContent=title;p.textContent=String(text||"None stated");s.append(h,p);cards.append(s)}function render(data){brief=data.brief;cards.replaceChildren();card("Product",brief.whatIsLaunching,true);card("Launch type",brief.launchType);card("Launch date",brief.launchDate);card("Audience",brief.audience,true);card("Channels",brief.channelsAvailable.join(", "),true);card("Team",brief.teamSize);card("Budget",brief.budgetBand);card("Goals",brief.goal,true);card("Constraints",brief.constraints.join("; ")||"None",true);approve.disabled=false}app.ontoolresult=e=>{try{render(e.structuredContent)}catch{status.textContent="The normalized brief could not be displayed."}};approve.onclick=async()=>{if(!brief)return;approve.disabled=true;try{const result=await app.callServerTool({name:"approve_launch_brief",arguments:{brief,action:"approve"}}),receipt=result.structuredContent?.receipt;if(!receipt)throw new Error("missing receipt");try{await app.sendMessage({role:"user",content:[{type:"text",text:`The launch brief was explicitly approved in the review widget. Draft the launch plan, then call draft_launch_plan with this receipt: ${JSON.stringify(receipt)}`}]})}catch{throw new Error("message failed")}status.textContent="Brief approved. The plan may now be drafted."}catch{status.textContent="Approval could not be completed. Review the brief and try again.";approve.disabled=false}};try{await app.connect()}catch{status.textContent="The app could not connect."}try{document.documentElement.classList.toggle("dark",app.getHostContext?.()?.theme==="dark")}catch{status.textContent="Host settings could not be read."}
})().catch(error=>{const target=document.querySelector("#status");if(target)target.textContent="The app could not start.";console.error(error)});</script></body></html>
