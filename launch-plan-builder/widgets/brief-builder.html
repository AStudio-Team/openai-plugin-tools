<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build launch brief</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--muted:#5b675f;--line:#c8cec8;--accent:#12694f;--bad:#a33030}html.dark{--bg:#151916;--card:#202722;--ink:#f4f4ed;--muted:#b6c0b8;--line:#47534b;--accent:#69d3aa;--bad:#ff9999}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}main{max-width:850px;margin:auto}h1{font-size:clamp(26px,5vw,42px);margin:.2em 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label,legend{display:block;font-weight:700;margin-bottom:4px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}textarea{min-height:78px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{font-weight:500}.checks input{width:auto}button{min-height:44px;border:0;border-radius:999px;padding:10px 17px;background:var(--accent);color:#fff;font-weight:800}.actions{display:flex;justify-content:flex-end;margin-top:14px}.muted{color:var(--muted)}#status{color:var(--bad);font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><p class="muted">Step 1 of 3</p><h1>Build the launch brief</h1><p>Define the launch. Nothing is posted, emailed, scheduled, or published.</p><form id="form" class="card"><div class="grid"><div class="wide"><label for="product">Product or release</label><textarea id="product" minlength="3" maxlength="1000" required></textarea></div><div><label for="type">Launch type</label><select id="type" required><option value="new product">New product</option><option value="feature">Feature</option><option value="major update">Major update</option><option value="rebrand">Rebrand</option></select></div><div><label for="date">Launch date</label><input id="date" type="date" required></div><div class="wide"><label for="audience">Audience</label><textarea id="audience" minlength="3" maxlength="800" required></textarea></div><fieldset class="wide"><legend>Channels available</legend><div id="channels" class="checks"></div></fieldset><div><label for="team">Team size</label><input id="team" type="number" min="1" max="1000" value="1" required></div><div><label for="budget">Budget band</label><select id="budget" required><option value="none">None</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="not disclosed">Not disclosed</option></select></div><div class="wide"><label for="goal">Goals</label><textarea id="goal" minlength="3" maxlength="500" required></textarea></div><div class="wide"><label for="constraints">Constraints, one per line</label><textarea id="constraints" maxlength="6000"></textarea></div></div><p id="status" role="alert"></p><div class="actions"><button type="submit">Review brief</button></div></form></main><script type="module">(()=>{
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps,app=new App({name:"LaunchBriefBuilder",version:"1.0.0"},{},{autoResize:true}),form=document.querySelector("#form"),status=document.querySelector("#status"),channelValues=["email","organic social","paid social","paid search","content","events","partnerships","press","community"];for(const value of channelValues){const label=document.createElement("label"),input=document.createElement("input");input.type="checkbox";input.name="channel";input.value=value;label.append(input,document.createTextNode(value));document.querySelector("#channels").append(label)}const value=id=>document.querySelector(`#${id}`).value.trim(),brief=()=>({whatIsLaunching:value("product"),launchType:value("type"),audience:value("audience"),launchDate:value("date"),channelsAvailable:[...document.querySelectorAll('[name="channel"]:checked')].map(x=>x.value),teamSize:Number(value("team")),budgetBand:value("budget"),goal:value("goal"),constraints:value("constraints").split("\n").map(x=>x.trim()).filter(Boolean)});function apply(data){const p=data?.prefill||{};const map={whatIsLaunching:"product",launchType:"type",audience:"audience",launchDate:"date",teamSize:"team",budgetBand:"budget",goal:"goal"};for(const [key,id] of Object.entries(map))if(p[key]!==undefined)document.querySelector(`#${id}`).value=p[key];if(p.constraints)document.querySelector("#constraints").value=p.constraints.join("\n");for(const item of p.channelsAvailable||[]){const box=[...document.querySelectorAll('[name="channel"]')].find(x=>x.value===item);if(box)box.checked=true}}app.ontoolresult=e=>{try{apply(e.structuredContent)}catch{status.textContent="The brief could not be prefilled."}};form.addEventListener("submit",async e=>{e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const payload=brief();if(!payload.channelsAvailable.length){status.textContent="Choose at least one channel.";return}try{await app.sendMessage({role:"user",content:[{type:"text",text:`Review this launch brief with review_launch_brief. Do not draft the plan yet.\n${JSON.stringify(payload)}`}]});status.textContent="Brief sent for review."}catch{status.textContent="The brief could not be sent. Try again."}});try{await app.connect()}catch{status.textContent="The app could not connect."}try{document.documentElement.classList.toggle("dark",app.getHostContext?.()?.theme==="dark")}catch{status.textContent="Host settings could not be read."}
})();</script></body></html>
