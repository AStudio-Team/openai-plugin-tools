<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold Email Writer</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:"></head><body><main><h1>Review before drafting</h1><p>Approve the brief explicitly before the email sequence is drafted.</p><pre id="content"></pre><button id="approve" disabled>Approve brief</button></main><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const{App}=globalThis.ExtApps;const app=new App({name:"Cold Email Writer",version:"1.0.0"},{},{autoResize:true}),out=document.querySelector("#content"),button=document.querySelector("#approve");let brief;app.ontoolresult=r=>{brief=(r?.structuredContent||r)?.brief;out.textContent=JSON.stringify(r?.structuredContent||r,null,2);button.disabled=!brief};button.onclick=async()=>{button.disabled=true;const r=await app.callServerTool({name:"approve_cold_email_brief",arguments:{brief}}),data=r.structuredContent;await app.sendMessage({role:"user",content:[{type:"text",text:`I approved this cold email brief. Use this signed receipt to draft the sequence: ${JSON.stringify(data.receipt)}`}]})};await app.connect();</script></body></html>
