<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold email brief builder</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:">
<style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--muted:#5b675f;--line:#c8cec8;--accent:#12694f;--danger:#a33030}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}main{max-width:850px;margin:auto}h1{margin:.2em 0}.note,.hint{color:var(--muted)}form{display:grid;gap:14px}.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:4px}input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}textarea{min-height:72px;resize:vertical}.actions{display:flex;justify-content:flex-end}.actions button{border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.status{color:var(--danger);font-weight:700;min-height:21px}@media(max-width:620px){.grid{display:block}.grid>div{margin-bottom:12px}}</style></head>
<body><main><p class="hint">Step 1 of 4</p><h1>Build your cold email brief</h1><p class="note">Text only. This tool never sends email or finds contacts.</p>
<form id="brief" novalidate><section class="section"><div class="grid">
<div><label for="senderName">Sender name</label><input id="senderName" minlength="2" maxlength="120" required></div>
<div><label for="signature">Sender company / signature</label><input id="signature" minlength="2" maxlength="300" required></div>
<div class="wide"><label for="offer">Offer</label><textarea id="offer" minlength="3" maxlength="500" required></textarea></div>
<div><label for="targetRole">Target role</label><input id="targetRole" minlength="2" maxlength="120" required></div>
<div><label for="companyType">Target industry / company type</label><input id="companyType" minlength="2" maxlength="200" required></div>
<div class="wide"><label for="painPoint">Pain point</label><textarea id="painPoint" minlength="3" maxlength="500" required></textarea></div>
<div class="wide"><label for="proof">Proof point <span class="hint">optional; include available personalisation tokens if useful</span></label><textarea id="proof" maxlength="500"></textarea></div>
<div><label for="tone">Tone</label><select id="tone" required><option value="">Choose</option><option value="direct">Direct</option><option value="warm">Warm</option><option value="consultative">Consultative</option><option value="concise">Concise</option></select></div>
<div><label for="followUpCount">Sequence length (follow-ups)</label><select id="followUpCount" required><option value="">Choose</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
<div class="wide"><label for="callToAction">Call to action allowed</label><input id="callToAction" minlength="3" maxlength="180" required></div>
</div></section><div id="status" class="status" role="alert"></div><div class="actions"><button id="submit" type="submit">Review brief</button></div></form></main>
<script type="module">
(async()=>{try{/*__EXT_APPS_BUNDLE__*/}catch(cause){document.getElementById("status").textContent="The form is available, but the chat host could not be loaded."}const App=globalThis.ExtApps?.App;let app;try{if(App)app=new App({name:"ColdEmailBriefBuilder",version:"1.0.0"},{},{autoResize:true})}catch(cause){document.getElementById("status").textContent="The form is available, but the chat host could not be started."}const ids=["offer","targetRole","companyType","painPoint","proof","callToAction","senderName","signature","tone","followUpCount"],form=document.getElementById("brief"),status=document.getElementById("status"),button=document.getElementById("submit"),value=id=>document.getElementById(id).value.trim();function brief(){return{offer:value("offer"),targetRole:value("targetRole"),companyType:value("companyType"),painPoint:value("painPoint"),...(value("proof")?{proof:value("proof")} :{}),callToAction:value("callToAction"),senderName:value("senderName"),signature:value("signature"),tone:value("tone"),followUpCount:Number(value("followUpCount"))}}function applyPrefill(result){const data=result?.structuredContent||result||{},prefill=data.prefill||{};for(const id of ids)if(prefill[id]!==undefined&&prefill[id]!==null)document.getElementById(id).value=String(prefill[id])}if(app)app.ontoolresult=result=>{try{applyPrefill(result)}catch(cause){status.textContent="The supplied brief could not be loaded; enter the details manually."}};form.addEventListener("submit",async event=>{event.preventDefault();if(!form.checkValidity()){try{form.reportValidity()}catch(cause){}status.textContent="Complete the highlighted required fields.";return}button.disabled=true;status.textContent="";const completed=brief();try{if(!app?.sendMessage)throw new Error("Host unavailable");await app.sendMessage({role:"user",content:[{type:"text",text:`Please call review_cold_email_brief with this completed brief. Do not approve or draft it yet.\n\n${JSON.stringify({brief:completed},null,2)}`}]});status.textContent="Brief submitted for review."}catch(cause){status.textContent="The brief could not be sent. Retry, or copy the completed fields into chat."}finally{button.disabled=false}});try{if(app)await app.connect()}catch(cause){status.textContent="The form is ready, but it is not connected to chat."}})();
</script></body></html>
