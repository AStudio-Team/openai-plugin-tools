<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold Email Writer</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:"></head><body><main><h1>Cold email sequence</h1><pre id="content"></pre><p id="error" role="alert"></p><div id="choices"></div></main><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const{App}=globalThis.ExtApps;const app=new App({name:"Cold Email Writer",version:"1.0.0"},{},{autoResize:true}),out=document.querySelector("#content"),error=document.querySelector("#error"),choices=document.querySelector("#choices");app.ontoolresult=r=>{const data=r?.structuredContent||r;out.textContent=JSON.stringify(data,null,2);choices.replaceChildren();if(!data?.valid)return;for(const variant of data.variants||[]){const button=document.createElement("button");button.textContent="Select this variant";button.onclick=async()=>{button.disabled=true;error.textContent="";try{const selected=await app.callServerTool({name:"submit_variant_selection",arguments:{brief:data.brief,sequence:{variants:data.variants},selectedVariantId:variant.id}});await app.sendMessage({role:"user",content:[{type:"text",text:`I selected variant ${variant.id}. Use this recorded selection for export: ${JSON.stringify(selected.structuredContent.selectionReceipt)}`}]})}catch(cause){error.textContent=`Could not select the variant: ${cause?.message||"Please try again."}`;button.disabled=false}};choices.append(button)}};await app.connect();</script></body></html>
