name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            pdf-table-to-excel/package-lock.json
            gcc-arabic-writer/package-lock.json
            ad-creative-lab/package-lock.json
            growth-marketing-planner/package-lock.json
            launch-plan-builder/package-lock.json
            landing-page-copy-check/package-lock.json
            social-content-planner/package-lock.json
            cold-email-writer/package-lock.json
            ai-crawler-readiness-auditor/package-lock.json
            open-data-fetcher/package-lock.json
            editable-diagram-builder/package-lock.json
            verified-buy-link/package-lock.json
            grounded-citations/server/package-lock.json
            schema-markup-generator/package-lock.json
      - name: Install Python dependencies
        working-directory: pdf-table-to-excel
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock
      - name: Install Node dependencies
        run: |
          npm --prefix pdf-table-to-excel ci --ignore-scripts
          npm --prefix gcc-arabic-writer ci --ignore-scripts
          npm --prefix ad-creative-lab ci --ignore-scripts
          npm --prefix growth-marketing-planner ci --ignore-scripts
          npm --prefix launch-plan-builder ci --ignore-scripts
          npm --prefix landing-page-copy-check ci --ignore-scripts
          npm --prefix social-content-planner ci --ignore-scripts
          npm --prefix cold-email-writer ci --ignore-scripts
          npm --prefix ai-crawler-readiness-auditor ci --ignore-scripts
          npm --prefix open-data-fetcher ci --ignore-scripts
          npm --prefix editable-diagram-builder ci --ignore-scripts
          npm --prefix verified-buy-link ci --ignore-scripts
          npm --prefix grounded-citations/server ci --ignore-scripts
          npm --prefix schema-markup-generator ci --ignore-scripts
      - name: Test PDF MCP service
        working-directory: pdf-table-to-excel
        run: |
          PATH="$PWD/.venv/bin:$PATH" npm test
          npm audit --audit-level=high
      - name: Test GCC Arabic MCP service
        working-directory: gcc-arabic-writer
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Ad Creative Lab MCP App
        working-directory: ad-creative-lab
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Growth Marketing Planner MCP App
        working-directory: growth-marketing-planner
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Launch Plan Builder MCP App
        working-directory: launch-plan-builder
        env:
          APPROVAL_HMAC_KEY: ci-approval-hmac-key-at-least-32-bytes
        run: |
          npm test
          npm run check
          npm audit --audit-level=high
      - name: Test Landing Page Copy Check MCP App
        working-directory: landing-page-copy-check
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Social Content Planner MCP App
        working-directory: social-content-planner
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Cold Email Writer MCP App
        working-directory: cold-email-writer
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Open Data MCP App
        working-directory: open-data-fetcher
        run: |
          npm test
          npm run check
          npm audit --audit-level=high
      - name: Test Editable Diagram MCP App
        working-directory: editable-diagram-builder
        env:
          CHECKPOINT_SECRET: ci-checkpoint-secret-at-least-32-bytes
        run: |
          npm test
          npm run audit:public
          npm audit --audit-level=high
      - name: Test Verified Buy Link MCP App
        working-directory: verified-buy-link
        run: |
          npm test
          npm audit --audit-level=high
      - name: Test Grounded Citations MCP App
        working-directory: grounded-citations/server
        run: |
          npm test
          npm run check
          npm audit --audit-level=moderate
          npm run licenses
      - name: Test Schema Markup Generator MCP App
        working-directory: schema-markup-generator
        run: npm test
      - name: Validate public packages
        run: |
          python -m unittest discover -s tests -v
          python tests/validate_packages.py
          python tests/audit_public_content.py
          python tests/build_archives.py
      - name: Test AI crawler readiness MCP App
        working-directory: ai-crawler-readiness-auditor
        run: |
          npm test
          npm run check
          npm audit --audit-level=high
          npm run licenses
          npm run sbom
      - name: Check forbidden punctuation
        run: |
          if git grep -n $'\u2014' -- '*.md' '*.json' '*.py' '*.mjs' '*.html' '*.css' '*.sh'; then
            echo 'Em dash found'
            exit 1
          fi
      - name: Build production containers
        run: |
          docker build -t openai-plugin-pdf:ci pdf-table-to-excel
          docker build -t openai-plugin-arabic:ci gcc-arabic-writer
          docker build -t openai-plugin-ad-creative-lab:ci ad-creative-lab
          docker build -t openai-plugin-growth:ci growth-marketing-planner
          docker build -t openai-plugin-launch-plan:ci launch-plan-builder
          docker build -t openai-plugin-landing-copy:ci landing-page-copy-check
          docker build -t openai-plugin-schema-markup:ci schema-markup-generator
          docker build -t openai-plugin-social-planner:ci social-content-planner
          docker build -t openai-plugin-cold-email:ci cold-email-writer
          docker build -t openai-plugin-crawler-auditor:ci ai-crawler-readiness-auditor
          docker build -t openai-plugin-data:ci open-data-fetcher
          docker build -t openai-plugin-diagram:ci editable-diagram-builder
          docker build -t openai-plugin-verified-buy-link:ci verified-buy-link
          docker build -t openai-plugin-grounded:ci grounded-citations
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-plugin-submission-zips
          path: build/*-submission.zip
          if-no-files-found: error
