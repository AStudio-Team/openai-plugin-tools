name: Agent scope guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  branch-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate branch prefix and changed paths
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          python scripts/check-agent-scope.py --branch "$HEAD_REF" --base "$BASE_REF"
