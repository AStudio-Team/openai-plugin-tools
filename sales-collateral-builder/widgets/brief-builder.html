<!doctype html><meta charset="utf-8"><title>Sales collateral brief</title><body><h1>Build a sales collateral brief</h1><p>Enter verified facts only. This tool never publishes.</p><form id="brief"><label>Product <input id="product" required></label><label>Buyer persona <input id="buyerPersona" required></label><label>Buyer role <input id="buyerRole" required></label><label>Deal stage <input id="dealStage" required></label><label>Piece type <select id="pieceType"><option value="deck_outline">Deck outline</option><option value="one_pager">One-pager</option><option value="objection_sheet">Objection sheet</option><option value="demo_script">Demo script</option><option value="case_study">Case study</option></select></label><fieldset><legend>Proof points</legend><div id="proofRows"><div class="proof-row"><input data-proof-text placeholder="Verified proof point" required><input data-proof-source placeholder="Source" required></div></div><button type="button" id="addProof">Add proof point</button></fieldset><fieldset><legend>Known objections</legend><div id="objectionRows"><div class="objection-row"><select data-objection-category><option>Price</option><option>Timing</option><option>Competition</option><option>Authority</option><option>Status quo</option><option>Technical</option></select><input data-objection-text placeholder="Objection"></div></div><button type="button" id="addObjection">Add objection</button></fieldset><fieldset><legend>Personalisation tokens</legend><div id="tokenRows"><div class="token-row"><input data-token placeholder="{{first_name}}"></div></div><button type="button" id="addToken">Add token</button></fieldset><label>Tone <input id="tone" required></label><button type="button" id="review">Review brief</button></form><p id="status"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Sales Collateral Brief',version:'1.0.0'},{},{autoResize:true}),status=document.querySelector('#status'),value=id=>document.querySelector(`#${id}`).value.trim(),categories=['Price','Timing','Competition','Authority','Status quo','Technical'];document.querySelector('#addProof').onclick=()=>{const row=document.createElement('div');row.className='proof-row';row.innerHTML='<input data-proof-text placeholder="Verified proof point" required><input data-proof-source placeholder="Source" required>';document.querySelector('#proofRows').append(row)};document.querySelector('#addObjection').onclick=()=>{const row=document.createElement('div');row.className='objection-row';row.innerHTML=`<select data-objection-category>${categories.map(item=>`<option>${item}</option>`).join('')}</select><input data-objection-text placeholder="Objection">`;document.querySelector('#objectionRows').append(row)};document.querySelector('#addToken').onclick=()=>{const row=document.createElement('div');row.className='token-row';row.innerHTML='<input data-token placeholder="{{first_name}}">';document.querySelector('#tokenRows').append(row)};document.querySelector('#review').onclick=async()=>{const arguments={product:value('product'),buyerPersona:value('buyerPersona'),buyerRole:value('buyerRole'),dealStage:value('dealStage'),pieceType:value('pieceType'),proofPoints:[...document.querySelectorAll('.proof-row')].map(row=>({text:row.querySelector('[data-proof-text]').value.trim(),source:row.querySelector('[data-proof-source]').value.trim()})),knownObjections:[...document.querySelectorAll('.objection-row')].map(row=>({category:row.querySelector('[data-objection-category]').value,text:row.querySelector('[data-objection-text]').value.trim()})).filter(item=>item.text),personalisationTokens:[...document.querySelectorAll('.token-row')].map(row=>row.querySelector('[data-token]').value.trim()).filter(Boolean),tone:value('tone')};try{const r=await app.callServerTool({name:'review_collateral_brief',arguments});if(r.isError)throw Error();const sent=await app.sendMessage({role:'user',content:[{type:'text',text:`Review this sales collateral brief: ${JSON.stringify(r.structuredContent.normalizedBrief)}`}]});if(sent?.isError)throw Error();status.textContent='Brief ready for approval.'}catch{status.textContent='Brief review failed.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
