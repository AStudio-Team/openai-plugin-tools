<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales collateral brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:700;margin-top:12px}input,textarea,select,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:70px}button{margin-top:16px;font-weight:700}</style></head><body><h1>Build your sales collateral brief</h1><p>Paste text only. This app does not fetch, send, or publish content.</p><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Sales Collateral Brief",version:"1.0.0"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let prefill={};const labels={product:"Product",buyerPersona:"Buyer persona",buyerRole:"Buyer role",dealStage:"Deal stage",pieceType:"Piece type",proofPoints:"Real proof points (one per line: proof | source)",knownObjections:"Known objections (one per line)",tone:"Tone"},types=["sales deck outline","one-pager","objection handling sheet","demo script","case study brief"];function render(data={}){prefill=data.prefill||prefill;form.replaceChildren();for(const name of Object.keys(labels)){const label=document.createElement("label");label.textContent=labels[name];label.htmlFor=name;let field;if(name==="pieceType"){field=document.createElement("select");for(const type of types){const option=document.createElement("option");option.value=option.textContent=type;field.append(option)}}else field=document.createElement(name==="proofPoints"||name==="knownObjections"?"textarea":"input");field.id=field.name=name;field.value=Array.isArray(prefill[name])?prefill[name].map(v=>typeof v==="object"?`${v.text} | ${v.source}`:v).join("\n"):prefill[name]||"";field.required=true;form.append(label,field)}const button=document.createElement("button");button.textContent="Review brief";button.type="submit";form.append(button)}form.onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.proofPoints=String(data.proofPoints).split(/\n+/).map(line=>line.split("|").map(x=>x.trim())).filter(([text,source])=>text&&source).map(([text,source])=>({text,source}));data.knownObjections=String(data.knownObjections).split(/\n+/).map(x=>x.trim()).filter(Boolean);status.textContent="Opening review";try{const result=await app.callServerTool({name:"review_collateral_brief",arguments:data});const reviewed=result.structuredContent;if(!reviewed?.normalizedBrief)throw new Error("No reviewed brief returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Show me the reviewed sales collateral brief for explicit approval: ${JSON.stringify(reviewed.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed. Add every required field and a source for each proof point."}};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Fields are ready; host connection is unavailable."}
</script></body></html>
