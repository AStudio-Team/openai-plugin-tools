<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales collateral brief</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:700;margin-top:12px}input,textarea,select,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:70px}button{margin-top:16px;font-weight:700}</style></head><body><h1>Build your sales collateral brief</h1><p>Paste text only. This app does not fetch, send, or publish content.</p><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Sales Collateral Brief",version:"1.0.0"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let prefill={};const labels={product:"Product",buyerPersona:"Buyer persona",buyerRole:"Buyer role",dealStage:"Deal stage",pieceType:"Piece type",proofPoints:"Real proof points (one per line: proof | source)",knownObjections:"Known objections (one per line: category | objection)",personalisationTokens:"Personalisation tokens (one per line, for example {{first_name}})",tone:"Tone"},types=["sales deck outline","one-pager","objection handling sheet","demo script","case study brief"];function row(v){return typeof v!=="object"?v:v.source!==undefined?`${v.text} | ${v.source}`:`${v.category} | ${v.text}`}function render(data={}){prefill=data.prefill||prefill;form.replaceChildren();for(const name of Object.keys(labels)){const label=document.createElement("label");label.textContent=labels[name];label.htmlFor=name;let field;if(name==="pieceType"){field=document.createElement("select");for(const type of types){const option=document.createElement("option");option.value=option.textContent=type;field.append(option)}}else field=document.createElement(["proofPoints","knownObjections","personalisationTokens"].includes(name)?"textarea":"input");field.id=field.name=name;field.value=Array.isArray(prefill[name])?prefill[name].map(row).join("\n"):prefill[name]||"";field.required=name!=="personalisationTokens";form.append(label,field)}const button=document.createElement("button");button.textContent="Review brief";button.type="submit";form.append(button)}form.onsubmit=async event=>{event.preventDefault();status.textContent="Opening review";try{const data=Object.fromEntries(new FormData(form)),proofLines=String(data.proofPoints).split("\n"),objectionLines=String(data.knownObjections).split("\n");if(proofLines.some(line=>line.trim()===""||line.split("|").length!==2||line.split("|").some(part=>!part.trim())))throw Error("Each proof row needs proof | source, with no blank rows.");if(objectionLines.some(line=>line.trim()===""||line.split("|").length!==2||line.split("|").some(part=>!part.trim())))throw Error("Each objection row needs category | objection, with no blank rows.");data.proofPoints=proofLines.map(line=>{const [text,source]=line.split("|").map(x=>x.trim());return{text,source}});data.knownObjections=objectionLines.map(line=>{const [category,text]=line.split("|").map(x=>x.trim());return{category,text}});data.personalisationTokens=String(data.personalisationTokens).trim()?String(data.personalisationTokens).split("\n").map(x=>x.trim()):[];if(data.personalisationTokens.some(token=>!/^\{\{[a-z][a-z0-9_]*\}\}$/.test(token)))throw Error("Every personalisation token must use {{lower_case_name}}.");const result=await app.callServerTool({name:"review_collateral_brief",arguments:{product:data.product,buyerPersona:data.buyerPersona,buyerRole:data.buyerRole,dealStage:data.dealStage,pieceType:data.pieceType,proofPoints:data.proofPoints,knownObjections:data.knownObjections,personalisationTokens:data.personalisationTokens,tone:data.tone}});const reviewed=result.structuredContent;if(!reviewed?.normalizedBrief)throw new Error("No reviewed brief returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Show me the reviewed sales collateral brief for explicit approval: ${JSON.stringify(reviewed.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch(error){status.textContent=error.message||"Brief review failed."}};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Fields are ready; host connection is unavailable."}
</script></body></html>
