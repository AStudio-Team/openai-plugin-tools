<!doctype html><meta charset="utf-8"><title>Sales collateral brief</title><body><h1>Build a sales collateral brief</h1><p>Paste verified facts only. This tool never publishes.</p><textarea id="json" rows="18" cols="70" placeholder='{"product":"...","buyerPersona":"...","buyerRole":"...","dealStage":"...","pieceType":"one_pager","proofPoints":[{"text":"...","source":"..."}],"knownObjections":[{"category":"Price | Timing | Competition | Authority | Status quo | Technical","text":"..."}],"personalisationTokens":["{{first_name}}"],"tone":"..."}'></textarea><button id="review">Review brief</button><p id="status"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Sales Collateral Brief',version:'1.0.0'},{},{autoResize:true}),status=document.querySelector('#status');document.querySelector('#review').onclick=async()=>{let arguments;try{arguments=JSON.parse(document.querySelector('#json').value)}catch{status.textContent='Enter valid brief JSON.';return}try{const r=await app.callServerTool({name:'review_collateral_brief',arguments});if(r.isError)throw Error();const sent=await app.sendMessage({role:'user',content:[{type:'text',text:`Review this sales collateral brief: ${JSON.stringify(r.structuredContent.normalizedBrief)}`}]});if(sent?.isError)throw Error();status.textContent='Brief ready for approval.'}catch{status.textContent='Brief review failed.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
