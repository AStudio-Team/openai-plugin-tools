<!doctype html><meta charset="utf-8"><title>Approve sales collateral brief</title><body><h1>Review sales collateral brief</h1><pre id="brief">Waiting for a brief.</pre><button id="approve" disabled>Approve brief</button><p id="status"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Sales Collateral Brief Review',version:'1.0.0'},{},{autoResize:true}),out=document.querySelector('#brief'),button=document.querySelector('#approve'),status=document.querySelector('#status');let brief;app.ontoolresult=e=>{const d=e.structuredContent||{};brief=d.normalizedBrief;out.textContent=JSON.stringify(brief||{},null,2);button.disabled=!brief||!d.canApprove;status.textContent=(d.issues||[]).map(issue=>issue.message||String(issue)).join(' ')};button.onclick=async()=>{button.disabled=true;try{const r=await app.callServerTool({name:'approve_collateral_brief',arguments:{brief,approvalAction:'approve'}}),receipt=r.structuredContent?.approvalReceipt;if(r.isError||!receipt)throw Error();const sent=await app.sendMessage({role:'user',content:[{type:'text',text:`I explicitly approved this sales collateral brief. Signed receipt: ${JSON.stringify(receipt)}`}]});if(sent?.isError)throw Error();status.textContent='Approved with signed receipt.'}catch{status.textContent='Approval failed.';button.disabled=false}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
