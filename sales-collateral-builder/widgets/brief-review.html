<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review brief</title><style>body{font:15px system-ui;margin:20px}.card{border:1px solid #888;padding:12px;margin:8px}button{padding:10px}</style></head><body><h1>Review sales collateral brief</h1><div id="brief"></div><button id="approve" disabled>Approve brief</button><p id="status"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"Brief Review",version:"1.0.0"},{},{autoResize:true}),root=document.querySelector("#brief"),approve=document.querySelector("#approve"),status=document.querySelector("#status");let state;const display=v=>v?.category!==undefined?`${v.category}: ${v.text}`:v?.source!==undefined?`${v.text} - ${v.source}`:String(v);function render(data){state=data;root.replaceChildren();for(const [key,value] of Object.entries(data.normalizedBrief||{})){const card=document.createElement("section"),title=document.createElement("strong"),body=document.createElement("p");card.className="card";title.textContent=key;body.textContent=Array.isArray(value)?value.map(display).join("; ")||"None":display(value||"None");card.append(title,body);root.append(card)}approve.disabled=!data.canApprove}approve.onclick=async()=>{approve.disabled=true;try{const result=await app.callServerTool({name:"approve_collateral_brief",arguments:{brief:state.normalizedBrief,approvalAction:"approve"}}),receipt=result.structuredContent?.approvalReceipt;if(!receipt)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`I explicitly approved this sales collateral brief. Signed receipt: ${JSON.stringify(receipt)}`}]});status.textContent="Approved with signed receipt."}catch{status.textContent="Approval failed.";approve.disabled=false}};app.ontoolresult=e=>render(e.structuredContent||{});try{await app.connect()}catch{status.textContent="Could not connect."}
</script></body></html>
