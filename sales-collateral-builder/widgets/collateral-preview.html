<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales collateral preview</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}.card{border:1px solid #888;border-radius:10px;padding:12px;margin:10px 0}textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:64px}button{margin-top:8px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px}</style></head><body><h1>Review sales collateral</h1><div id="preview"></div><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Sales Collateral Preview",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#preview"),status=document.querySelector("#status"),file=document.querySelector("#file");let input={},result={};function showExport(item){file.textContent=item.content;file.hidden=false;let copy=document.querySelector("#copy-export");if(!copy){copy=document.createElement("button");copy.id="copy-export";copy.textContent="Copy";copy.onclick=async()=>{try{await navigator.clipboard.writeText(file.textContent);status.textContent=`${file.dataset.fileName} copied.`}catch{status.textContent="Copy is unavailable. Select the visible content instead."}};file.before(copy)}file.dataset.fileName=item.fileName}async function exportCollateral(button){button.disabled=true;let response;try{response=await app.callServerTool({name:"export_collateral",arguments:{brief:input.brief,approvalReceipt:input.approvalReceipt,collateral:result.collateral,format:"markdown"}})}catch{status.textContent="Export request failed. Keep the approved brief and collateral in this chat.";button.disabled=false;return}const item=response.structuredContent;if(response.isError||!item?.content){status.textContent=response.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export was refused.";button.disabled=false;return}showExport(item);status.textContent=`${item.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${item.fileName}; the content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${item.fileName}`,mimeType:item.mimeType,text:item.content}}]});if(downloaded?.isError)throw Error()}catch{status.textContent+=" Download is not available in this host."}button.disabled=false}function issueText(issue){return typeof issue==="string"?issue:[issue.code,issue.message].filter(Boolean).join(": ")}function render(data={}){if(data.collateral!==undefined)result={...result,...data};root.replaceChildren();const issues=document.createElement("p");issues.textContent=result.issues?.length?`Checks to address: ${result.issues.map(issueText).join(" ")}`:"No structural or proof issues found.";root.append(issues);for(const item of result.collateral?.sections||[]){const card=document.createElement("section"),heading=document.createElement("h2"),body=document.createElement("p"),instruction=document.createElement("textarea"),button=document.createElement("button");card.className="card";heading.textContent=item.heading;body.textContent=item.content;instruction.placeholder="Visible revision instruction for this section";button.textContent="Request revision";button.onclick=async()=>{button.disabled=true;status.textContent="Requesting revision";try{const response=await app.callServerTool({name:"request_collateral_revision",arguments:{section:item.heading,instruction:instruction.value}});if(!response.structuredContent?.message)throw Error();try{await app.sendMessage({role:"user",content:[{type:"text",text:`Revise the ${item.heading} section: ${instruction.value}`}]})}catch{status.textContent="Revision recorded, but the chat message was not delivered.";button.disabled=false;return}status.textContent="Revision request sent."}catch{status.textContent="Revision request failed. Enter an instruction and try again."}button.disabled=false};card.append(heading,body,instruction,button);root.append(card)}const exportButton=document.createElement("button");exportButton.textContent="Export";exportButton.onclick=()=>exportCollateral(exportButton);root.append(exportButton)}app.ontoolinput=e=>{try{const next=e?.arguments||e;if(next)input={...input,...next}}catch{status.textContent="Invalid preview input."}};app.ontoolresult=e=>{try{render(e?.structuredContent||{})}catch{status.textContent="The collateral preview could not be rendered."}};render();try{await app.connect()}catch{status.textContent="Preview is ready; host connection is unavailable."}
</script></body></html>
