<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collateral preview</title><style>body{font:15px system-ui;margin:20px}.card{border:1px solid #888;padding:12px;margin:8px}button{padding:10px}pre{white-space:pre-wrap}</style></head><body><h1>Review sales collateral</h1><div id="preview"></div><button id="export">Export</button><p id="status"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps,app=new App({name:"Collateral Preview",version:"1.0.0"},{},{autoResize:true}),root=document.querySelector("#preview"),status=document.querySelector("#status"),file=document.querySelector("#file"),exportButton=document.querySelector("#export");let input={},result={};function fields(value,path=""){if(typeof value==="string")return[[path,value]];if(Array.isArray(value))return value.flatMap((v,i)=>fields(v,`${path} ${i+1}`));if(value&&typeof value==="object")return Object.entries(value).flatMap(([k,v])=>k==="pieceType"?[]:fields(v,`${path} ${k}`));return[]}function render(data={}){if(data.collateral)result=data;root.replaceChildren();for(const [label,value] of fields(result.collateral)){const card=document.createElement("section"),title=document.createElement("strong"),body=document.createElement("p");card.className="card";title.textContent=label.trim();body.textContent=value;card.append(title,body);root.append(card)}}exportButton.onclick=async()=>{exportButton.disabled=true;try{const response=await app.callServerTool({name:"export_collateral",arguments:{brief:input.brief,approvalReceipt:input.approvalReceipt,collateral:result.collateral,format:"markdown"}}),item=response.structuredContent;if(!item?.content)throw Error();file.textContent=item.content;file.hidden=false;status.textContent=`${item.fileName} is ready.`}catch{status.textContent="Export failed."}exportButton.disabled=false};app.ontoolinput=e=>input={...input,...(e.arguments||e)};app.ontoolresult=e=>render(e.structuredContent||{});render();try{await app.connect()}catch{status.textContent="Could not connect."}
</script></body></html>
