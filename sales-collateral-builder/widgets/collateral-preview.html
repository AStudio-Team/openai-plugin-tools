<!doctype html><meta charset="utf-8"><title>Sales collateral review</title><body><h1>Sales collateral review</h1><pre id="collateral">Waiting for collateral.</pre><label>Section <input id="section" value="solution"></label><label>Instruction <input id="instruction"></label><button id="revise" disabled>Request revision</button><button data-export="markdown" disabled>Export Markdown</button><button data-export="html" disabled>Export HTML</button><p id="status"></p><section id="export" hidden><h2 id="name"></h2><button id="copy">Copy</button><pre id="content"></pre></section><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Sales Collateral Review',version:'1.0.0'},{},{autoResize:true}),out=document.querySelector('#collateral'),revise=document.querySelector('#revise'),status=document.querySelector('#status'),exportBox=document.querySelector('#export'),name=document.querySelector('#name'),content=document.querySelector('#content');let input={},data={};function ready(){return(input.brief||data.brief)&&data.collateral&&(input.approvalReceipt||data.approvalReceipt)}function render(value){if(value?.collateral){data={...data,...value};out.textContent=JSON.stringify(value.collateral,null,2)}const enabled=Boolean(ready());revise.disabled=!data.collateral;document.querySelectorAll('[data-export]').forEach(button=>button.disabled=!enabled)}const toolText=result=>result.content?.filter(item=>item.type==='text').map(item=>item.text).join('\n')||'Export failed.';function show(file){name.textContent=file.fileName;content.textContent=file.content;exportBox.hidden=false}async function exportCollateral(format){const button=document.querySelector(`[data-export="${format}"]`);button.disabled=true;const toolArgs={brief:input.brief||data.brief,collateral:data.collateral||input.collateral,approvalReceipt:input.approvalReceipt||data.approvalReceipt,format};let response;try{response=await app.callServerTool({name:'export_collateral',arguments:toolArgs})}catch{status.textContent='Export failed. Validate the collateral and receipt first.';button.disabled=false;return}if(response.isError||!response.structuredContent?.content){status.textContent=toolText(response);button.disabled=false;return}const file=response.structuredContent;show(file);status.textContent=`${file.fileName} is ready. Copy the text below.`;try{const sent=await app.sendMessage({role:'user',content:[{type:'text',text:`Exported ${file.fileName} (${file.mimeType}); the content is shown in the card.`}]});if(sent?.isError)throw Error()}catch{status.textContent+=' Chat announcement not delivered.'}try{const downloaded=await app.downloadFile({contents:[{type:'resource',resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});if(downloaded?.isError)throw Error('download denied')}catch{status.textContent+=' Download is not available in this host.'}button.disabled=false}revise.onclick=async()=>{revise.disabled=true;const toolArgs={section:document.querySelector('#section').value.trim(),instruction:document.querySelector('#instruction').value.trim()};try{const result=await app.callServerTool({name:'request_collateral_revision',arguments:toolArgs});if(result.isError)throw Error();const sent=await app.sendMessage({role:'user',content:[{type:'text',text:`Revise ${toolArgs.section}: ${toolArgs.instruction}`}]});if(sent?.isError)throw Error();status.textContent='Revision instruction sent.'}catch{status.textContent='Revision failed.'}revise.disabled=false};document.querySelectorAll('[data-export]').forEach(button=>button.onclick=()=>exportCollateral(button.dataset.export));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(content.textContent);status.textContent='Copied.'}catch{status.textContent='Copy unavailable.'}};app.ontoolinput=event=>{try{input=event.arguments||event||input;render(data)}catch{status.textContent='Invalid collateral input.'}};app.ontoolresult=event=>{try{if(event.structuredContent)render(event.structuredContent)}catch{status.textContent='The collateral could not be displayed.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
