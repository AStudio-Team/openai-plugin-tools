<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales collateral preview</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}.card{border:1px solid #888;border-radius:10px;padding:12px;margin:10px 0}textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:9px}textarea{min-height:64px}button{margin-top:8px;font-weight:700}</style></head><body><h1>Review sales collateral</h1><div id="preview"></div><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Sales Collateral Preview",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#preview"),status=document.querySelector("#status");function render(data={}){root.replaceChildren();const issues=document.createElement("p");issues.textContent=data.issues?.length?`Checks to address: ${data.issues.join(" ")}`:"No structural or proof issues found.";root.append(issues);for(const item of data.collateral?.sections||[]){const card=document.createElement("section"),heading=document.createElement("h2"),body=document.createElement("p"),instruction=document.createElement("textarea"),button=document.createElement("button");card.className="card";heading.textContent=item.heading;body.textContent=item.content;instruction.placeholder="Visible revision instruction for this section";button.textContent="Request revision";button.onclick=async()=>{button.disabled=true;status.textContent="Requesting revision";try{const result=await app.callServerTool({name:"request_collateral_revision",arguments:{section:item.heading,instruction:instruction.value}});if(!result.structuredContent?.message)throw new Error("No confirmation returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Revise the ${item.heading} section: ${instruction.value}`}]});status.textContent="Revision request sent."}catch{status.textContent="Revision request failed. Enter an instruction and try again.";button.disabled=false}};card.append(heading,body,instruction,button);root.append(card)}}app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The collateral preview could not be rendered."}};render();try{await app.connect()}catch{status.textContent="Preview is ready; host connection is unavailable."}
</script></body></html>
