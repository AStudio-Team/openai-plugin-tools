<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export sales collateral</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px 16px;margin:5px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px;max-height:420px;overflow:auto}</style></head><body><h1>Export sales collateral</h1><p>Download through the host as Markdown or HTML.</p><button data-format="markdown">Download Markdown</button><button data-format="html">Download HTML</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Sales Collateral Export",version:"1.0.0"},{},{autoResize:true});let input={},data={};const status=document.querySelector("#status"),preview=document.querySelector("#file");function show(file){if(!file?.content)return;preview.textContent=file.content;preview.hidden=false;preview.dataset.fileName=file.fileName;let copy=document.querySelector("#copy-export");if(!copy){copy=document.createElement("button");copy.id="copy-export";copy.textContent="Copy";copy.onclick=async()=>{try{if(!globalThis.navigator?.clipboard)throw Error("clipboard unavailable");await globalThis.navigator.clipboard.writeText(preview.textContent);status.textContent=`${preview.dataset.fileName} copied.`}catch{status.textContent="Copy is unavailable. Select the visible content instead."}};preview.before(copy)}}const toolText=r=>r.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";async function download(format){status.textContent="Preparing download";let response;try{response=await app.callServerTool({name:"export_collateral",arguments:{brief:input.brief||data.brief,approvalReceipt:input.approvalReceipt||data.approvalReceipt,collateral:input.collateral||data.collateral,format}})}catch{status.textContent="Download failed. Keep the approved brief and collateral in this chat.";return}if(response.isError){status.textContent=toolText(response);return}const file=response.structuredContent;if(!file?.content){status.textContent="Download failed. Keep the approved brief and collateral in this chat.";return}show(file);status.textContent=`${file.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName} (${file.mimeType}); the content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});if(downloaded?.isError)throw Error("download denied")}catch{status.textContent+=" Download is not available in this host."}}document.querySelectorAll("button").forEach(b=>b.onclick=()=>download(b.dataset.format));app.ontoolinput=e=>{try{const next=e?.arguments||e;if(next)input={...input,...next}}catch{status.textContent="Invalid export input."}};app.ontoolresult=e=>{try{const next=e?.structuredContent;if(next)data={...data,...next};show(next)}catch{status.textContent="The exported file could not be shown."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
