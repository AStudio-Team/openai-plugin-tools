<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare growth strategies</title><style>:root{color-scheme:light dark;--bg:#f4f1ea;--card:#fffdf8;--ink:#17211b;--muted:#5a675e;--line:#c6cec7;--accent:#12694f;--accent2:#e7b132;--focus:#1671ab;--danger:#a33030}html.dark{--bg:#151916;--card:#202722;--ink:#f5f5ee;--muted:#b8c1ba;--line:#465249;--accent:#69d3aa;--accent2:#f2c758;--focus:#84d1ff;--danger:#ff9a9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif;padding:var(--safe-top,12px) var(--safe-right,12px) var(--safe-bottom,16px) var(--safe-left,12px)}main{max-width:1180px;margin:auto}.step{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(25px,5vw,40px);line-height:1;margin:6px 0}.progress{height:5px;background:var(--line);margin:16px 0 20px}.progress span{display:block;width:75%;height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.strategies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;flex-direction:column;gap:11px}.card.selected{outline:3px solid var(--accent)}.number{font-weight:900;color:var(--accent)}h2{font-size:20px;line-height:1.05;margin:0}.thesis{min-height:62px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:4px 7px;font-size:11px}.fit{display:grid;grid-template-columns:1fr auto;gap:4px;border-top:1px solid var(--line);padding-top:9px}.rating{font-weight:800;text-transform:uppercase;color:var(--accent)}details{border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;font-weight:800}.changed{border-left:4px solid var(--accent2);padding-left:9px}.actions{margin-top:auto;display:flex;gap:7px}button{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 13px system-ui;padding:9px 11px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.footer{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.footer-actions{display:flex;flex-wrap:wrap;gap:8px}.revision{display:none;margin-top:12px}.revision.open{display:block}.revision textarea{width:100%;min-height:70px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}.note{font-size:12px;color:var(--muted)}#status{color:var(--danger);font-weight:700;min-height:20px}@media(max-width:850px){.strategies{grid-template-columns:1fr}.thesis{min-height:0}.meta{display:block}}</style></head><body><main><div class="step">Step 3 of 4</div><h1>Three routes, one decision</h1><div class="meta"><p>Compare estimated fit, not predicted performance.</p><p id="version"></p></div><div class="progress" aria-label="75 percent complete"><span></span></div><div id="strategies" class="strategies" aria-live="polite"></div><section class="footer"><div class="footer-actions"><button id="new">Request a new set</button><button id="edit">Return to brief</button><button id="cancel">Cancel</button></div><div id="revision" class="revision"><label for="instruction"><strong>State the exact constraint or change</strong></label><textarea id="instruction" maxlength="500" placeholder="For example: lower budget, no paid media, fewer founder hours"></textarea><p><button id="sendRevision" class="primary">Send revision request</button></p></div><p class="note" id="warnings"></p><div id="status" role="alert"></div></section></main><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"GrowthStrategyComparison",version:"1.0.0"},{},{autoResize:true});let state=null;const root=document.getElementById("strategies");function line(parent,label,value){const row=document.createElement("div");row.className="fit";const a=document.createElement("span");a.textContent=label;const b=document.createElement("span");b.className="rating";b.textContent=value;row.append(a,b);parent.append(row)}function bullets(parent,title,items){const details=document.createElement("details");const summary=document.createElement("summary");summary.textContent=title;details.append(summary);const ul=document.createElement("ul");for(const item of items||[]){const li=document.createElement("li");li.textContent=item;ul.append(li)}details.append(ul);parent.append(details)}function render(data){state=data;root.replaceChildren();document.getElementById("version").textContent=`Comparison version ${data.comparisonVersion}`;data.strategies.forEach((s,index)=>{const card=document.createElement("article");card.className="card";const number=document.createElement("div");number.className="number";number.textContent=`OPTION ${index+1}`;const title=document.createElement("h2");title.textContent=s.name;const thesis=document.createElement("p");thesis.className="thesis";thesis.textContent=s.thesis;card.append(number,title,thesis);const chips=document.createElement("div");chips.className="chips";for(const channel of s.channels){const chip=document.createElement("span");chip.className="chip";chip.textContent=channel.replaceAll("_"," ");chips.append(chip)}card.append(chips);for(const key of ["goal","audience","budget","capacity","evidence"])line(card,key,s.fit[key].rating);const best=document.createElement("p");best.textContent=`Best fit: ${s.whyItFits}`;const poor=document.createElement("p");poor.textContent=`Poor fit: ${s.notIdealWhen}`;card.append(best,poor);if(s.speedToSignal){const speed=document.createElement("p");speed.textContent=`Likely first signal: ${s.speedToSignal}`;card.append(speed)}bullets(card,"First two weeks",s.firstActions);bullets(card,"Sequence",s.timeline.map(item=>`${item.period}: ${item.action}`));bullets(card,"Leading indicators",s.leadingIndicators);bullets(card,"Risks",s.risks);bullets(card,"Planning assumptions",s.assumptions);if(s.changedFields?.length){const changed=document.createElement("p");changed.className="changed";changed.textContent=`Changed in this version: ${s.changedFields.join(", ")}`;card.append(changed)}const actions=document.createElement("div");actions.className="actions";const select=document.createElement("button");select.className="primary";select.textContent="Select";select.onclick=()=>choose(s,index);const revise=document.createElement("button");revise.textContent="Revise";revise.onclick=()=>openRevision(`Revise only option ${index+1} (${s.name}): `);actions.append(select,revise);card.append(actions);root.append(card)});document.getElementById("warnings").textContent=[data.revisionNote,...data.warnings].filter(Boolean).join(" ")}function send(message){return app.sendMessage({role:"user",content:[{type:"text",text:message}]})}async function choose(strategy,index){document.querySelectorAll(".card")[index].classList.add("selected");await send(`I explicitly select strategy ${index+1}, ID ${strategy.id}, named "${strategy.name}". Finalize this strategy only. Use selectionConfirmed true and preserve the confirmed brief.`)}function openRevision(prefix=""){const box=document.getElementById("revision");box.classList.add("open");document.getElementById("instruction").value=prefix;document.getElementById("instruction").focus()}app.ontoolresult=event=>{try{render(event.structuredContent||JSON.parse(event.content.find(item=>item.type==="text").text))}catch{document.getElementById("status").textContent="The comparison could not be displayed. Ask for the three-option Markdown table in chat and select 1, 2, or 3 there."}};document.getElementById("new").onclick=()=>openRevision("Create a new set of exactly three strategies with this constraint: ");document.getElementById("edit").onclick=()=>send("Return to the confirmed growth brief for editing. Do not finalize a strategy.");document.getElementById("cancel").onclick=()=>send("Cancel Growth Marketing Planner. Do not finalize or launch anything.");document.getElementById("sendRevision").onclick=async()=>{const instruction=document.getElementById("instruction").value.trim();if(!instruction){document.getElementById("status").textContent="State the requested change first.";return}await send(`${instruction}\nIncrement comparisonVersion, update only the affected options unless a new set was requested, and visibly populate changedFields. Then call compare_growth_strategies again.`);document.getElementById("status").textContent="Revision requested."};await app.connect();function theme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const inset=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${inset[side]||12}px`)}theme(app.getHostContext?.());app.onhostcontextchanged=theme;
</script></body></html>
