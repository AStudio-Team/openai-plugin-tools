<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review social brief</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:15px/1.5 system-ui,sans-serif}main{max-width:800px;margin:auto}.card{background:#fff;border:1px solid #c7cec8;border-radius:12px;padding:14px;margin:12px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#12694f;color:#fff;font-weight:700}#status{color:#8b2020}</style><main><p>Step 2 of 4</p><h1>Confirm the social brief</h1><p>Check the inputs before calendar drafting begins.</p><section id="brief" class="card" aria-live="polite">Waiting for your brief.</section><button id="edit">Edit brief</button> <button id="approve">Approve brief</button><p id="status"></p></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentBriefReview",version:"1.0.0"},{},{autoResize:true});let brief;const out=document.querySelector("#brief"),status=document.querySelector("#status");function render(v){brief=v;out.replaceChildren();for(const[k,val]of Object.entries(v)){const p=document.createElement("p"),b=document.createElement("strong");b.textContent=`${k}: `;p.append(b,document.createTextNode(Array.isArray(val)?val.join(", "):typeof val==="object"?JSON.stringify(val):val));out.append(p)}}app.ontoolresult=e=>{const d=e.structuredContent;if(d?.normalizedBrief)render(d.normalizedBrief)};document.querySelector("#edit").onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:"Reopen the social content brief for editing. Do not draft a calendar."}]});document.querySelector("#approve").onclick=async()=>{if(!brief){status.textContent="Open and review a brief first.";return}const response=await app.callServerTool({name:"approve_social_brief",arguments:{brief}});if(response.isError){status.textContent="Approval failed. Review the brief and retry.";return}await app.sendMessage({role:"user",content:[{type:"text",text:"I approved the displayed social brief. Draft the calendar using the approval receipt returned by approve_social_brief."}]});status.textContent="Brief approved for 30 minutes. You can draft the calendar."};app.connect()})();
</script>
