<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review social brief</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:15px/1.5 system-ui,sans-serif}main{max-width:800px;margin:auto}.card{background:#fff;border:1px solid #c7cec8;border-radius:12px;padding:14px;margin:12px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#12694f;color:#fff;font-weight:700}button:disabled{opacity:.5}#issues,#status{color:#8b2020}</style><main><p>Step 2 of 4</p><h1>Confirm the social brief</h1><p>Check the inputs before calendar drafting begins.</p><section id="brief" class="card" aria-live="polite">Waiting for your brief.</section><ul id="issues" aria-live="polite"></ul><button id="edit">Edit brief</button> <button id="approve" disabled>Approve brief</button><p id="status"></p></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentBriefReview",version:"1.0.0"},{},{autoResize:true});let brief;const out=document.querySelector("#brief"),issues=document.querySelector("#issues"),status=document.querySelector("#status"),approve=document.querySelector("#approve");function render(d){brief=d.normalizedBrief;out.replaceChildren();issues.replaceChildren();for(const[k,val]of Object.entries(brief)){const p=document.createElement("p"),b=document.createElement("strong");b.textContent=`${k}: `;p.append(b,document.createTextNode(Array.isArray(val)?val.join(", "):typeof val==="object"?JSON.stringify(val):val));out.append(p)}for(const issue of d.issues||[]){const li=document.createElement("li");li.textContent=issue;issues.append(li)}approve.disabled=!d.canApprove}app.ontoolresult=e=>{const d=e.structuredContent;if(d?.normalizedBrief)render(d)};document.querySelector("#edit").onclick=async()=>{try{await app.sendMessage({role:"user",content:[{type:"text",text:"Reopen the social content brief for editing. Do not draft a calendar."}]})}catch{status.textContent="Could not reopen the brief. Please try again."}};approve.onclick=async()=>{if(!brief){status.textContent="Open and review a brief first.";return}approve.disabled=true;try{const response=await app.callServerTool({name:"approve_social_brief",arguments:{brief}});if(response.isError)throw new Error("approval failed");const receipt=response.structuredContent?.approvalReceipt;if(!receipt)throw new Error("missing receipt");await app.sendMessage({role:"user",content:[{type:"text",text:`I approved the displayed social brief. Draft the calendar with this approval receipt: ${receipt}`}]});status.textContent="Brief approved for 30 minutes. You can draft the calendar."}catch{status.textContent="Approval failed. Review the brief and retry.";approve.disabled=false}};app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
