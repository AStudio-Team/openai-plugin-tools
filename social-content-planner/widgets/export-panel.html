<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export social calendar</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:15px/1.5 system-ui,sans-serif}main{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #c7cec8;border-radius:12px;padding:16px}button{padding:10px 14px;background:#12694f;color:#fff;border:0;border-radius:8px;font-weight:700;margin-right:8px}#status{color:#526057}</style><main><p>Step 4 of 4</p><h1>Export your content calendar</h1><section class="card"><p>Download a CSV for a spreadsheet or Markdown for a working document. This does not publish or schedule posts.</p><button id="csv">Download CSV</button><button id="markdown">Download Markdown</button><p id="status"></p></section></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentExport",version:"1.0.0"},{},{autoResize:true});let data;const status=document.querySelector("#status");app.ontoolresult=e=>{if(e.structuredContent?.csv)data=e.structuredContent};async function download(kind){if(!data){status.textContent="Ask ChatGPT to use export_content_calendar first.";return}const button=document.querySelector(`#${kind}`);button.disabled=true;try{const text=kind==="csv"?data.csv:data.markdown,mime=kind==="csv"?"text/csv":"text/markdown";await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///social-content-calendar.${kind==="csv"?"csv":"md"}`,mimeType:mime,text}}]});status.textContent=`${kind.toUpperCase()} download is ready.`}catch{status.textContent="Download failed. Please try again."}finally{button.disabled=false}}document.querySelector("#csv").onclick=()=>download("csv");document.querySelector("#markdown").onclick=()=>download("markdown");app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
