<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export social calendar</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:15px/1.5 system-ui,sans-serif}main{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #c7cec8;border-radius:12px;padding:16px}button{padding:10px 14px;background:#12694f;color:#fff;border:0;border-radius:8px;font-weight:700;margin-right:8px}#status{color:#526057}</style><main><p>Step 4 of 4</p><h1>Export your content calendar</h1><section class="card"><p>Download a CSV for a spreadsheet or Markdown for a working document. This does not publish or schedule posts.</p><button id="csv">Download CSV</button><button id="markdown">Download Markdown</button><p id="status"></p></section></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentExport",version:"1.0.0"},{},{autoResize:true});let data;const status=document.querySelector("#status");const toolText=result=>result.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";app.ontoolresult=e=>{if(e.isError){data=undefined;status.textContent=toolText(e);document.querySelector("#exported-content")?.remove();return}if(e.structuredContent?.csv)data=e.structuredContent};function show(name,text){let box=document.querySelector("#exported-content");if(!box){box=document.createElement("section");box.id="exported-content";const title=document.createElement("h2"),copy=document.createElement("button"),area=document.createElement("textarea");copy.textContent="Copy";area.readOnly=true;area.rows=18;copy.onclick=async()=>{if(globalThis.navigator?.clipboard)await globalThis.navigator.clipboard.writeText(area.value);else{area.select();document.execCommand?.("copy")}};box.append(title,copy,area);document.querySelector("main").append(box)}box.querySelector("h2").textContent=name;box.querySelector("textarea").value=text}async function download(kind){if(!data){status.textContent="Ask ChatGPT to use export_content_calendar first.";return}const button=document.querySelector(`#${kind}`);button.disabled=true;const text=kind==="csv"?data.csv:data.markdown,mimeType=kind==="csv"?"text/csv":"text/markdown",fileName=`social-content-calendar.${kind==="csv"?"csv":"md"}`;show(fileName,text);status.textContent=`${fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${fileName} (${mimeType}); the content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${fileName}`,mimeType,text}}]});if(downloaded?.isError)throw new Error("download denied")}catch{status.textContent+=" Download is not available in this host."}finally{button.disabled=false}}document.querySelector("#csv").onclick=()=>download("csv");document.querySelector("#markdown").onclick=()=>download("markdown");app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
