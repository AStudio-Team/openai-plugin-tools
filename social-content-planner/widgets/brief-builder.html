<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social content brief</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:14px/1.4 system-ui,sans-serif}main{max-width:800px;margin:auto}fieldset{border:1px solid #c7cec8;border-radius:12px;margin:12px 0;padding:14px}label{display:block;font-weight:700;margin:8px 0 3px}input,textarea,select,button{font:inherit}input,textarea,select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #8b978e;border-radius:7px;background:#fff}textarea{min-height:60px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{font-weight:400}.checks input{width:auto}button{padding:10px 14px;border:0;border-radius:8px;background:#12694f;color:#fff;font-weight:700;cursor:pointer}#status{min-height:20px;color:#8b2020}</style><main><p>Step 1 of 4</p><h1>Build your social content brief</h1><p>Plans and writes post text only. It never posts, schedules, or connects to an account.</p><form id="brief"><fieldset><legend>Audience and goal</legend><label>Brand <input name="brand" required maxlength="200"></label><label>Audience <textarea name="audience" required></textarea></label><label>Goals <textarea name="goals" required></textarea></label><label>Tone <input name="tone" required placeholder="Clear, expert, warm"></label></fieldset><fieldset><legend>Platforms</legend><div class="checks" id="platforms"></div><label>Posts per week per selected platform <input name="postsPerWeek" type="number" min="1" max="21" value="2" required></label></fieldset><fieldset><legend>Content plan</legend><label>Content pillars, 3 to 5, one per line <textarea name="pillars" required></textarea></label><label>Weeks <select name="weeks" multiple size="4"><option value="1" selected>Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option></select></label><label>Must include, one per line <textarea name="mustInclude"></textarea></label><label>Banned topics, one per line <textarea name="bannedTopics"></textarea></label></fieldset><button>Review this brief</button><p id="status" role="alert"></p></form></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentBrief",version:"1.0.0"},{},{autoResize:true}),form=document.querySelector("form"),status=document.querySelector("#status"),names=["LinkedIn","Instagram","X","TikTok","Facebook","YouTube Shorts"],lines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);for(const name of names){const l=document.createElement("label"),i=document.createElement("input");i.type="checkbox";i.value=name;i.name="platform";l.append(i,document.createTextNode(name));document.querySelector("#platforms").append(l)}form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;try{const d=new FormData(form),platforms=d.getAll("platform"),pillars=lines(d.get("pillars"));if(!platforms.length||pillars.length<3||pillars.length>5){status.textContent="Choose a platform and enter three to five pillars.";return}const postsPerWeek=Object.fromEntries(platforms.map(p=>[p,Number(d.get("postsPerWeek"))])),brief={brand:d.get("brand"),audience:d.get("audience"),goals:d.get("goals"),tone:d.get("tone"),platforms,pillars,postsPerWeek,weeks:d.getAll("weeks").map(Number),mustInclude:lines(d.get("mustInclude")),bannedTopics:lines(d.get("bannedTopics"))};await app.sendMessage({role:"user",content:[{type:"text",text:`Use open_social_brief for this social brief, then ask me to review it: ${JSON.stringify(brief)}`}]});status.textContent="Brief sent for review."}catch{status.textContent="Could not send the brief. Please try again."}finally{button.disabled=false}};app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
