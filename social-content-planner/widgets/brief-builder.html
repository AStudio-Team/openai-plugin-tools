<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social content brief</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:14px/1.4 system-ui,sans-serif}main{max-width:800px;margin:auto}fieldset{border:1px solid #c7cec8;border-radius:12px;margin:12px 0;padding:14px}label{display:block;font-weight:700;margin:8px 0 3px}input,textarea,select,button{font:inherit}input,textarea,select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #8b978e;border-radius:7px;background:#fff}textarea{min-height:60px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{font-weight:400}.checks input{width:auto}.week-row{display:flex;gap:8px;margin:6px 0}.week-row button,#addWeek{background:#4d5b53}.week-row button{white-space:nowrap}button{padding:10px 14px;border:0;border-radius:8px;background:#12694f;color:#fff;font-weight:700;cursor:pointer}#status{min-height:20px;color:#8b2020}</style><main><p>Step 1 of 4</p><h1>Build your social content brief</h1><p>Plans and writes post text only. It never posts, schedules, or connects to an account.</p><form id="brief"><fieldset><legend>Audience and goal</legend><label>Brand <input name="brand" required maxlength="200"></label><label>Audience <textarea name="audience" required></textarea></label><label>Goals <textarea name="goals" required></textarea></label><label>Tone <input name="tone" required placeholder="Clear, expert, warm"></label></fieldset><fieldset><legend>Platforms</legend><div class="checks" id="platforms"></div></fieldset><fieldset><legend>Content plan</legend><label>Content pillars, 1 to 8, one per line <textarea name="pillars" required></textarea></label><label>Weeks, 1 to 52</label><div id="weekRows"></div><button type="button" id="addWeek">Add week</button><label>Must include, one per line <textarea name="mustInclude"></textarea></label><label>Banned topics, one per line <textarea name="bannedTopics"></textarea></label></fieldset><button>Review this brief</button><p id="status" role="alert"></p></form></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentBrief",version:"1.0.0"},{},{autoResize:true}),form=document.querySelector("form"),status=document.querySelector("#status"),weekRows=document.querySelector("#weekRows"),addWeek=document.querySelector("#addWeek"),names=["LinkedIn","Instagram","X","TikTok","Facebook","YouTube Shorts"],frequencies={},lines=v=>v.split("\n").map(x=>x.trim()).filter(Boolean);function addWeekRow(value=1){if(weekRows.children.length>=52)return;const row=document.createElement("div"),input=document.createElement("input"),remove=document.createElement("button");row.className="week-row";input.name="weeks";input.type="number";input.min="1";input.max="52";input.required=true;input.value=value;remove.type="button";remove.textContent="Remove";remove.onclick=()=>{if(weekRows.children.length>1)row.remove()};row.append(input,remove);weekRows.append(row)}addWeek.onclick=()=>addWeekRow();addWeekRow();for(const name of names){const l=document.createElement("label"),i=document.createElement("input"),frequency=document.createElement("input");i.type="checkbox";i.value=name;i.name="platform";frequency.type="number";frequency.min="1";frequency.max="21";frequency.value="2";frequency.disabled=frequency.hidden=true;frequency.setAttribute?.("aria-label",`${name} posts per week`);i.onchange=()=>{frequency.disabled=frequency.hidden=!i.checked};frequencies[name]=frequency;l.append(i,document.createTextNode(name),frequency);document.querySelector("#platforms").append(l)}function fill(prefill){for(const name of ["brand","audience","goals","tone"]){if(prefill[name]!==undefined)form.querySelector(`[name="${name}"]`).value=prefill[name]}for(const name of ["pillars","mustInclude","bannedTopics"]){if(prefill[name]!==undefined)form.querySelector(`[name="${name}"]`).value=prefill[name].join("\n")}if(prefill.platforms)for(const input of form.querySelectorAll('[name="platform"]')){input.checked=prefill.platforms.includes(input.value);input.onchange()}if(prefill.weeks?.length){weekRows.replaceChildren();for(const week of prefill.weeks)addWeekRow(week)}if(prefill.postsPerWeek)for(const[name,value]of Object.entries(prefill.postsPerWeek))if(frequencies[name])frequencies[name].value=value}app.ontoolresult=e=>{const d=e.structuredContent;if(d?.prefill)fill(d.prefill)};form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;try{const d=new FormData(form),platforms=d.getAll("platform"),pillars=lines(d.get("pillars")),weeks=d.getAll("weeks").map(Number);if(!platforms.length||!pillars.length||pillars.length>8){status.textContent="Choose a platform and enter one to eight pillars.";return}const postsPerWeek=Object.fromEntries(platforms.map(p=>[p,Number(frequencies[p].value)])),brief={brand:d.get("brand"),audience:d.get("audience"),goals:d.get("goals"),tone:d.get("tone"),platforms,pillars,postsPerWeek,weeks},mustInclude=lines(d.get("mustInclude")),bannedTopics=lines(d.get("bannedTopics"));if(mustInclude.length)brief.mustInclude=mustInclude;if(bannedTopics.length)brief.bannedTopics=bannedTopics;await app.sendMessage({role:"user",content:[{type:"text",text:`Call review_social_brief with this completed social brief: ${JSON.stringify(brief)}`}]});status.textContent="Brief sent for review."}catch{status.textContent="Could not send the brief. Please try again."}finally{button.disabled=false}};app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
