<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social calendar preview</title><style>body{margin:0;padding:16px;background:#f4f1ea;color:#17211b;font:14px/1.45 system-ui,sans-serif}main{max-width:950px;margin:auto}.post{background:#fff;border:1px solid #c7cec8;border-radius:12px;padding:14px;margin:10px 0}.meta{color:#526057}button,textarea,input{font:inherit}button{padding:8px 12px;background:#12694f;color:#fff;border:0;border-radius:8px}textarea,input{box-sizing:border-box;width:100%;min-height:36px;padding:8px}.issues{color:#8b2020}</style><main><p>Step 3 of 4</p><h1>Review your content calendar</h1><p id="summary">Waiting for calendar posts.</p><div id="posts"></div><section class="post"><h2>Request a revision</h2><label>Week <input id="week" type="number" min="1" required></label><label>Post ID, optional <input id="postId"></label><textarea id="instruction" placeholder="Make the hook more direct for founders."></textarea><button id="revise">Send revision</button><p id="revisionStatus"></p></section></main><script type="module">/*__EXT_APPS_BUNDLE__*/
(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SocialContentCalendar",version:"1.0.0"},{},{autoResize:true});let calendar;const root=document.querySelector("#posts"),status=document.querySelector("#revisionStatus"),revise=document.querySelector("#revise");function render(d){calendar={posts:d.posts};root.replaceChildren();document.querySelector("#summary").textContent=d.valid?`${d.posts.length} posts pass the calendar checks.`:`${d.issues?.length||0} calendar issues need attention.`;if(d.issues?.length){const x=document.createElement("p");x.className="issues";x.textContent=d.issues.join(" ");root.append(x)}for(const p of d.posts||[]){const c=document.createElement("article");c.className="post";c.innerHTML="<strong></strong><h2></h2><p></p><p class=meta></p><p class=meta></p>";c.querySelector("strong").textContent=`Week ${p.week} | ${p.platform} | ${p.pillar} | ${p.postId}`;c.querySelector("h2").textContent=p.hook;c.querySelector("p").textContent=p.postText;c.querySelectorAll(".meta")[0].textContent=`Format: ${p.format}. Visual: ${p.suggestedVisualNote}`;c.querySelectorAll(".meta")[1].textContent=`CTA: ${p.cta}`;root.append(c)}}app.ontoolresult=e=>{const d=e.structuredContent;if(d?.posts)render(d)};revise.onclick=async()=>{const week=Number(document.querySelector("#week").value),postId=document.querySelector("#postId").value.trim(),instruction=document.querySelector("#instruction").value.trim();if(!calendar||!week||!instruction){status.textContent="Choose a week and enter a visible instruction.";return}revise.disabled=true;try{const response=await app.callServerTool({name:"request_calendar_revision",arguments:{calendar,week,...(postId?{postId}:{}),instruction}});if(response.isError)throw new Error("revision failed");const request=response.structuredContent;await app.sendMessage({role:"user",content:[{type:"text",text:`Revise the calendar using this explicit request: ${JSON.stringify(request)}`}]});status.textContent="Revision request sent in chat."}catch{status.textContent="Revision request failed. Please try again.";revise.disabled=false}};app.connect().catch(()=>{status.textContent="Could not connect to ChatGPT. Reload this panel."})})();
</script>
