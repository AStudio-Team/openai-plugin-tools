<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel conversion result</title>
<style>
:root{color-scheme:light dark;--bg:#f7fbfb;--panel:#fff;--text:#182526;--muted:#5b6c6d;--line:#c9dada;--accent:#176d73;--accent-text:#fff;--focus:#8b4b17}html.dark{--bg:#10191a;--panel:#182425;--text:#eef8f8;--muted:#b5c8c9;--line:#405657;--accent:#75d0d4;--accent-text:#102021;--focus:#f1a667}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,var(--safe-top,0px)) max(16px,var(--safe-right,0px)) max(16px,var(--safe-bottom,0px)) max(16px,var(--safe-left,0px))}main{max-width:760px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}h1{font-size:1.28rem;margin:0;overflow-wrap:anywhere}.meta{color:var(--muted);margin:5px 0 14px}.sheets{display:grid;gap:9px}.sheet{border:1px solid var(--line);border-radius:10px;padding:11px}.sheet h2{font-size:1rem;margin:0 0 3px}.sheet p{margin:0;color:var(--muted)}.table-wrap{overflow:auto;margin-top:8px}table{border-collapse:collapse;font-size:.82rem;min-width:100%}caption{text-align:left;color:var(--muted);padding:0 0 6px}th,td{border:1px solid var(--line);padding:5px 7px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{text-align:left;background:var(--bg)}.expiry{margin:14px 0 0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{border:1px solid var(--accent);border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:var(--accent-text)}.secondary{background:transparent;color:var(--accent)}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button[disabled]{opacity:.6}#status{min-height:1.4em;margin-top:9px;color:var(--muted)}@media(max-width:540px){body{padding:12px}main{padding:13px}.actions{flex-direction:column}.actions button{width:100%}.sheet{padding:9px}}
</style>
</head>
<body><main><h1 id="filename">Workbook ready</h1><p id="meta" class="meta"></p><section id="sheets" class="sheets" aria-label="Worksheet previews"></section><p id="expiry" class="expiry"></p><div class="actions"><button id="download" class="primary" type="button">Download workbook</button><button id="rename" class="secondary" type="button">Ask to rename</button><button id="inspect" class="secondary" type="button">Inspect a worksheet</button><button id="another" class="secondary" type="button">Convert another PDF</button></div><div id="status" role="status" aria-live="polite"></div></main>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;
const app = new App({ name: "PDF Table to Excel Result", version: "1.1.0" }, {}, { autoResize: true });
const byId=id=>document.getElementById(id);let latest={};
function applyTheme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const insets=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${Number(insets[side]||0)}px`)}
function dataFrom(result){if(result?.structuredContent)return result.structuredContent;const text=result?.content?.find(item=>item.type==="text")?.text;try{return JSON.parse(text)}catch{return {}}}
function render(result){latest=dataFrom(result);byId("filename").textContent=latest.filename||"Workbook ready";byId("meta").textContent=`${latest.pages||0} page${latest.pages===1?"":"s"} | ${latest.tables||0} table${latest.tables===1?"":"s"}`;byId("expiry").textContent=`Temporary download expires in ${Math.ceil((latest.expires_in_seconds||0)/60)} minutes. Download it now if you need to keep it.`;byId("sheets").replaceChildren();for(const [index,preview] of (latest.previews||[]).entries()){const article=document.createElement("article");article.className="sheet";const heading=document.createElement("h2");heading.textContent=preview.worksheet;const summary=document.createElement("p");summary.id=`worksheet-description-${index}`;summary.textContent=`Worksheet ${preview.worksheet} was extracted from page ${preview.page}, table ${preview.table}, with ${preview.rows} rows and ${preview.columns} columns.`;article.append(heading,summary);if(Array.isArray(preview.preview)&&preview.preview.length){const wrap=document.createElement("div");wrap.className="table-wrap";const table=document.createElement("table");table.setAttribute("aria-describedby",summary.id);const caption=document.createElement("caption");caption.textContent=`Sample rows from ${preview.worksheet}`;table.append(caption);for(const [rowIndex,row] of preview.preview.entries()){const tr=document.createElement("tr");for(const value of row||[]){const cell=document.createElement(rowIndex===0?"th":"td");if(rowIndex===0)cell.setAttribute("scope","col");cell.textContent=value==null?"":String(value);tr.append(cell)}table.append(tr)}wrap.append(table);article.append(wrap)}byId("sheets").append(article)}}
async function send(text,button){button.disabled=true;byId("status").textContent="Sending to chat...";try{const response=await app.sendMessage({role:"user",content:[{type:"text",text}]});byId("status").textContent=response?.isError?"The host did not accept the message. Type it in chat instead.":"Sent to chat."}catch{byId("status").textContent="Could not send through the widget. Type it in chat instead."}finally{button.disabled=false}}
function trustedDownloadUrl(value){try{const url=new URL(value);return url.protocol==="https:"&&url.origin==="https://www.astudio.agency"&&url.pathname.startsWith("/openai-plugins/pdf-table-to-excel/downloads/")?url.toString():null}catch{return null}}
app.ontoolresult=render;app.onhostcontextchanged=applyTheme;byId("download").addEventListener("click",async event=>{event.currentTarget.disabled=true;const url=trustedDownloadUrl(latest.download_url);if(!url){byId("status").textContent="The download link failed the HTTPS origin check. Ask ChatGPT to reconvert the PDF.";event.currentTarget.disabled=false;return}byId("status").textContent="Opening the verified temporary download...";try{const response=await app.openLink({url});byId("status").textContent=response?.isError?"The host could not open the link. Use the download URL shown in chat.":"Download opened through the host."}catch{byId("status").textContent="Could not open the link. Use the download URL shown in chat."}finally{event.currentTarget.disabled=false}});byId("rename").addEventListener("click",event=>send(`Rename the converted workbook currently called ${latest.filename||"the workbook"}. Ask me for the new filename, then reconvert the same PDF only if the host still has access to it.`,event.currentTarget));byId("inspect").addEventListener("click",event=>send(`Inspect the worksheet list for ${latest.filename||"this workbook"} and ask which worksheet I want to review. Do not claim the preview is a fully editable spreadsheet.`,event.currentTarget));byId("another").addEventListener("click",event=>send("I want to convert another PDF. Ask me to upload or select the next PDF before calling the conversion tool.",event.currentTarget));await app.connect();applyTheme(app.getHostContext?.());
</script></body></html>
