<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>
:root{--ink:var(--color-text-primary,#18212f);--muted:var(--color-text-secondary,#667085);--line:var(--color-border-default,#d0d5dd);--surface:var(--color-background-primary,#fff);--accent:#175cd3;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:transparent;color:var(--ink);font:14px/1.45 system-ui,sans-serif}.shell{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}h1{font-size:20px;margin:0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px;font-weight:650}.wide{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:transparent;color:inherit}textarea{min-height:72px;resize:vertical}.summary{margin:18px 0;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent)}.actions{display:flex;flex-wrap:wrap;gap:8px}button{min-height:44px;border:1px solid var(--line);border-radius:11px;padding:9px 14px;background:transparent;color:inherit;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}button:disabled{opacity:.55}.status{min-height:22px;margin-top:10px}.error{color:var(--danger)}details{margin:14px 0}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.shell{padding:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="shell" aria-labelledby="title"><div class="head"><div><h1 id="title">Review the diagram brief</h1><p>Nothing is generated until you approve this normalized brief. The app will never treat silence as approval.</p></div><span id="complexity" aria-label="Estimated complexity"></span></div><form id="form"><div class="grid"><label>Diagram type<select name="diagramType" required><option value="">Select</option><option value="flowchart">Flowchart</option><option value="architecture">System architecture</option><option value="sequence">Sequence diagram</option><option value="concept-map">Concept map</option></select></label><label>Direction<select name="direction"><option value="auto">Automatic</option><option value="left-right">Left to right</option><option value="top-bottom">Top to bottom</option></select></label><label class="wide">Title<input name="title" maxlength="200" required></label><label class="wide">Purpose<textarea name="purpose" maxlength="1000" required></textarea></label><label class="wide">Audience<input name="audience" maxlength="300" required></label><label>Detail<select name="detailLevel"><option value="concise">Concise</option><option value="standard">Standard</option><option value="detailed">Detailed</option></select></label><label>Theme<select name="theme"><option value="auto">Automatic</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label class="wide">Required items, one per line<textarea name="requiredItems"></textarea></label><label class="wide">Required relationships, one per line<textarea name="requiredRelationships"></textarea></label></div><details><summary>Exact terms, constraints and assumptions</summary><div class="grid"><label class="wide">Protected terms, one per line<textarea name="protectedTerms"></textarea></label><label class="wide">Constraints, one per line<textarea name="constraints"></textarea></label><label class="wide">Assumptions, one per line<textarea name="assumptions"></textarea></label></div></details><section class="summary" aria-live="polite"><strong>Approval checkpoint</strong><div id="summary"></div><div id="warnings"></div></section><div class="actions"><button class="primary" type="submit">Use this brief</button><button type="button" id="edit">Edit brief</button><button type="button" id="ask">Ask in chat</button><button type="button" id="cancel">Cancel</button></div><div id="status" class="status" role="status"></div></form></main><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App,applyHostStyleVariables}=globalThis.ExtApps;const app=new App({name:"Editable Diagram Brief",version:"1.0.0"},{},{autoResize:true});const form=document.querySelector("#form"),status=document.querySelector("#status");let data=null;
const lines=v=>String(v||"").split("\n").map(x=>x.trim()).filter(Boolean);const set=(n,v)=>{const e=form.elements.namedItem(n);if(e)e.value=Array.isArray(v)?v.join("\n"):(v??"")};const canonical=v=>typeof v==="string"?v.normalize("NFC").replace(/\r\n?/g,"\n").trim():Array.isArray(v)?v.map(canonical):v&&typeof v==="object"?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;async function briefDigest(v){const bytes=new TextEncoder().encode(`${JSON.stringify(canonical(v),null,2)}\n`),hash=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function brief(){return{schemaVersion:"1.0",diagramType:form.diagramType.value,title:form.title.value.trim(),purpose:form.purpose.value.trim(),audience:form.audience.value.trim(),direction:form.direction.value,detailLevel:form.detailLevel.value,theme:form.theme.value,requiredItems:lines(form.requiredItems.value),requiredRelationships:lines(form.requiredRelationships.value),protectedTerms:lines(form.protectedTerms.value),constraints:lines(form.constraints.value),assumptions:lines(form.assumptions.value)}}
function paint(){const b=brief(),missing=["diagramType","title","purpose","audience"].filter(k=>!b[k]);document.querySelector("#summary").textContent=missing.length?`Missing: ${missing.join(", ")}.`:`${b.diagramType}; ${b.requiredItems.length} items; ${b.requiredRelationships.length} relationships; ${b.direction}; ${b.theme}.`;document.querySelector("#warnings").textContent=(b.assumptions.length?`Assumptions to accept: ${b.assumptions.join("; ")}`:"");document.querySelector("#complexity").textContent=(b.requiredItems.length+b.requiredRelationships.length>20?"Detailed":b.requiredItems.length>6?"Standard":"Concise")}
function load(payload){data=payload;const b=payload.brief||{};for(const k of Object.keys(b))set(k,b[k]);paint();if(payload.warnings?.length)document.querySelector("#warnings").textContent=payload.warnings.join(" ")}
function payload(result){if(result?.structuredContent)return result.structuredContent;const t=result?.content?.find(x=>x.type==="text")?.text;return t?JSON.parse(t):result}
app.ontoolresult=result=>{try{load(payload(result))}catch{status.textContent="The brief result could not be read. Continue in chat.";status.className="status error"}};app.onhostcontextchanged=c=>theme(c);function theme(c){document.documentElement.classList.toggle("dark",c?.theme==="dark");if(c?.styles?.variables)applyHostStyleVariables(c.styles.variables);const s=c?.safeAreaInsets||{};document.body.style.padding=`${Math.max(16,s.top||0)}px ${Math.max(16,s.right||0)}px ${Math.max(16,s.bottom||0)}px ${Math.max(16,s.left||0)}px`}
form.addEventListener("input",paint);form.addEventListener("submit",async e=>{e.preventDefault();if(!form.reportValidity())return;status.textContent="Confirming brief...";for(const el of form.elements)el.disabled=true;try{const b=brief(),d=await briefDigest(b);const r=payload(await app.callServerTool({name:"confirm_diagram_brief",arguments:{brief:b,briefDigest:d,confirmation:true}}));status.textContent=`Confirmed until ${r.expiresAt}.`;await app.updateModelContext({structuredContent:{checkpointToken:r.checkpointToken,briefDigest:r.briefDigest,approvedBrief:b}});await app.sendMessage({role:"user",content:[{type:"text",text:`I approved the ${b.diagramType} brief titled "${b.title}" with digest ${r.briefDigest}. Please create the semantic scene and render the preview.`}]})}catch(err){status.textContent=err?.message||"Brief confirmation failed.";status.className="status error";for(const el of form.elements)el.disabled=false}});document.querySelector("#edit").onclick=()=>form.title.focus();document.querySelector("#ask").onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:"I need help completing the diagram brief. Please ask only for the missing material decisions."}]});document.querySelector("#cancel").onclick=()=>{status.textContent="Cancelled. No draft was retained.";app.sendMessage({role:"user",content:[{type:"text",text:"Cancel the diagram request. Do not generate or retain a diagram."}]})};(async()=>{await app.connect();theme(app.getHostContext())})().catch(()=>{status.textContent="Interactive controls are unavailable. Use the text fallback in chat.";status.className="status error"});
</script></body></html>
