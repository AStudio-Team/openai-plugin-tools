<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><style>
:root{--ink:var(--color-text-primary,#18212f);--muted:var(--color-text-secondary,#667085);--line:var(--color-border-default,#d0d5dd);--surface:var(--color-background-primary,#fff);--accent:#175cd3;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:transparent;color:var(--ink);font:14px/1.45 system-ui,sans-serif}.shell{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}.top,.toolbar,.actions,.status{padding:12px 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}.muted{color:var(--muted);margin:4px 0}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.canvas-wrap{position:relative;overflow:auto;min-height:320px;max-height:620px;background:color-mix(in srgb,var(--surface) 90%,#98a2b3);touch-action:none}.canvas{transform-origin:0 0;min-width:100%;padding:12px}.canvas svg{display:block;max-width:none;border-radius:10px;box-shadow:0 3px 14px #0002}.disclosure{padding:10px 16px;background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--muted)}button,select,input{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:transparent;color:inherit}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}.status{border-top:1px solid var(--line)}.valid{color:var(--ok)}.invalid{color:var(--danger)}dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:min(480px,calc(100vw - 24px));width:100%}dialog form{dis </style></head><body><main class="shell" aria-labelledby="heading"><section class="top"><div><h1 id="heading">Diagram preview</h1><p id="summary" class="muted"></p></div><strong id="validation" role="status">Loading</strong></section><div class="toolbar" aria-label="Preview controls"><label>Layout <select id="variant"></select></label><button id="zoomOut" aria-label="Zoom out">Zoom out</button><button id="zoomIn" aria-label="Zoom in">Zoom in</button><button id="fit">Fit view</button><button id="edit">Edit selected item</button><button id="undo">Undo</button></div><div id="canvasWrap" class="canvas-wrap" tabindex="0" aria-label="Diagram canvas. Use layout controls and edit dialog for keyboard editing."><div id="canvas" class="canvas"></div></div><div class="disclosure">Preview approximates final .excalidraw rendering. The downloaded file remains fully editable in a compatible editor. This product is independent and is not endorsed by the Excalidraw project.</div><div class="actions"><button class="primary" id="use">Use this revision</button><button id="download">Download .excalidraw</button><button id="revise">Revise in chat</button><button id="reset">Reset</button><button id="cancel">Cancel</button></div><div id="status" class="status" aria-live="polite"></div><div id="structure" class="sr" aria-live="polite"></div></main><dialog id="editor"><form method="dialog"><h2>Edit item</h2><label>Target<select id="target"></select></label><label>Label<input id="label" maxlength="200"></label><label>Color role<select id="color"><option>primary</option><option>success</option><option>warning</option><option>processing</option><option>critical</option><option>note</option><option>storage</option></select></label><label>Line style<select id="line"><option>solid</option><option>dashed</option><option>dotted</option></select></label><label>Direction<select id="direction"><option>forward</option><option>both</option><option>none</option></select></label><div><button value="cancel">Cancel</button><button id="apply" value="default" class="primary">Apply edit</button></div></form></dialog><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App,applyHostStyleVariables}=globalThis.ExtApps;const app=new App({name:"Editable Diagram Preview",version:"1.0.0"},{},{autoResize:true});let data=null,original=null,current=null,zoom=1,history=[];const $=s=>document.querySelector(s),status=$("#status");
function payload(result){if(result?.structuredContent)return result.structuredContent;const t=result?.content?.find(x=>x.type==="text")?.text;return t?JSON.parse(t):result}function variant(){return current?.variants?.find(v=>v.variantId===$("#variant").value)||current?.variants?.[0]}
function show(){const v=variant();if(!v)return;const doc=new DOMParser().parseFromString(v.svg,"image/svg+xml"),svg=doc.documentElement;if(svg.nodeName.toLowerCase()!=="svg"){status.textContent="Preview data is malformed.";return}const canvas=$("#canvas"),rendered=document.importNode(svg,true);rendered.setAttribute("width",String(Math.round(v.width*zoom)));rendered.setAttribute("height",String(Math.round(v.height*zoom)));canvas.replaceChildren(rendered);canvas.style.transform="none";canvas.style.width=`${Math.round(v.width*zoom)+24}px`;canvas.style.height=`${Math.round(v.height*zoom)+24}px`;const ok=v.validation?.valid!==false;$("#validation").textContent=ok?"Valid":"Invalid";$("#validation").className=ok?"valid":"invalid";$("#download").disabled=!ok||!v.document;status.textContent=(v.validation?.errors||[]).concat(v.validation?.warnings||[]).join(" ")||"Validated. No external upload occurred."}
function fit(){const v=variant(),wrap=$("#canvasWrap");if(!v)return;zoom=Math.min(1,(wrap.clientWidth-24)/v.width,(wrap.clientHeight-24)/v.height);show()}
function load(p){data=p;original=structuredClone(p);current=structuredClone(p);const select=$("#variant");select.replaceChildren(...p.variants.map(v=>Object.assign(document.createElement("option"),{value:v.variantId,textContent:`${v.name} - ${v.description}`})));$("#summary").textContent=`${p.summary.diagramType}; revision ${p.revision}; ${p.summary.nodeCount} nodes; ${p.summary.edgeCount} relationships.`;$("#structure").textContent=p.textSummary||$("#summary").textContent;populateTargets();show();requestAnimationFrame(fit)}
function populateTargets(){const select=$("#target"),scene=current.scene;select.replaceChildren(...[...scene.nodes,...scene.edges].map(item=>Object.assign(document.createElement("option"),{value:item.id,textContent:`${"from" in item?"Relationship":"Node"}: ${item.label||item.id}`})))}
async function edits(list){history.push(structuredClone(current));status.textContent="Revalidating...";try{const r=payload(await app.callServerTool({name:"apply_diagram_edits",arguments:{checkpointToken:data.checkpointToken,briefDigest:data.briefDigest,baseSceneDigest:current.sceneDigest,scene:current.scene,brief:data.brief,revision:current.revision,variantId:$("#variant").value,edits:list}}));current={...current,...r,variants:[r.variant]};$("#variant").replaceChildren(Object.assign(document.createElement("option"),{value:r.variant.variantId,textContent:r.variant.name}));populateTargets();show()}catch(err){current=history.pop()||current;status.textContent=err?.message||"Edit failed validation."}}
$("#variant").onchange=()=>variant()?.deferred?edits([]):show();$("#zoomIn").onclick=()=>{zoom=Math.min(2,zoom+.15);show()};$("#zoomOut").onclick=()=>{zoom=Math.max(.35,zoom-.15);show()};$("#fit").onclick=fit;$("#undo").onclick=()=>{if(history.length){current=history.pop();populateTargets();show()}};$("#reset").onclick=()=>{history.push(structuredClone(current));current=structuredClone(original);populateTargets();show()};
let drag=null;$("#canvas").addEventListener("pointerdown",e=>{const shape=e.target.closest?.("[data-node-id]");if(!shape?.dataset.nodeId)return;const svg=shape.ownerSVGElement,point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const start=point.matrixTransform(svg.getScreenCTM().inverse()),box=shape.getBBox();drag={id:shape.dataset.nodeId,dx:start.x-box.x,dy:start.y-box.y};e.target.setPointerCapture?.(e.pointerId)});$("#canvas").addEventListener("pointerup",e=>{if(!drag)return;const svg=$("#canvas svg"),point=svg.createSVGPoint();point.x=e.clientX;point.y=e.clientY;const end=point.matrixTransform(svg.getScreenCTM().inverse()),move={op:"move-node",targetId:drag.id,value:{x:Math.round(end.x-drag.dx),y:Math.round(end.y-drag.dy)}};drag=null;edits([move])});
$("#edit").onclick=()=>{$("#editor").showModal()};$("#apply").onclick=e=>{e.preventDefault();const id=$("#target").value,node=current.scene.nodes.find(n=>n.id===id),edge=current.scene.edges.find(x=>x.id===id),list=[];if(node){if($("#label").value.trim()&&$("#label").value.trim()!==node.label)list.push({op:"set-label",targetId:id,value:$("#label").value.trim()});if($("#color").value!==node.colorRole)list.push({op:"set-color-role",targetId:id,value:$("#color").value})}if(edge){if($("#label").value.trim()!==String(edge.label||""))list.push({op:"set-edge-label",targetId:id,value:$("#label").value.trim()});if($("#line").value!==edge.lineStyle)list.push({op:"set-line-style",targetId:id,value:$("#line").value});if($("#direction").value!==edge.direction)list.push({op:"set-direction",targetId:id,value:$("#direction").value})}$("#editor").close();if(list.length)edits(list)};$("#target").onchange=()=>{const id=$("#target").value,item=[...current.scene.nodes,...current.scene.edges].find(x=>x.id===id);$("#label").value=item?.label||"";if(item?.colorRole)$("#color").value=item.colorRole;if(item?.lineStyle)$("#line").value=item.lineStyle;if(item?.direction)$("#direction").value=item.direction};
$("#use").onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:`Use diagram revision ${current.revision} with scene digest ${current.sceneDigest} and layout ${variant().variantId}.`}]});$("#revise").onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:`Revise diagram revision ${current.revision}. Keep the approved scope unless I explicitly change it.`}]});$("#cancel").onclick=()=>{status.textContent="Cancelled. No upload occurred and no diagram was retained.";app.sendMessage({role:"user",content:[{type:"text",text:"Cancel this diagram preview. Do not export or upload it."}]})};$("#download").onclick=async()=>{const v=variant();status.textContent="Preparing download...";try{const r=payload(await app.callServerTool({name:"export_excalidraw",arguments:{checkpointToken:data.checkpointToken,briefDigest:data.briefDigest,sceneDigest:current.sceneDigest,revision:current.revision,fileName:`${current.scene.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"diagram"}.excalidraw`,document:v.document}}));const download=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${encodeURIComponent(r.safeFileName)}`,mimeType:"application/json",text:r.json}}]});if(download?.isError)throw new Error("Download was cancelled by the host.");status.textContent=`Downloaded ${r.safeFileName}; ${r.byteCount} bytes; digest ${r.sha256}. No external upload occurred. Content was not retained.`}catch(err){status.textContent=err?.message||"Download failed."}};
window.addEventListener("resize",()=>requestAnimationFrame(fit));function theme(c){document.documentElement.classList.toggle("dark",c?.theme==="dark");if(c?.styles?.variables)applyHostStyleVariables(c.styles.variables);const s=c?.safeAreaInsets||{};document.body.style.padding=`${Math.max(12,s.top||0)}px ${Math.max(12,s.right||0)}px ${Math.max(12,s.bottom||0)}px ${Math.max(12,s.left||0)}px`}app.ontoolresult=r=>{try{load(payload(r))}catch{status.textContent="Preview result could not be read. Use the text fallback in chat."}};app.onhostcontextchanged=theme;(async()=>{await app.connect();theme(app.getHostContext())})().catch(()=>status.textContent="Interactive preview unavailable. Use the text fallback in chat.");
</script></body></html>
