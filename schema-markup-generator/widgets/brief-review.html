<!doctype html><meta charset="utf-8"><title>Review schema facts</title><style>body{font:16px system-ui;margin:auto;max-width:760px;padding:20px;background:#f5f3ed;color:#17211b}pre{white-space:pre-wrap;background:#fff;padding:16px;border:1px solid #ccd2ca}button{padding:10px 15px;font-weight:700}#status{font-weight:700}</style><main><h1>Review schema facts</h1><p>Read-only facts. Approval is required before markup can be generated.</p><pre id="facts">Waiting for facts.</pre><p id="missing"></p><p id="invalid"></p><button id="approve" disabled>Approve these facts</button><p id="status"></p></main><script type="module">/*__EXT_APPS_BUNDLE__*/(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SchemaBriefReview",version:"1.0.0"},{},{autoResize:true}),button=document.querySelector("#approve"),status=document.querySelector("#status");let brief;app.ontoolresult=e=>{const d=e.structuredContent;brief=d?.brief;document.querySelector("#facts").textContent=JSON.stringify(brief,null,2);document.querySelector("#missing").textContent=d?.missing?.length?`Missing required facts: ${d.missing.join(", ")}`:"All required facts are supplied.";document.querySelector("#invalid").textContent=d?.invalid?.length?`Invalid facts: ${d.invalid.map(issue=>`${issue.path}: ${issue.message}`).join("; ")}`:"No invalid facts.";button.disabled=!d?.canApprove};button.onclick=async()=>{if(!brief)return;button.disabled=true;status.textContent="Approving…";try{const response=await app.callServerTool({name:"approve_schema_brief",arguments:brief}),out=response.structuredContent;if(!out?.approvalReceipt)throw Error("No approval receipt returned.");await app.sendMessage({role:"user",content:[{type:"text",text:`These exact schema facts were explicitly approved. Generate markup using approval receipt: ${out.approvalReceipt}`} ]});status.textContent="Approved. Receipt sent for generation."}catch(error){status.textContent=`Approval failed: ${error?.message||"Try again."}`;button.disabled=false}};app.connect().catch(error=>{status.textContent=`App connection failed: ${error?.message||"Try again."}`;button.disabled=false})})()</script>
