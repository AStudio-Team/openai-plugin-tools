<!doctype html><meta charset="utf-8"><title>Review schema facts</title><style>body{font:16px system-ui;margin:auto;max-width:760px;padding:20px;background:#f5f3ed;color:#17211b}pre{white-space:pre-wrap;background:#fff;padding:16px;border:1px solid #ccd2ca}button{padding:10px 15px;font-weight:700}#status{font-weight:700}</style><main><h1>Review schema facts</h1><p>Read-only facts. Approval is required before markup can be generated.</p><pre id="facts">Waiting for facts.</pre><p id="missing"></p><button id="approve" disabled>Approve these facts</button><p id="status"></p></main><script type="module">/*__EXT_APPS_BUNDLE__*/(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SchemaBriefReview",version:"1.0.0"},{},{autoResize:true});let brief;app.ontoolresult=e=>{const d=e.structuredContent;brief=d?.brief;document.querySelector("#facts").textContent=JSON.stringify(brief,null,2);document.querySelector("#missing").textContent=d?.missing?.length?`Missing required facts: ${d.missing.join(", ")}`:"All required facts are supplied.";document.querySelector("#approve").disabled=!d?.canApprove};document.querySelector("#approve").onclick=async()=>{if(!brief)return;document.querySelector("#approve").disabled=true;await app.sendMessage({role:"user",content:[{type:"text",text:`I explicitly approve these exact schema facts. Call the app-only approval tool to issue a receipt, then use that receipt for generation.\n${JSON.stringify(brief)}`}]});document.querySelector("#status").textContent="Approval requested in chat. A receipt for these exact facts is required."};app.connect()})()</script>
