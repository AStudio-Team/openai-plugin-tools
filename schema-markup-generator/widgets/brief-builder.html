<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schema facts</title><style>body{font:16px system-ui;margin:auto;max-width:760px;padding:20px;background:#f5f3ed;color:#17211b}label,input,select,textarea{display:block;width:100%;margin:8px 0}input,select,textarea{box-sizing:border-box;padding:9px}textarea{min-height:140px}button{padding:10px 15px;font-weight:700}small{color:#526057}</style><main><h1>Schema Markup facts</h1><p>Enter facts visible on the page. This tool does not fetch or change your website.</p><form id="brief"><label>Page type<select id="type"><option>Organization</option><option>LocalBusiness</option><option>Product</option><option>Article</option><option>FAQPage</option><option>HowTo</option><option>Event</option><option>Service</option><option>WebSite</option><option>Person</option><option>BreadcrumbList</option></select></label><label>Page URL<input id="url" type="text" required placeholder="https://example.com/page"></label><label>Facts as JSON<textarea id="facts" required placeholder='{"name":"Example","url":"https://example.com"}'></textarea></label><small>Required facts depend on the selected type. Review shows anything missing.</small><p id="status"></p><button>Review facts</button></form></main><script type="module">/*__EXT_APPS_BUNDLE__*/(()=>{const{App}=globalThis.ExtApps,app=new App({name:"SchemaBriefBuilder",version:"1.0.0"},{},{autoResize:true}),$=id=>document.getElementById(id);$("brief").onsubmit=async e=>{e.preventDefault();let facts;try{facts=JSON.parse($("facts").value)}catch{$("status").textContent="Facts must be valid JSON.";return}const brief={pageType:$("type").value,pageUrl:$("url").value.trim(),facts};try{new URL(brief.pageUrl);await app.sendMessage({role:"user",content:[{type:"text",text:`Review these schema facts. Do not generate markup yet.\n${JSON.stringify(brief)}`}]})}catch(error){$("status").textContent=`Unable to send: ${error?.message||"Try again."}`}};app.ontoolresult=e=>{const p=e.structuredContent?.preFill||{};if(p.pageUrl)$("url").value=p.pageUrl;if(p.facts)$("facts").value=JSON.stringify(p.facts,null,2)};app.connect().catch(error=>{$("status").textContent=`App connection failed: ${error?.message||"Try again."}`})})()</script>
