<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export content strategy</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px 16px;margin:5px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px;max-height:420px;overflow:auto}</style></head><body><h1>Export content strategy</h1><p>Export as CSV or Markdown.</p><button data-format="csv">Export CSV</button><button data-format="markdown">Export Markdown</button><button id="copy" hidden>Copy</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Content Strategy Export",version:"1.0.0"},{},{autoResize:true});let input={},data={};const status=document.querySelector("#status"),preview=document.querySelector("#file"),copy=document.querySelector("#copy");function show(file){if(!file?.content)return;preview.textContent=file.content;preview.hidden=false;preview.dataset.fileName=file.fileName;copy.hidden=false}copy.onclick=async()=>{try{await navigator.clipboard.writeText(preview.textContent);status.textContent=`${preview.dataset.fileName} copied.`}catch{status.textContent="Copy is unavailable. Select the visible text instead."}};const toolText=result=>result.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";async function download(format){status.textContent="Preparing export";let response;try{response=await app.callServerTool({name:"export_content_strategy",arguments:{brief:input.brief||data.brief,approvalReceipt:input.approvalReceipt||data.approvalReceipt,strategy:input.strategy||data.strategy,format}})}catch{status.textContent="Export failed. Confirm a valid approved strategy first.";return}if(response.isError){status.textContent=toolText(response);return}const file=response.structuredContent;if(!file?.content){status.textContent="Export failed. Confirm a valid approved strategy first.";return}show(file);status.textContent=`${file.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName} (${file.mimeType}). The content is visible in the export panel.`}]})}catch{status.textContent+=" Chat announcement was unavailable."}try{await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]})}catch{status.textContent+=" Download is not available in this host."}}document.querySelectorAll("button[data-format]").forEach(b=>b.onclick=()=>download(b.dataset.format));app.ontoolinput=e=>{input=e.arguments||e||{}};app.ontoolresult=e=>{data=e.structuredContent||{};show(data)};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
