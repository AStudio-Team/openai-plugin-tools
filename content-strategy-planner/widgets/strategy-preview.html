<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content strategy</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:760px}.card{border:1px solid #888;border-radius:10px;padding:12px;margin:8px 0}label{display:block;font-weight:700;margin-top:12px}input,select,button{font:inherit;box-sizing:border-box;padding:9px}input{width:100%}button{margin-top:12px;font-weight:700}</style></head><body><h1>Content strategy</h1><div id="strategy"></div><label for="target">Revise a</label><select id="target"><option value="pillar">pillar</option><option value="piece">piece</option></select><label for="instruction">Visible revision instruction</label><input id="instruction"><button id="revise">Request revision</button><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Content Strategy Preview",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#strategy"),status=document.querySelector("#status"),button=document.querySelector("#revise");function render(data){root.replaceChildren();for(const pillar of data.strategy?.pillars||[]){const card=document.createElement("section");card.className="card";const heading=document.createElement("h2");heading.textContent=pillar.name;const hub=document.createElement("p");hub.textContent=`Hub: ${pillar.hubPage.title} - ${pillar.hubPage.targetQuery}`;const list=document.createElement("ul");for(const piece of pillar.spokes){const item=document.createElement("li");item.textContent=`Month ${piece.month}: ${piece.title} - ${piece.targetQuery}`;list.append(item)}card.append(heading,hub,list);root.append(card)}status.textContent=data.valid?"Strategy passes validation.":(data.issues||[]).join(" ")}button.onclick=async()=>{button.disabled=true;try{const target=document.querySelector("#target").value,instruction=document.querySelector("#instruction").value;const result=await app.callServerTool({name:"request_strategy_revision",arguments:{target,instruction}});if(result.isError)throw new Error("Revision rejected");await app.sendMessage({role:"user",content:[{type:"text",text:`Revise this ${target} using this visible instruction: ${instruction}`}]});status.textContent="Revision requested."}catch{status.textContent="Revision failed. Enter a visible instruction."}finally{button.disabled=false}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The strategy could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
