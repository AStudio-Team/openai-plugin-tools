<!doctype html><html><body><main><h1>Content strategy</h1><p id="status">Review strategy results in chat.</p><label>Revision instruction <input id="instruction"></label><button id="revise">Request revision</button></main><script>(()=>{const b=document.querySelector('#revise');b.addEventListener('click',async()=>{b.disabled=true;try{await globalThis.openai?.callServerTool('request_strategy_revision',{target:'pillar',instruction:document.querySelector('#instruction').value});await globalThis.openai?.sendMessage({text:'Please revise this pillar using the instruction shown.'});document.querySelector('#status').textContent='Revision requested.'}catch(e){document.querySelector('#status').textContent=`Revision failed: ${e.message}`}finally{b.disabled=false}})})()</script></body></html>
