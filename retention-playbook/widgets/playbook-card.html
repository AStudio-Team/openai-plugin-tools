<!doctype html><html lang="en"><meta charset="utf-8"><title>Retention playbook</title><style>body{font:15px system-ui;margin:20px}.card{border:1px solid #888;border-radius:10px;padding:12px;margin:10px 0}button,textarea{font:inherit;padding:8px;margin:4px}textarea,pre{box-sizing:border-box;width:100%;white-space:pre-wrap}</style><h1>Retention playbook</h1><div id="plays"></div><button data-format="markdown">Export Markdown</button><button data-format="csv">Export CSV</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Retention Playbook Preview",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#plays"),status=document.querySelector("#status"),file=document.querySelector("#file");let input={},data={};const projectBrief=b=>b&&({productType:b.productType,billingModel:b.billingModel,...(b.currentChurnRate?{currentChurnRate:b.currentChurnRate}:{}),activationEvent:b.activationEvent,knownCancelReasons:b.knownCancelReasons,channelsAvailable:b.channelsAvailable,offersAllowed:b.offersAllowed,constraints:b.constraints});const projectPlay=p=>({area:p.area,trigger:p.trigger,audience:p.audience,channel:p.channel,message:p.message,ownerRole:p.ownerRole,successMetric:p.successMetric,...(p.saveOffer?{saveOffer:p.saveOffer}:{}),...(p.cancelPath?{cancelPath:p.cancelPath}:{}),...(p.exitSurvey?{exitSurvey:p.exitSurvey}:{})});const showFile=result=>{file.textContent=result.content;file.hidden=false;let copy=document.querySelector("#copy");if(!copy){copy=document.createElement("button");copy.id="copy";copy.textContent="Copy";copy.onclick=async()=>{try{await navigator.clipboard.writeText(file.textContent);status.textContent="Copied."}catch{status.textContent="Copy is unavailable in this host."}};file.before(copy)}};function render(result){data=result;root.replaceChildren();for(const rawPlay of result.plays||[]){const play=projectPlay(rawPlay),card=document.createElement("section"),title=document.createElement("h2"),body=document.createElement("p"),instruction=document.createElement("textarea"),button=document.createElement("button");card.className="card";title.textContent=play.area;body.textContent=`Trigger: ${play.trigger} | Audience: ${play.audience} | Channel: ${play.channel} | Message: ${play.message} | Owner: ${play.ownerRole} | Metric: ${play.successMetric}${play.cancelPath?` | Cancel path: ${play.cancelPath}`:""}`;instruction.placeholder="Revision instruction";button.textContent="Request revision";button.onclick=async()=>{button.disabled=true;try{const response=await app.callServerTool({name:"request_playbook_revision",arguments:{play,instruction:instruction.value}});if(response.isError)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Revise ${play.area}: ${instruction.value}`}]});status.textContent="Revision requested."}catch{status.textContent="Revision request failed.";button.disabled=false}};card.append(title,body,instruction,button);root.append(card)}}const toolText=response=>response.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";async function exportFile(format){let response;try{response=await app.callServerTool({name:"export_retention_playbook",arguments:{brief:projectBrief(data.brief||input.brief),plays:data.plays.map(projectPlay),approvalReceipt:input.approvalReceipt||data.approvalReceipt,format}})}catch(error){status.textContent=`Export failed: ${error.message||"reason unavailable"}`;return}if(response.isError||!response.structuredContent?.content){status.textContent=toolText(response);return}const result=response.structuredContent;showFile(result);status.textContent=`${result.fileName} is ready. Copy the content below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${result.fileName}; its content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${result.fileName}`,mimeType:result.mimeType,text:result.content}}]});if(downloaded?.isError)throw Error()}catch{status.textContent+=" Download is not available in this host."}}document.querySelectorAll("[data-format]").forEach(button=>button.onclick=()=>exportFile(button.dataset.format));app.ontoolinput=event=>{input=event.arguments||event||{}};app.ontoolresult=event=>{try{render(event.structuredContent||{})}catch{status.textContent="The playbook could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></html>
