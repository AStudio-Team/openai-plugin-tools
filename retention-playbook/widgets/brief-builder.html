<!doctype html><html lang="en"><meta charset="utf-8"><title>Retention brief</title><style>body{font:15px system-ui;margin:20px;max-width:760px}label{display:block;font-weight:bold;margin-top:10px}input,textarea,button{box-sizing:border-box;font:inherit;padding:8px;width:100%}textarea{min-height:54px}button{margin-top:16px}</style><h1>Build your retention brief</h1><form id="form"></form><p id="status" aria-live="polite"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:"Retention Brief",version:"1.0.0"},{},{autoResize:true}),form=document.querySelector("#form"),status=document.querySelector("#status");const fields={productType:"Product type",billingModel:"Billing model",currentChurnRate:"Current churn rate (optional)",activationEvent:"Activation event",knownCancelReasons:"Known cancel reasons, one per line",channelsAvailable:"Channels available: email, in-app, SMS, account manager",offersAllowed:"Allowed offers: discount, pause, downgrade, plan switch, none",constraints:"Constraints"};for(const [name,label] of Object.entries(fields)){const l=document.createElement("label"),x=document.createElement(["knownCancelReasons","channelsAvailable","offersAllowed","constraints"].includes(name)?"textarea":"input");l.textContent=label;x.name=name;x.required=name!=="currentChurnRate";l.append(x);form.append(l,x)}const button=document.createElement("button");button.textContent="Review brief";form.append(button);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;const raw=Object.fromEntries(new FormData(form)),brief={productType:raw.productType,billingModel:raw.billingModel,activationEvent:raw.activationEvent,knownCancelReasons:raw.knownCancelReasons.split(/\n+/).filter(Boolean),channelsAvailable:raw.channelsAvailable.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean),offersAllowed:raw.offersAllowed.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean),constraints:raw.constraints};if(raw.currentChurnRate.trim())brief.currentChurnRate=raw.currentChurnRate.trim();try{const r=await app.callServerTool({name:"review_retention_brief",arguments:brief});if(!r.structuredContent?.normalizedBrief)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Review this retention brief: ${JSON.stringify(r.structuredContent.normalizedBrief)}`}]});status.textContent="Brief ready for review."}catch{status.textContent="Brief review failed. Check every required field."}button.disabled=false};try{await app.connect()}catch{status.textContent="Host connection is unavailable."}</script>
