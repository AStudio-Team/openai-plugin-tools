<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export retention playbook</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px 16px;margin:5px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px;max-height:420px;overflow:auto}</style></head><body><h1>Export retention playbook</h1><p>Download through the host as Markdown or CSV.</p><button data-format="markdown">Download Markdown</button><button data-format="csv">Download CSV</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Retention Playbook Export",version:"1.0.1"},{},{autoResize:true});let input={},data={};const status=document.querySelector("#status"),preview=document.querySelector("#file");const brief=b=>({productType:b.productType,billingModel:b.billingModel,...(b.currentChurnRate?{currentChurnRate:b.currentChurnRate}:{}),activationEvent:b.activationEvent,knownCancelReasons:b.knownCancelReasons,channelsAvailable:b.channelsAvailable,offersAllowed:b.offersAllowed,constraints:b.constraints});const play=p=>({area:p.area,trigger:p.trigger,audience:p.audience,channel:p.channel,message:p.message,ownerRole:p.ownerRole,successMetric:p.successMetric,...(p.saveOffer?{saveOffer:p.saveOffer}:{}),...(p.cancelPath?{cancelPath:p.cancelPath}:{}),...(p.exitSurvey?{exitSurvey:p.exitSurvey}:{})});function show(file){if(!file?.content)return;preview.textContent=file.content;preview.hidden=false;preview.dataset.fileName=file.fileName;let copy=document.querySelector("#copy-export");if(!copy){copy=document.createElement("button");copy.id="copy-export";copy.textContent="Copy";copy.onclick=async()=>{try{if(globalThis.navigator?.clipboard)await globalThis.navigator.clipboard.writeText(preview.textContent);else{const range=document.createRange?.();if(range){range.selectNodeContents(preview);globalThis.getSelection?.().removeAllRanges();globalThis.getSelection?.().addRange(range)}document.execCommand?.("copy")}status.textContent="Copied."}catch{status.textContent="Copy is unavailable in this host."}};preview.before(copy)}}const toolText=result=>result.content?.filter(x=>x.type==="text").map(x=>x.text).join("\n")||"Export failed.";async function download(format){status.textContent="Preparing download";let response;try{const source=input.brief?input:data;response=await app.callServerTool({name:"export_retention_playbook",arguments:{brief:brief(source.brief),plays:source.plays.map(play),approvalReceipt:source.approvalReceipt,format}})}catch{status.textContent="Download failed. Confirm an approved playbook first.";return}if(response.isError){status.textContent=toolText(response);return}const file=response.structuredContent;if(!file?.content){status.textContent="Download failed. Confirm an approved playbook first.";return}show(file);status.textContent=`${file.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName} (${file.mimeType}); the content is shown in the card.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const downloaded=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});if(downloaded?.isError)throw new Error("download denied")}catch{status.textContent+=" Download is not available in this host."}}document.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>download(b.dataset.format));app.ontoolinput=e=>{try{input=e.arguments||e||{}}catch{status.textContent="Invalid export input."}};app.ontoolresult=e=>{try{data=e.structuredContent||{};show(data)}catch{status.textContent="The exported file could not be shown."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
