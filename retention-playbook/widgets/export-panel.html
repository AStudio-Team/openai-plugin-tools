<!doctype html><html lang="en"><meta charset="utf-8"><title>Export retention playbook</title><style>body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px;margin:4px}pre{white-space:pre-wrap;border:1px solid #888;padding:10px}</style><h1>Export retention playbook</h1><button data-format="markdown">Export Markdown</button><button data-format="csv">Export CSV</button><p id="status" aria-live="polite"></p><h2 id="name"></h2><button id="copy" hidden>Copy</button><pre id="file" hidden></pre><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:"Retention Playbook Export",version:"1.0.0"},{},{autoResize:true}),status=document.querySelector("#status"),out=document.querySelector("#file"),name=document.querySelector("#name"),copy=document.querySelector("#copy");let input={},data={};function show(file){if(!file?.content)return;name.textContent=file.fileName;out.textContent=file.content;out.hidden=copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(file.content);status.textContent="Copied."}catch{status.textContent="Copy is unavailable in this host."}}}async function run(format){let r;try{r=await app.callServerTool({name:"export_retention_playbook",arguments:{brief:input.brief||data.brief,plays:input.plays||data.plays,approvalReceipt:input.approvalReceipt||data.approvalReceipt,format}})}catch{status.textContent="Export failed. Confirm an approved playbook first.";return}if(r.isError){status.textContent=r.content?.find(x=>x.type==="text")?.text||"Export failed.";return}const file=r.structuredContent;show(file);status.textContent=`${file.fileName} is ready. Copy the content below.`;try{await app.sendMessage({role:"user",content:[{type:"text",text:`Exported ${file.fileName}; its content is shown in the export panel.`}]})}catch{status.textContent+=" Chat announcement not delivered."}try{const d=await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});if(d?.isError)throw Error()}catch{status.textContent+=" Download is not available in this host."}}document.querySelectorAll("[data-format]").forEach(x=>x.onclick=()=>run(x.dataset.format));app.ontoolinput=e=>{try{input=e.arguments||e||{}}catch{status.textContent="Invalid export input."}};app.ontoolresult=e=>{try{data=e.structuredContent||{};show(data)}catch{status.textContent="The exported file could not be shown."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}</script>
