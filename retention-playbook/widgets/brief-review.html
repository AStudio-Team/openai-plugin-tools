<!doctype html><html lang="en"><meta charset="utf-8"><title>Review retention brief</title><style>body{font:15px system-ui;margin:20px;max-width:760px}.card{border:1px solid #888;border-radius:8px;padding:10px;margin:8px 0}button{font:inherit;padding:10px}</style><h1>Review retention brief</h1><div id="brief"></div><button id="approve" disabled>Approve brief</button><p id="status" aria-live="polite"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:"Retention Brief Review",version:"1.0.0"},{},{autoResize:true}),root=document.querySelector("#brief"),button=document.querySelector("#approve"),status=document.querySelector("#status");let brief;function render(data){brief=data.normalizedBrief;root.replaceChildren();for(const [k,v] of Object.entries(brief||{})){const x=document.createElement("p");x.className="card";x.textContent=`${k}: ${Array.isArray(v)?v.join(", "):v}`;root.append(x)}button.disabled=!data.canApprove}button.onclick=async()=>{button.disabled=true;try{const r=await app.callServerTool({name:"approve_retention_brief",arguments:{brief,approvalAction:"approve"}}),receipt=r.structuredContent?.approvalReceipt;if(!receipt)throw Error();await app.sendMessage({role:"user",content:[{type:"text",text:`Draft the retention playbook with this signed approval receipt: ${JSON.stringify(receipt)}`}]});status.textContent="Brief approved with a signed receipt."}catch{status.textContent="Approval failed. Try again.";button.disabled=false}};app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The brief could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}</script>
