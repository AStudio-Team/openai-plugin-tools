<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light;--page:oklch(98% .008 70);--surface:oklch(95% .012 70);--ink:oklch(26% .025 35);--muted:oklch(48% .02 40);--line:oklch(82% .018 65);--accent:oklch(58% .15 36);--accent-ink:oklch(99% .005 70);--pass:oklch(49% .12 150);--warn:oklch(62% .13 75);--block:oklch(52% .18 25);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.dark{color-scheme:dark;--page:oklch(20% .012 40);--surface:oklch(25% .014 40);--ink:oklch(93% .008 70);--muted:oklch(73% .015 60);--line:oklch(39% .018 45);--accent:oklch(70% .14 45);--accent-ink:oklch(18% .02 35);--pass:oklch(72% .12 150);--warn:oklch(78% .13 80);--block:oklch(74% .16 25)}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);padding:calc(24px + var(--safe-top,0px)) calc(24px + var(--safe-right,0px)) calc(24px + var(--safe-bottom,0px)) calc(24px + var(--safe-left,0px))}main{max-width:880px;margin:auto}h1{font-size:1.5rem;line-height:1.2;margin:0}h2{font-size:1.125rem;margin:32px 0 12px}.header{display:flex;justify-content:space-between;gap:16px;align-items:start}.eyebrow,.muted{color:var(--muted)}.eyebrow{font-size:.875rem;margin:0}.status{font-weight:750}.summary{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;margin:24px 0;overflow:hidden}.metric{padding:16px}.metric+.metric{border-left:1px solid var(--line)}.metric strong{display:block;font-size:1.5rem}.callout{padding:16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;margin:16px 0}.finding{border-top:1px solid var(--line)}summary{cursor:pointer;min-height:48px;padding:14px 0;display:flex;align-items:center;gap:12px;font-weight:650}summary:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.pill{font-size:.875rem;font-weight:750}.pill.pass{color:var(--pass)}.pill.warn,.pill.error{color:var(--warn)}.pill.block{color:var(--block)}.evidence{background:var(--surface);border-radius:12px;padding:16px;margin:0 0 16px;overflow-wrap:anywhere}.evidence dl{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:0}.evidence dd{margin:0}.remediation{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}.remediation input{width:24px;height:24px;margin:2px 0}.remediation label{font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}button{min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--ink);font:inherit;font-weight:650;cursor:pointer}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}.open{background:none;border:0;color:var(--accent);padding:0;min-height:44px;text-decoration:underline}.group{margin-top:16px}[hidden]{display:none!important}@media(max-width:620px){body{padding:calc(16px + var(--safe-top,0px)) calc(16px + var(--safe-right,0px)) calc(16px + var(--safe-bottom,0px)) calc(16px + var(--safe-left,0px))}.header{display:block}.summary{grid-template-columns:1fr 1fr}.metric:nth-child(3){border-left:0;border-top:1px solid var(--line)}.metric:nth-child(4){border-top:1px solid var(--line)}.evidence dl{grid-template-columns:1fr}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main><div id="loading" aria-live="polite">Loading audit evidence...</div><div id="app" hidden><header class="header"><div><p class="eyebrow">Public technical signals</p><h1 id="title">Audit result</h1><p id="target" class="muted"></p></div><button id="open" class="open">Open audited page</button></header><div id="limitations" class="callout" hidden></div><section class="summary" aria-label="Audit summary"><div class="metric"><strong id="blockers">0</strong>Blockers</div><div class="metric"><strong id="warnings">0</strong>Warnings</div><div class="metric"><strong id="passed">0</strong>Passed</div><div class="metric"><strong id="untested">0</strong>Untested</div></section><div id="groups"></div><section><h2>Choose what to address</h2><p class="muted">Nothing is selected by default. Guidance does not modify the website.</p><div id="remediations"></div><div class="actions"><button id="guide" class="primary" disabled>Ask for guidance on selected items</button><button id="recheck" disabled>Recheck selected items</button><button id="all">Recheck all</button><button id="download">Download JSON</button><button id="cancel">Cancel</button></div><p id="action-status" role="status" class="muted"></p></section></div></main><script type="module">
/*__EXT_APPS_BUNDLE__*/
const {App,applyHostStyleVariables}=globalThis.ExtApps;const app=new App({name:"AI Crawler Readiness Results",version:"1.0.0"},{},{autoResize:true});let data=null,sent=false;const by=id=>document.getElementById(id);const names={access:"Access",discovery:"Discovery",page:"Page Signals",structured_data:"Structured Data",transport:"Transport"};const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));function selected(){return [...document.querySelectorAll("input[name=rem]:checked")].map(input=>input.value)}function update(){const any=selected().length>0;by("guide").disabled=!any||sent;by("recheck").disabled=!any||sent}function send(text){if(sent)return;sent=true;document.querySelectorAll("button,input").forEach(control=>control.disabled=true);by("action-status").textContent="Choice sent to chat.";app.sendMessage({role:"user",content:[{type:"text",text}]})}function render(value){data=value;by("loading").hidden=true;by("app").hidden=false;by("title").textContent=value.status.replaceAll("_"," ");by("target").textContent=`${value.target.displayUrl} · completed ${value.completedAt}`;for(const [id,key] of [["blockers","blockers"],["warnings","warnings"],["passed","passed"],["untested","notTested"]])by(id).textContent=value.summary[key];const notes=[...(value.partial?["This is a partial result. Some checks did not complete."]:[]),...value.errors.map(error=>error.message),...value.disclaimers];if(notes.length){by("limitations").hidden=false;by("limitations").textContent=notes.join(" ")}const groups=by("groups");groups.innerHTML="";for(const category of Object.keys(names)){const findings=value.checks.filter(item=>item.category===category);if(!findings.length)continue;const section=document.createElement("section");section.className="group";section.innerHTML=`<h2>${names[category]}</h2>`;for(const finding of findings){const details=document.createElement("details");details.className="finding";details.open=["block","warn","error"].includes(finding.outcome);const evidence=finding.evidence.map(item=>`<div class="evidence"><dl><dt>Source</dt><dd>${esc(item.sourceUrl)}</dd><dt>Retrieved</dt><dd>${esc(item.retrievedAt)}</dd><dt>HTTP</dt><dd>${esc(item.httpStatus??"Unavailable")}</dd><dt>Observed</dt><dd>${esc(item.observed)}</dd><dt>Expected</dt><dd>${esc(item.expected)}</dd>${item.excerpt?`<dt>Excerpt</dt><dd>${esc(item.excerpt)}</dd>`:""}</dl></div>`).join("");details.innerHTML=`<summary><span class="pill ${finding.outcome}">${esc(finding.outcome.replace("_"," "))}</span>${esc(finding.title)}</summary><p>${esc(finding.explanation)}</p>${evidence}${finding.limitations.map(note=>`<p class="muted">${esc(note)}</p>`).join("")}`;section.append(details)}groups.append(section)}const rem=by("remediations");rem.innerHTML="";if(!value.remediations.length)rem.innerHTML="<p>No remediation items were generated within this scope.</p>";for(const item of value.remediations){const row=document.createElement("div");row.className="remediation";row.innerHTML=`<input type="checkbox" name="rem" id="${esc(item.id)}" value="${esc(item.id)}"><div><label for="${esc(item.id)}">${esc(item.id)} · ${esc(item.title)}</label><p>${esc(item.action)}</p><p class="muted">Verify: ${esc(item.verification)}</p></div>`;row.querySelector("input").addEventListener("change",update);rem.append(row)}update()}app.ontoolresult=result=>render(result.structuredContent);app.onhostcontextchanged=ctx=>theme(ctx);function theme(ctx){document.documentElement.classList.toggle("dark",ctx?.theme==="dark");if(ctx?.styles?.variables&&applyHostStyleVariables)applyHostStyleVariables(ctx.styles.variables);const s=ctx?.safeAreaInsets||{};for(const key of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${key}`,`${s[key]||0}px`)}by("guide").addEventListener("click",()=>send(`Give me implementation guidance for remediation items ${selected().join(" and ")}. Do not modify the site.`));by("recheck").addEventListener("click",()=>{const ids=selected(),checks=[...new Set(data.remediations.filter(item=>ids.includes(item.id)).flatMap(item=>item.findingIds))];send(`Recheck ${data.target.displayUrl} for checks ${checks.join(", ")}. Validate and show a new checkpoint first if the prior checkpoint expired or the destination changed.`)});by("all").addEventListener("click",()=>send(`Recheck all original checks for ${data.target.displayUrl}. Validate and show a new checkpoint first if required.`));by("cancel").addEventListener("click",()=>send("Cancel this crawler-readiness follow-up. Do not run another audit."));by("open").addEventListener("click",()=>data&&app.openLink({url:data.target.url}));by("download").addEventListener("click",()=>{if(!data)return;const bytes=new TextEncoder().encode(JSON.stringify(data,null,2));let binary="";for(const byte of bytes)binary+=String.fromCharCode(byte);app.downloadFile({name:"ai-crawler-readiness-audit.json",mimeType:"application/json",content:btoa(binary)});by("action-status").textContent="JSON download requested."});await app.connect();theme(app.getHostContext());
</script></body></html>
