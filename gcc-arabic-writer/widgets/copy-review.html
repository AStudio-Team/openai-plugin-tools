<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arabic copy review</title>
<style>
:root{color-scheme:light dark;--bg:#fffaf7;--panel:#fff;--text:#261d1b;--muted:#6f625e;--line:#dccfca;--good:#176b4d;--bad:#a33b2b;--warn:#8a5c00;--accent:#7b3f2d;--accent-text:#fff;--focus:#137c8b}html.dark{--bg:#191514;--panel:#231e1c;--text:#f7efeb;--muted:#c5b8b2;--line:#554641;--good:#75d6ae;--bad:#ff9a88;--warn:#ffd28c;--accent:#d88d73;--accent-text:#1c1210;--focus:#72d5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,var(--safe-top,0px)) max(16px,var(--safe-right,0px)) max(16px,var(--safe-bottom,0px)) max(16px,var(--safe-left,0px))}main{max-width:720px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}h1{font-size:1.25rem;margin:0}.summary{display:flex;align-items:center;gap:9px;margin:8px 0 14px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:var(--good)}.dot.fail{background:var(--bad)}dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:0 0 14px}dt{font-weight:700}dd{margin:0;color:var(--muted)}ul{padding-left:20px;margin:8px 0 14px}li{margin:6px 0}.error{color:var(--bad)}.warning{color:var(--warn)}.note{border-top:1px solid var(--line);padding-top:12px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}button{border:1px solid var(--accent);border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:var(--accent-text)}.secondary{background:transparent;color:var(--accent)}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button[disabled]{opacity:.6}#status{min-height:1.4em;margin-top:9px;color:var(--muted)}@media(max-width:520px){body{padding:12px}main{padding:13px}dl{grid-template-columns:1fr;gap:2px}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body><main><h1 id="title">Arabic copy review</h1><div class="summary"><span id="dot" class="dot"></span><strong id="outcome">Review ready</strong></div><dl id="metrics"></dl><ul id="issues"></ul><p id="note" class="note"></p><div class="actions"><button id="revise" class="primary" type="button">Ask for a revision</button><button id="accept" class="secondary" type="button">Keep current option</button></div><div id="status" role="status" aria-live="polite"></div></main>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;
const app = new App({ name: "GCC Arabic Review", version: "1.1.0" }, {}, { autoResize: true });
const byId = id => document.getElementById(id);
let latest = {};
function applyTheme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const insets=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${Number(insets[side]||0)}px`)}
function dataFrom(result){if(result?.structuredContent)return result.structuredContent;const text=result?.content?.find(item=>item.type==="text")?.text;try{return JSON.parse(text)}catch{return {}}}
function addMetric(term,value){const dt=document.createElement("dt");dt.textContent=term;const dd=document.createElement("dd");dd.textContent=String(value);byId("metrics").append(dt,dd)}
function render(result){latest=dataFrom(result);byId("metrics").replaceChildren();byId("issues").replaceChildren();const fidelity=Object.hasOwn(latest,"preservation_passed");const passed=fidelity?latest.preservation_passed:latest.passed;byId("title").textContent=fidelity?"Factual fidelity review":"Arabic style and safety review";byId("dot").classList.toggle("fail",!passed);byId("outcome").textContent=passed?(fidelity?"Required literals and numbers were preserved":"No blocking lint errors found"):(fidelity?"Revision required for factual fidelity":"Revision recommended before final use");if(fidelity){addMetric("Missing items",latest.missing_facts?.length||0);addMetric("Extra numeric claims",latest.extra_numeric_claims?.length||0);for(const item of latest.missing_facts||[]){const li=document.createElement("li");li.className="error";li.textContent=`Missing ${item.category}: ${item.literal}`;byId("issues").append(li)}for(const value of latest.extra_numeric_claims||[]){const li=document.createElement("li");li.className="error";li.textContent=`Extra numeric claim: ${value}`;byId("issues").append(li)}}else{addMetric("Words",latest.metrics?.words??0);addMetric("Arabic-script ratio",latest.metrics?.arabic_script_ratio??0);for(const issue of latest.issues||[]){const li=document.createElement("li");li.className=issue.severity;li.textContent=`${issue.severity}: ${issue.message}${issue.matches?.length?` (${issue.matches.join(", ")})`:""}`;byId("issues").append(li)}}if(!byId("issues").children.length){const li=document.createElement("li");li.textContent="No deterministic issues were reported.";byId("issues").append(li)}byId("note").textContent=latest.scope_note||"This automated review does not replace native-market, legal or cultural review."}
async function send(text,button){button.disabled=true;byId("status").textContent="Sending to chat...";try{const response=await app.sendMessage({role:"user",content:[{type:"text",text}]});byId("status").textContent=response?.isError?"The host did not accept the message. Type the request in chat instead.":"Sent to chat."}catch{byId("status").textContent="Could not send through the widget. Type the request in chat instead."}finally{button.disabled=false}}
app.ontoolresult=render;app.onhostcontextchanged=applyTheme;byId("revise").addEventListener("click",event=>send(`Revise the Arabic copy to address this review, preserve all approved facts and protected literals, and show the revised option before treating it as final:\n${JSON.stringify(latest,null,2)}`,event.currentTarget));byId("accept").addEventListener("click",event=>send("Keep the current Arabic option. Clearly restate any remaining warnings and any native-market review requirement before final use.",event.currentTarget));await app.connect();applyTheme(app.getHostContext?.());
</script></body></html>
