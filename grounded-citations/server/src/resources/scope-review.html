<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><style>
:root{color-scheme:light dark;--bg:#f5f1e8;--panel:#fffdf8;--ink:#14231d;--muted:#5f6e68;--line:#cdd6ce;--accent:#146b4d;--accent2:#d9efe4;--warn:#8b4c12;--bad:#9a2f35;--focus:#1967d2}html.dark{--bg:#101815;--panel:#17231e;--ink:#edf5f0;--muted:#a9bbb2;--line:#384a41;--accent:#73d4aa;--accent2:#214535;--warn:#ffc078;--bad:#ff9aa1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}.shell{max-width:760px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{font:700 clamp(24px,7vw,38px)/1.05 ui-serif,Georgia;margin:5px 0 8px}p{margin:4px 0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:10px;align-items:flex-start}.grow{flex:1;min-width:0}.title{font-weight:750;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}.status.bad{color:var(--bad)}.status.warn{color:var(--warn)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent)}button.danger{color:var(--bad)}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.empty{padding:28px;text-align:center;color:var(--muted)}.quote{border-left:3px solid var(--accent);padding-left:10px;margin-top:8px;font-family:ui-serif,Georgia}.pill{display:inline-block;background:var(--accent2);padding:3px 8px;border-radius:999px;font-size:12px}.grid{display:grid;gap:10px}@media(min-width:580px){.grid.two{grid-template-columns:1fr 1fr}}@media(max-width:340px){body{padding:8px}.card{padding:10px}.actions button{width:100%}}</style></head><body><main class="shell"><div class="eyebrow">Grounded Citations</div><h1>Review source scope</h1><p id="brief">Loading checkpoint...</p><section id="sources" aria-live="polite"></section><div class="actions"><button class="primary" id="confirm">Use selected sources</button><button id="revise">Revise intake</button><button class="danger" id="cancel">Cancel</button></div></main><script type="module">/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"Grounded Citations Scope",version:"1.0.0"},{},{autoResize:true});let data=null;const selected=new Set();const sources=document.getElementById("sources");
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}function render(){sources.replaceChildren();if(!data?.sources?.length){sources.append(text("div","No sources were supplied.","card empty"));return}for(const s of data.sources){const card=text("article","","card");const row=text("div","","row");const box=document.createElement("input");box.type="checkbox";box.id=`source-${s.source_key}`;box.checked=["accepted","partial"].includes(s.intake_status);box.disabled=!["accepted","partial"].includes(s.intake_status);if(box.checked)selected.add(s.source_key);box.addEventListener("change",()=>box.checked?selected.add(s.source_key):selected.delete(s.source_key));const label=document.createElement("label");label.htmlFor=box.id;label.className="grow";label.append(text("div",s.display_title,"title"),text("div",`${s.kind} · ${s.extracted_characters} characters`,"meta"));const state=text("span",s.intake_status,`status ${s.intake_status==="rejected"?"bad":s.intake_status==="partial"?"warn":""}`);row.append(box,label,state);card.append(row);for(const warning of s.warnings||[])card.append(text("p",warning,"meta"));sources.append(card)}}
app.ontoolresult=result=>{data=result.structuredContent||JSON.parse(result.content?.[0]?.text||"null");document.getElementById("brief").textContent=`${data.brief.objective} · ${data.brief.mode} · ${data.brief.output_format}`;render()};function applyTheme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark")}app.onhostcontextchanged=applyTheme;await app.connect();applyTheme(app.getHostContext());function send(message){app.sendMessage({role:"user",content:[{type:"text",text:message}]})}document.getElementById("confirm").onclick=()=>{if(!selected.size)return send("No usable source is selected. Please revise the intake.");send(`Use selected sources for session ${data.session_id}, scope revision ${data.revision}: ${[...selected].join(", ")}`)};document.getElementById("revise").onclick=()=>send("Revise the citation intake and return to the scope checkpoint.");document.getElementById("cancel").onclick=()=>send(`Cancel and delete citation session ${data?.session_id||""}.`);</script></body></html>
