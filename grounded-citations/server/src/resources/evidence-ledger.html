<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><style>
:root{color-scheme:light dark;--bg:#f5f1e8;--panel:#fffdf8;--ink:#14231d;--muted:#5f6e68;--line:#cdd6ce;--accent:#146b4d;--accent2:#d9efe4;--warn:#8b4c12;--bad:#9a2f35;--focus:#1967d2}html.dark{--bg:#101815;--panel:#17231e;--ink:#edf5f0;--muted:#a9bbb2;--line:#384a41;--accent:#73d4aa;--accent2:#214535;--warn:#ffc078;--bad:#ff9aa1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}.shell{max-width:760px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}h1{font:700 clamp(24px,7vw,38px)/1.05 ui-serif,Georgia;margin:5px 0 8px}p{margin:4px 0;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:10px;align-items:flex-start}.grow{flex:1;min-width:0}.title{font-weight:750;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}.status.bad{color:var(--bad)}.status.warn{color:var(--warn)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent)}button.danger{color:var(--bad)}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.empty{padding:28px;text-align:center;color:var(--muted)}.quote{border-left:3px solid var(--accent);padding-left:10px;margin-top:8px;font-family:ui-serif,Georgia}.pill{display:inline-block;background:var(--accent2);padding:3px 8px;border-radius:999px;font-size:12px}.grid{display:grid;gap:10px}@media(min-width:580px){.grid.two{grid-template-columns:1fr 1fr}}@media(max-width:340px){body{padding:8px}.card{padding:10px}.actions button{width:100%}} textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;margin-top:8px}</style></head><body><main class="shell"><div class="eyebrow">Grounded Citations</div><h1>Evidence ledger</h1><p id="summary">Loading ledger...</p><section id="rows" aria-live="polite"></section><div class="actions"><button id="more">Load more</button><button class="primary" id="continue">Continue to draft verification</button><button class="danger" id="cancel">Delete session</button></div></main><script type="module">/*__EXT_APPS_BUNDLE__*/
const {App}=globalThis.ExtApps;const app=new App({name:"Grounded Citations Evidence",version:"1.0.0"},{},{autoResize:true});let data=null;const root=document.getElementById("rows");function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}function render(){root.replaceChildren();const c=data.source_counts;document.getElementById("summary").textContent=`${c.with_verified_evidence} of ${c.total} sources have quotes found in source.`;for(const s of data.rows){const card=text("article","","card");const top=text("div","","row");const body=text("div","","grow");body.append(text("div",`[${s.id}] ${s.display_title}`,"title"),text("div",s.kind==="file"?"Session attachment":s.final_url||"User-provided text","meta"));const status=text("span",s.quotes.length?"Found in source":"Evidence missing",`status ${s.quotes.length?"":"warn"}`);top.append(body,status);card.append(top);for(const q of s.quotes)card.append(text("blockquote",q.text,"quote"));if(s.final_url){const open=text("button","Open source");open.onclick=()=>app.openLink({url:s.final_url});card.append(open)}const input=document.createElement("textarea");input.setAttribute("aria-label",`Replacement quote for source ${s.id}`);input.placeholder="Enter a replacement quote to verify";const verify=text("button","Verify replacement quote");verify.onclick=()=>app.callServerTool({name:"verify_quote",arguments:{session_id:data.session_id,ledger_revision:data.ledger_revision,source_id:s.id,quote:input.value}});const exclude=text("button","Exclude in next revision");exclude.onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:`Exclude source ${s.id} in a new scope revision.`}]});const unverified=text("button","Mark claim unverified");unverified.onclick=()=>app.sendMessage({role:"user",content:[{type:"text",text:`Keep the claim tied to source ${s.id} visibly marked [unverified].`}]});card.append(input,verify,exclude,unverified);root.append(card)}document.getElementById("more").hidden=data.page.next_cursor===null}
app.ontoolresult=result=>{data=result.structuredContent||JSON.parse(result.content?.[0]?.text||"null");render()};function applyTheme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark")}app.onhostcontextchanged=applyTheme;await app.connect();applyTheme(app.getHostContext());const send=message=>app.sendMessage({role:"user",content:[{type:"text",text:message}]});document.getElementById("more").onclick=async()=>{const result=await app.callServerTool({name:"preview_evidence",arguments:{session_id:data.session_id,ledger_revision:data.ledger_revision,cursor:data.page.next_cursor,page_size:data.page.page_size}});if(result?.structuredContent){data=result.structuredContent;render()}};document.getElementById("continue").onclick=()=>send(`Continue to draft verification using citation ledger revision ${data.ledger_revision} in session ${data.session_id}.`);document.getElementById("cancel").onclick=()=>send(`Cancel and delete citation session ${data.session_id}.`);</script></body></html>
