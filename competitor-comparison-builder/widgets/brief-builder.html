<!doctype html><meta charset="utf-8"><title>Comparison brief</title><body><h1>Build a comparison brief</h1><p>Paste verified facts only. This tool never publishes.</p><textarea id="json" rows="18" cols="70" placeholder='{"pageFormat":"you-vs-competitor","yourProduct":"...","category":"...","competitors":["..."],"audience":"...","differentiators":["..."],"facts":[{"product":"...","attribute":"...","value":"...","sourceUrl":"https://...","dateChecked":"2026-10-12"}],"mustNotSay":[]}'></textarea><button id="review">Review brief</button><p id="status"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Comparison Brief',version:'1.0.0'},{},{autoResize:true}),status=document.querySelector('#status');document.querySelector('#review').onclick=async()=>{let toolArgs;try{toolArgs=JSON.parse(document.querySelector('#json').value)}catch{status.textContent='Enter valid brief JSON.';return}try{const r=await app.callServerTool({name:'review_comparison_brief',arguments:toolArgs});if(r.isError)throw Error();await app.sendMessage({role:'user',content:[{type:'text',text:`Review this comparison brief: ${JSON.stringify(r.structuredContent.normalizedBrief)}`}]});status.textContent='Brief ready for approval.'}catch{status.textContent='Brief review failed.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
