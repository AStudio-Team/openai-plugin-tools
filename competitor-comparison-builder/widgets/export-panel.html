<!doctype html><meta charset="utf-8"><title>Export comparison page</title><body><h1>Export comparison page</h1><button data-format="markdown">Export Markdown</button><button data-format="html">Export HTML</button><p id="status"></p><h2 id="name"></h2><pre id="content"></pre><button id="copy" hidden>Copy</button><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Comparison Page Export',version:'1.0.0'},{},{autoResize:true}),status=document.querySelector('#status'),out=document.querySelector('#content'),name=document.querySelector('#name'),copy=document.querySelector('#copy');let state={};app.ontoolresult=e=>state=e.structuredContent||state;app.ontoolinput=e=>state=e.arguments||state;async function go(format){const arguments={brief:state.brief,page:state.page,approvalReceipt:state.approvalReceipt,format};try{const r=await app.callServerTool({name:'export_comparison_page',arguments});if(r.isError)throw Error();const f=r.structuredContent;name.textContent=f.fileName;out.textContent=f.content;copy.hidden=false;status.textContent=`${f.fileName} is ready. Copy it below.`;try{await app.sendMessage({role:'user',content:[{type:'text',text:`Exported ${f.fileName}; content is shown inline.`}]})}catch{status.textContent+=' Chat announcement unavailable.'}try{const x=await app.downloadFile({contents:[{type:'resource',resource:{uri:`file:///${f.fileName}`,mimeType:f.mimeType,text:f.content}}]});if(x?.isError)throw Error()}catch{status.textContent+=' Download is not available in this host.'}}catch{status.textContent='Export failed. Validate the page and receipt first.'}}document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>go(b.dataset.format));copy.onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);status.textContent='Copied.'}catch{status.textContent='Copy unavailable.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
