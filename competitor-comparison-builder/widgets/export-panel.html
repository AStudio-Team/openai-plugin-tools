<!doctype html><meta charset="utf-8"><title>Export comparison page</title><body><h1>Export comparison page</h1><button data-format="markdown">Export Markdown</button><button data-format="html">Export HTML</button><p id="status"></p><section id="file" hidden><h2 id="name"></h2><button id="copy">Copy</button><pre id="content"></pre></section><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Comparison Page Export',version:'1.0.1'},{},{autoResize:true}),status=document.querySelector('#status'),fileBox=document.querySelector('#file'),out=document.querySelector('#content'),name=document.querySelector('#name');let input={},data={};const toolText=result=>result.content?.filter(item=>item.type==='text').map(item=>item.text).join('\n')||'Export failed.';function show(file){if(!file?.content)return;name.textContent=file.fileName;out.textContent=file.content;fileBox.hidden=false}async function go(format){const arguments={brief:input.brief||data.brief,page:input.page||data.page,approvalReceipt:input.approvalReceipt||data.approvalReceipt,format};let response;try{response=await app.callServerTool({name:'export_comparison_page',arguments})}catch{status.textContent='Export failed. Validate the page and receipt first.';return}if(response.isError||!response.structuredContent?.content){status.textContent=toolText(response);return}const exported=response.structuredContent;show(exported);status.textContent=`${exported.fileName} is ready. Copy the text below.`;try{await app.sendMessage({role:'user',content:[{type:'text',text:`Exported ${exported.fileName} (${exported.mimeType}); the content is shown in the card.`}]})}catch{status.textContent+=' Chat announcement not delivered.'}try{const downloaded=await app.downloadFile({contents:[{type:'resource',resource:{uri:`file:///${exported.fileName}`,mimeType:exported.mimeType,text:exported.content}}]});if(downloaded?.isError)throw Error('download denied')}catch{status.textContent+=' Download is not available in this host.'}}document.querySelectorAll('[data-format]').forEach(button=>button.onclick=()=>go(button.dataset.format));document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);status.textContent='Copied.'}catch{status.textContent='Copy unavailable.'}};app.ontoolinput=event=>{try{input=event.arguments||event||input}catch{status.textContent='Invalid export input.'}};app.ontoolresult=event=>{try{if(event.structuredContent){data=event.structuredContent;show(data)}}catch{status.textContent='The exported file could not be shown.'}};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
