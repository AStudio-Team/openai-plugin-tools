<!doctype html><meta charset="utf-8"><title>Comparison page review</title><body><h1>Comparison page review</h1><pre id="page">Waiting for a page.</pre><label>Section <input id="section" value="TL;DR"></label><label>Instruction <input id="instruction"></label><button id="revise" disabled>Request revision</button><p id="status"></p><script type="module">(()=>{/*__EXT_APPS_BUNDLE__*/})();const {App}=globalThis.ExtApps,app=new App({name:'Comparison Page Review',version:'1.0.0'},{},{autoResize:true}),out=document.querySelector('#page'),btn=document.querySelector('#revise'),status=document.querySelector('#status');let d;app.ontoolresult=e=>{d=e.structuredContent||{};out.textContent=JSON.stringify(d,null,2);btn.disabled=!d.brief||!d.page};btn.onclick=async()=>{btn.disabled=true;const arguments={brief:d.brief,page:d.page,section:document.querySelector('#section').value.trim(),instruction:document.querySelector('#instruction').value.trim()};try{const r=await app.callServerTool({name:'request_page_revision',arguments});if(r.isError)throw Error();await app.sendMessage({role:'user',content:[{type:'text',text:`Revise ${arguments.section}: ${arguments.instruction}`}]});status.textContent='Revision instruction sent.'}catch{status.textContent='Revision failed.'}btn.disabled=false};try{await app.connect()}catch{status.textContent='Host connection is unavailable.'}</script>
