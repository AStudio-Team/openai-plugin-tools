<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light dark;--bg:#f7f4ed;--card:#fff;--ink:#211d1a;--muted:#6c645e;--line:#d9d1c8;--accent:#0b6b57;--soft:#e3f2ed;--bad:#a43225;--warn:#98600e;--radius:16px}*{box-sizing:border-box}html.dark{--bg:#171815;--card:#22231f;--ink:#f6f2e9;--muted:#b9b2a8;--line:#41423b;--accent:#73d8bc;--soft:#253c35;--bad:#ff9b8f;--warn:#f2c06f}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:var(--safe-top,0) var(--safe-right,0) var(--safe-bottom,0) var(--safe-left,0)}main{padding:18px;max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:26px;line-height:1.1;margin:5px 0}.stamp{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.notice{background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:11px 13px;border-radius:12px;margin:14px 0;overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 0}.toolbar select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px;max-width:100%;min-height:44px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}table{border-collapse:collapse;width:100%;min-width:970px}th,td{text-align:left;padding:12px;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:color-mix(in srgb,var(--bg) 85%,transparent);position:sticky;top:0}tr:last-child td{border-bottom:0}.retailer{font-weight:800}.sub,.unknown{color:var(--muted);font-size:12px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;text-transform:capitalize}.go{background:#d8f2e8;color:#12533f}.conditional_go{background:#fff0ca;color:#704700}.no_go,.unable_to_verify{background:#fde1dd;color:#7c291f}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button{font:inherit;font-size:12px;font-weight:750;border-radius:999px;border:1px solid var(--line);padding:7px 10px;background:var(--card);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}.detail{margin-top:9px;padding:10px;border-radius:10px;background:var(--bg)}.detail ul{margin:6px 0;padding-left:18px}.sources{word-break:break-word}.footer-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.status{margin:10px 0;color:var(--muted);min-height:20px}.cards{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-width:0;overflow-wrap:anywhere}.row{display:grid;grid-template-columns:125px minmax(0,1fr);gap:7px;margin:7px 0}.row strong{font-size:12px}.hidden{display:none!important}@media(max-width:720px){main{padding:14px;max-width:100%}.table-wrap{display:none}.cards{display:grid;gap:11px;min-width:0}.top{display:block;min-width:0}.stamp{margin-top:7px}.toolbar{display:grid;grid-template-columns:1fr;align-items:stretch}.toolbar label{display:grid;gap:5px}.toolbar select{width:100%}.row{grid-template-columns:105px minmax(0,1fr)}.actions{display:grid;grid-template-columns:1fr}.actions button,.footer-actions button{width:100%;min-height:44px}.footer-actions{display:grid;grid-template-columns:1fr}.notice,.status{min-width:0;max-width:100%}}
  </style>
</head>
<body><main>
  <div class="top"><div><div class="eyebrow">Verified Buy Link</div><h1>Evidence comparison</h1></div><div class="stamp" id="stamp"></div></div>
  <div class="notice">Evidence can change. No candidate is purchased, reserved or opened automatically. Authorization not proven remains a material limitation.</div>
  <div class="toolbar"><span id="count"></span><label>Sort <select id="sort"><option value="evidence">Evidence quality</option><option value="price">Item price</option><option value="retailer">Retailer</option></select></label></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="table-wrap"><table><thead><tr><th>Retailer and product</th><th>Price and delivery</th><th>Evidence</th><th>Returns and risks</th><th>Verdict and controls</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="cards" id="cards"></div>
  <div class="footer-actions"><button id="constraints">Change constraints</button><button id="another">Research another product</button></div>
</main>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App }=globalThis.ExtApps;
const app=new App({name:"Verified Buy Link Comparison",version:"1.0.0"},{serverTools:{}},{autoResize:true});
let report;
function setTheme(context){document.documentElement.classList.toggle("dark",context?.theme==="dark");const inset=context?.safeAreaInsets||{};for(const side of ["top","right","bottom","left"])document.documentElement.style.setProperty(`--safe-${side}`,`${Number(inset[side]||0)}px`)}
function money(candidate){const price=candidate.listing.price;return Number.isFinite(price)?`${candidate.listing.currency||""} ${price.toFixed(2)}`:"Unknown"}
function sourceLabel(candidate){return candidate.citations.length?`Source: ${candidate.citations.join(", ")}`:"No verifying source"}
function text(tag,value,className){const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;return node}
function addRow(container,label,value){const row=text("div","","row");row.append(text("strong",label),text("span",value));container.append(row)}
function details(candidate){const box=text("div","","detail hidden");const reasons=text("ul","");for(const item of [...candidate.verdict_reasons,...candidate.risk_flags.map(flag=>flag.message)])reasons.append(text("li",item));box.append(text("strong","Evidence and limitations"),reasons);if(candidate.citations.length){const list=text("div","","sources");list.textContent=`Sources: ${candidate.citations.join(", ")}`;box.append(list)}return box}
function actionButtons(candidate,detail){
  const wrap=text("div","","actions");
  const inspect=text("button","Inspect evidence");inspect.type="button";inspect.addEventListener("click",()=>{detail.classList.toggle("hidden");inspect.textContent=detail.classList.contains("hidden")?"Inspect evidence":"Hide evidence"});
  const recheck=text("button","Recheck now");recheck.type="button";recheck.addEventListener("click",()=>recheckCandidate(candidate,false,recheck));
  const select=text("button","Select for follow-up");select.type="button";select.addEventListener("click",()=>app.sendMessage({role:"user",content:[{type:"text",text:`Inspect candidate ${candidate.candidate_id}, focusing on authorization and return restrictions. Recheck it before presenting any link.`}]}));
  const open=text("button",candidate.open_allowed?"Open product page":"Open unavailable","primary");open.type="button";open.disabled=!candidate.open_allowed;open.addEventListener("click",()=>recheckCandidate(candidate,true,open));
  wrap.append(inspect,recheck,select,open);return wrap;
}
async function recheckCandidate(candidate,openAfter,button){
  const original=button.textContent;button.disabled=true;button.textContent="Rechecking...";document.getElementById("status").textContent=`Rechecking ${candidate.candidate_id} without clicking or submitting anything on the retailer site.`;
  try{
    const result=await app.callServerTool({name:"inspect_buy_option",arguments:{report_id:report.report_id,candidate_id:candidate.candidate_id,focus:"availability"}});
    const value=result.structuredContent;
    if(!value?.candidate)throw new Error("No candidate returned");
    const index=report.candidates.findIndex(item=>item.candidate_id===candidate.candidate_id);report.candidates[index]=value.candidate;
    document.getElementById("status").textContent=value.changes?.length?`${value.changes.length} fact(s) changed. Review the updated evidence.`:"No tracked facts changed in the immediate recheck.";
    render();
    if(openAfter){if(value.candidate.open_allowed)await app.openLink({url:value.candidate.listing.normalized_product_url});else document.getElementById("status").textContent="The link was withdrawn because the immediate recheck did not verify an acceptable product page and purchase control.";}
  }catch(reason){document.getElementById("status").textContent="Recheck failed. The product page was not opened.";}finally{button.disabled=false;button.textContent=original}
}
function makeDesktop(candidate){const row=document.createElement("tr");const detail=details(candidate);const identity=text("td","");identity.append(text("div",candidate.retailer.display_name,"retailer"),text("div",candidate.listing.title),text("div",candidate.listing.selected_variant,"sub"),text("div",sourceLabel(candidate),"sub"));const price=text("td","");price.append(text("div",money(candidate)),text("div","Delivered total unknown","sub"),text("div",sourceLabel(candidate),"sub"));const evidence=text("td","");evidence.append(text("div",`Match: ${candidate.product_match.status}`),text("div",`Purchase control: ${candidate.purchasability.status} (${candidate.purchasability.control})`),text("div",`Retailer identity: ${candidate.retailer.identity_status}`),text("div",`Authorization: ${candidate.authorization.status}`),text("div",candidate.purchasability.verified_at,"sub"),text("div",sourceLabel(candidate),"sub"));const risk=text("td","");risk.append(text("div",candidate.returns.window_days?`${candidate.returns.window_days}-day return window`:"Return window unknown"),text("div",candidate.risk_flags.map(flag=>flag.message).join(" ")||"No extracted conflict","sub"),text("div",sourceLabel(candidate),"sub"));const verdict=text("td","");verdict.append(text("span",candidate.verdict.replaceAll("_"," "),`badge ${candidate.verdict}`),actionButtons(candidate,detail),detail);row.append(identity,price,evidence,risk,verdict);return row}
function makeCard(candidate){const card=text("article","","card");card.append(text("div",candidate.retailer.display_name,"retailer"),text("div",candidate.listing.title,"sub"));addRow(card,"Variant",candidate.listing.selected_variant);addRow(card,"Item price",money(candidate));addRow(card,"Product match",candidate.product_match.status);addRow(card,"Purchase control",`${candidate.purchasability.status} (${candidate.purchasability.control})`);addRow(card,"Retailer identity",candidate.retailer.identity_status);addRow(card,"Authorization",candidate.authorization.status);addRow(card,"Returns",candidate.returns.window_days?`${candidate.returns.window_days} days`:"Unknown");addRow(card,"Sources",sourceLabel(candidate));const badge=text("span",candidate.verdict.replaceAll("_"," "),`badge ${candidate.verdict}`);const detail=details(candidate);card.append(badge,actionButtons(candidate,detail),detail);return card}
function render(){if(!report)return;let items=[...report.candidates];const mode=document.getElementById("sort").value;if(mode==="price")items.sort((a,b)=>(a.listing.price??Infinity)-(b.listing.price??Infinity));if(mode==="retailer")items.sort((a,b)=>a.retailer.display_name.localeCompare(b.retailer.display_name));const rows=document.getElementById("rows");const cards=document.getElementById("cards");rows.replaceChildren(...items.map(makeDesktop));cards.replaceChildren(...items.map(makeCard));document.getElementById("count").textContent=`${items.length} user-supplied page${items.length===1?"":"s"}`;document.getElementById("stamp").textContent=`Checked ${new Date(report.researched_at).toLocaleString()} | Expires ${new Date(report.expires_at).toLocaleTimeString()}`}
document.getElementById("sort").addEventListener("change",render);document.getElementById("constraints").addEventListener("click",()=>app.sendMessage({role:"user",content:[{type:"text",text:"Change the Verified Buy Link constraints. Return to the market checkpoint and do not research until I confirm again."}]}));document.getElementById("another").addEventListener("click",()=>app.sendMessage({role:"user",content:[{type:"text",text:"Research another product with Verified Buy Link. Open a new intake checkpoint."}]}));
app.ontoolresult=result=>{report=result.structuredContent||JSON.parse(result.content?.find(item=>item.type==="text")?.text||"null");render()};app.onhostcontextchanged=setTheme;await app.connect();setTheme(app.getHostContext());
</script></body></html>
