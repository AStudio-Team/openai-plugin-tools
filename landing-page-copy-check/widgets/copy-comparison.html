<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare page copy</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #888;border-radius:12px;padding:14px}button{font:inherit;padding:9px 14px;font-weight:700}</style></head><body><h1>Compare copy variants</h1><div id="variants" class="grid"></div><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Landing Page Copy Comparison",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#variants"),status=document.querySelector("#status");const plain=c=>({headline:c.headline,subhead:c.subhead,valuePoints:c.valuePoints,proof:c.proof,primaryCta:c.primaryCta,faq:c.faq});const section=(title,items)=>{const box=document.createElement("section"),h=document.createElement("h3"),list=document.createElement("ul");h.textContent=title;for(const item of items||[]){const li=document.createElement("li");li.textContent=typeof item==="string"?item:`${item.name}: ${item.status} - ${item.detail}`;list.append(li)}box.append(h,list);return box};async function exportSelected(data,format){status.textContent=`Preparing ${format} export...`;try{const response=await app.callServerTool({name:"export_page_copy",arguments:{copy:data.selected,brief:data.brief,selectionReceipt:data.selectionReceipt,format}});const file=response.structuredContent;if(!file)throw new Error("No export returned");await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]});status.textContent=`${file.fileName} is ready.`}catch{status.textContent="Export failed. Select the variant again."}}function selectedActions(data){const box=document.createElement("section");box.className="card";const title=document.createElement("h2");title.textContent=`Variant ${data.selectedIndex} selected`;box.append(title);for(const format of ["markdown","html"]){const button=document.createElement("button");button.textContent=`Export ${format === "markdown" ? "Markdown" : "HTML snippet"}`;button.onclick=()=>exportSelected(data,format);box.append(button)}root.append(box)}function render(data){if(data.selected&&data.selectionReceipt){root.replaceChildren();selectedActions(data);return}const raw=data.variants||data.copies||[],variants=raw.map(plain);root.replaceChildren();if(data.warnings?.length)root.append(section("Warnings",data.warnings));raw.forEach((copy,index)=>{const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=copy.headline;const sub=document.createElement("p");sub.textContent=copy.subhead;const list=document.createElement("ul");copy.valuePoints.forEach(x=>{const li=document.createElement("li");li.textContent=x;list.append(li)});const cta=document.createElement("p");cta.textContent=`CTA: ${copy.primaryCta}`;card.append(h,sub,list,section("Proof",copy.proof),cta,section("FAQ",(copy.faq||[]).map(x=>`${x.question} - ${x.answer}`)),section("Issues",copy.issues),section("Checklist",copy.checklist));const button=document.createElement("button");button.textContent=`Select variant ${index+1}`;button.onclick=async()=>{button.disabled=true;try{const result=await app.callServerTool({name:"select_page_copy_variant",arguments:{variants,selected:index+1,brief:data.brief}});const selected=result.structuredContent;if(!selected?.selectionReceipt)throw new Error("No receipt returned");await app.sendMessage({role:"user",content:[{type:"text",text:`Selected variant ${index+1}. Selection receipt: ${JSON.stringify(selected.selectionReceipt)}`}]});status.textContent=`Variant ${index+1} selected.`;render(selected)}catch{status.textContent="Selection failed.";button.disabled=false}};card.append(button);root.append(card)})}app.ontoolresult=e=>{try{render(e.structuredContent||{})}catch{status.textContent="The copy comparison could not be rendered."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
