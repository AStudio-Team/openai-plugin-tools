<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare page copy</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid #888;border-radius:12px;padding:14px}button{font:inherit;padding:9px 14px;font-weight:700}</style></head><body><h1>Compare copy variants</h1><div id="variants" class="grid"></div><p id="status" aria-live="polite"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Landing Page Copy Comparison",version:"1.0.0"},{},{autoResize:true});const root=document.querySelector("#variants"),status=document.querySelector("#status");function render(data){const variants=data.variants||data.copies||[];root.replaceChildren();variants.forEach((copy,index)=>{const card=document.createElement("article");card.className="card";const h=document.createElement("h2");h.textContent=copy.headline;const sub=document.createElement("p");sub.textContent=copy.subhead;const list=document.createElement("ul");copy.valuePoints.forEach(x=>{const li=document.createElement("li");li.textContent=x;list.append(li)});const button=document.createElement("button");button.textContent=`Select variant ${index+1}`;button.onclick=async()=>{button.disabled=true;try{const result=await app.callServerTool({name:"select_page_copy_variant",arguments:{variants,selected:index+1,selectionApproved:true,brief:data.brief}});const receipt=result.structuredContent?.selectionReceipt;await app.sendMessage({role:"user",content:[{type:"text",text:`I explicitly selected landing page copy variant ${index+1}. Use this signed selection receipt for export: ${JSON.stringify(receipt)}`}]});status.textContent=`Variant ${index+1} selected.`}catch{status.textContent="Selection failed.";button.disabled=false}};card.append(h,sub,list,button);root.append(card)})}app.ontoolresult=e=>render(e.structuredContent||{});await app.connect();
</script></body></html>
