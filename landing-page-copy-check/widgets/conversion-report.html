<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversion checklist</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px;max-width:800px}.check{border:1px solid #888;border-radius:10px;padding:12px;margin:9px 0}.pass{border-left:6px solid #287a45}.finding{border-left:6px solid #b34b32}</style></head><body><h1>Conversion checklist</h1><h2 id="score">Not scored</h2><div id="checks"></div><p id="limits"></p><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Landing Page Conversion Report",version:"1.0.0"},{},{autoResize:true});function render(data){document.querySelector("#score").textContent=data.score===null?"Not scored":`Score: ${data.score}/100`;const root=document.querySelector("#checks");root.replaceChildren();for(const item of data.checks||[]){const card=document.createElement("section");card.className=`check ${item.status}`;const h=document.createElement("h3");h.textContent=`${item.name}: ${item.status}`;const p=document.createElement("p");p.textContent=item.detail;card.append(h,p);root.append(card)}document.querySelector("#limits").textContent=data.limits||""}app.ontoolresult=e=>render(e.structuredContent||{});try{await app.connect()}catch{document.querySelector("#limits").textContent="Host connection is unavailable."}
</script></body></html>
