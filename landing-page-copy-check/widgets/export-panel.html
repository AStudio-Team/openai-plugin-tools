<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export page copy</title><style>:root{color-scheme:light dark}body{font:15px system-ui;margin:20px}button{font:inherit;padding:10px 16px;margin:5px;font-weight:700}pre{white-space:pre-wrap;border:1px solid #888;border-radius:8px;padding:12px;max-height:420px;overflow:auto}</style></head><body><h1>Export selected copy</h1><p>Download through the host as Markdown or HTML.</p><button data-format="markdown">Download Markdown</button><button data-format="html">Download HTML</button><p id="status" aria-live="polite"></p><pre id="file" hidden></pre><script type="module">
(()=>{/*__EXT_APPS_BUNDLE__*/})();
const {App}=globalThis.ExtApps;const app=new App({name:"Landing Page Copy Export",version:"1.0.0"},{},{autoResize:true});let input={},data={};const status=document.querySelector("#status"),preview=document.querySelector("#file");function show(file){if(!file?.content)return;preview.textContent=file.content;preview.hidden=false;status.textContent=`${file.fileName} is ready.`}async function download(format){status.textContent="Preparing download";try{const response=await app.callServerTool({name:"export_page_copy",arguments:{copy:input.copy||data.copy,brief:input.brief||data.brief,selectionReceipt:input.selectionReceipt||data.selectionReceipt,format}});const file=response.structuredContent;if(!file)throw new Error("No export returned");show(file);await app.downloadFile({contents:[{type:"resource",resource:{uri:`file:///${file.fileName}`,mimeType:file.mimeType,text:file.content}}]})}catch{status.textContent="Download failed. Confirm a selected variant first."}}document.querySelectorAll("button").forEach(b=>b.onclick=()=>download(b.dataset.format));app.ontoolinput=e=>{try{input=e.arguments||e||{}}catch{status.textContent="Invalid export input."}};app.ontoolresult=e=>{try{data=e.structuredContent||{};show(data)}catch{status.textContent="The exported file could not be shown."}};try{await app.connect()}catch{status.textContent="Could not connect to the host."}
</script></body></html>
